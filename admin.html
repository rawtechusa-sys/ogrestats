// NEW — Event modal
// ═══════════════════════════════════════════════════════════════════════════════

let modalKind      = 'stream';
let modalEditing   = null;   // the existing event object being edited, or null
let modalBusy      = false;
let tagFilePool    = null;   // tags from data/manual_event_tags.json (+ seeds), fetched once
let comboOptions   = [];
let comboIndex     = -1;

function modalIsOpen() {
  const el = document.getElementById('modalOverlay');
  return !!el && !el.hidden;
}

// Option pool: the tag file (+ seeds) unioned with whatever this stream already uses.
function currentTagPool() {
  const streamTags = eventRows().map(ev => ev.tag);
  return ManualEvents.mergeTags(tagFilePool || ManualEvents.SEED_TAGS, streamTags);
}

async function ensureTagPool() {
  if (tagFilePool) return tagFilePool;
  let fileTags = [];
  try {
    const { json } = await ghGetFile('data/manual_event_tags.json');
    if (json && Array.isArray(json.tags)) fileTags = json.tags;
    else if (Array.isArray(json)) fileTags = json;
  } catch (e) {
    // 404-tolerant, and an unreachable API just means seeds-only this session.
    console.warn('[admin] tag list unavailable:', e.message);
  }
  tagFilePool = ManualEvents.mergeTags(ManualEvents.SEED_TAGS, fileTags);
  return tagFilePool;
}

function openModal(init) {
  const ev = init && init.event ? init.event : null;
  modalEditing = ev;
  modalBusy = false;

  document.getElementById('modalTitle').textContent = ev ? 'Edit event' : 'Add event';
  document.getElementById('evTag').value = ev ? ev.tag : '';
  document.getElementById('evValue').value = (ev && Number.isFinite(ev.value)) ? String(ev.value) : '';
  document.getElementById('evNote').value = (ev && typeof ev.note === 'string') ? ev.note : '';
  document.getElementById('evWarn').textContent = '';
  document.getElementById('evError').textContent = '';

  const kind = ev ? ev.kind : ((init && init.kind) || 'stream');
  document.getElementById('evStart').value =
    (ev && ev.kind !== 'stream') ? tsToField(ev.ts)
    : (init && init.ts != null) ? tsToField(init.ts) : '';
  document.getElementById('evEnd').value =
    (ev && ev.kind === 'range') ? tsToField(ev.end_ts)
    : (init && init.end_ts != null) ? tsToField(init.end_ts) : '';

  setModalKind(kind);
  syncGoalField();
  setDeleteVisible(!!ev);
  setModalBusy(false);

  document.getElementById('modalOverlay').hidden = false;
  closeCombo();
  ensureTagPool().catch(() => {});
  document.getElementById('evTag').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').hidden = true;
  closeCombo();
  modalEditing = null;
}

function setDeleteVisible(on) {
  document.getElementById('evDelete').hidden = !on;
  document.getElementById('evDeleteConfirm').hidden = true;
  // The confirm button disables itself while a delete is in flight; clear that
  // here so the next expand isn't dead.
  document.getElementById('evDeleteYes').disabled = false;
}

function setModalBusy(busy) {
  modalBusy = busy;
  const save = document.getElementById('evSave');
  save.disabled = busy;
  save.textContent = busy ? 'Saving…' : 'Save';
  document.getElementById('evCancel').disabled = busy;
  document.getElementById('evDelete').disabled = busy;
}

function setModalKind(kind) {
  modalKind = (kind === 'point' || kind === 'range') ? kind : 'stream';
  document.querySelectorAll('#evKind button').forEach(b => {
    b.classList.toggle('active', b.dataset.kind === modalKind);
  });
  const startField = document.getElementById('evStartField');
  const endField   = document.getElementById('evEndField');
  // The sign is part of the format: a time before the anchor is enterable.
  const unit = hasAnchor() ? '(±h:mm:ss)' : '(unix seconds)';
  startField.hidden = (modalKind === 'stream');
  endField.hidden   = (modalKind !== 'range');
  document.getElementById('evStartLabel').textContent =
    (modalKind === 'range' ? 'Start ' : 'Timestamp ') + unit;
  document.getElementById('evEndLabel').textContent = 'End ' + unit;
  // Values carry across a kind switch: Timestamp and Start share one field, so
  // Timestamp->Range keeps the time as Start and Range->Timestamp keeps Start.
  updateEchoes();
}

// The goal field belongs to the two goal tags only, so it follows whatever the
// tag box currently holds (typing, picking from the combo, or opening an event).
function syncGoalField() {
  const tag = document.getElementById('evTag').value;
  document.getElementById('evValueField').hidden = !ManualEvents.isGoalTag(tag);
}

function goalFieldVisible() {
  return !document.getElementById('evValueField').hidden;
}

function updateEchoes() {
  const startTsVal = fieldToTs(document.getElementById('evStart').value);
  const endTsVal   = fieldToTs(document.getElementById('evEnd').value);
  document.getElementById('evStartEcho').textContent =
    startTsVal == null ? '' : fmtWall(startTsVal);
  document.getElementById('evEndEcho').textContent =
    endTsVal == null ? '' : fmtWall(endTsVal);
  updateWindowWarning(startTsVal, endTsVal);
}

// Non-blocking: a time outside the stream window still saves.
function updateWindowWarning(startTsVal, endTsVal) {
  const warn = document.getElementById('evWarn');
  if (modalKind === 'stream' || !hasAnchor()) { warn.textContent = ''; return; }
  const lo = activeAnchorTs - 3600;
  const hi = (activeEndTs != null ? activeEndTs : activeAnchorTs) + 3600;
  const outside = [startTsVal, modalKind === 'range' ? endTsVal : null]
    .some(v => v != null && (v < lo || v > hi));
  warn.textContent = outside ? 'outside stream window' : '';
}

// ── Tag combobox ──
function closeCombo() {
  const list = document.getElementById('evTagList');
  list.hidden = true;
  list.innerHTML = '';
  comboOptions = [];
  comboIndex = -1;
  document.getElementById('evTag').setAttribute('aria-expanded', 'false');
}

function renderCombo() {
  const input = document.getElementById('evTag');
  const list  = document.getElementById('evTagList');
  const typed = input.value.trim();
  const lower = typed.toLowerCase();
  const pool  = currentTagPool();
  const matches = typed ? pool.filter(t => t.toLowerCase().includes(lower)) : pool.slice();
  const exact = pool.some(t => t.toLowerCase() === lower);

  comboOptions = [];
  if (typed && !exact) comboOptions.push({ value: typed, create: true });
  for (const t of matches) comboOptions.push({ value: t, create: false });

  if (comboOptions.length === 0) { closeCombo(); return; }
  comboIndex = 0;
  list.innerHTML = comboOptions.map((o, i) =>
    `<div class="combo-opt${o.create ? ' create' : ''}${i === 0 ? ' active' : ''}" role="option" data-i="${i}">${
      o.create ? `Create "${escHtml(o.value)}"` : escHtml(o.value)
    }</div>`).join('');
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  list.querySelectorAll('.combo-opt').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();   // don't blur the input before the click lands
      pickCombo(Number(el.dataset.i));
    });
  });
}

function highlightCombo() {
  const list = document.getElementById('evTagList');
  list.querySelectorAll('.combo-opt').forEach((el, i) => {
    el.classList.toggle('active', i === comboIndex);
  });
  const active = list.querySelector('.combo-opt.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

// Picking an existing option snaps the input to that option's stored casing.
function pickCombo(i) {
  const opt = comboOptions[i];
  if (!opt) return;
  document.getElementById('evTag').value = opt.value;
  syncGoalField();
  closeCombo();
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Persistence (per-stream events file + the shared tag list)
// ═══════════════════════════════════════════════════════════════════════════════

// Read-modify-write of data/streams/<id>/events_manual.json. The first GET is
// seeded from page state; a conflict re-GETs and replays `mutate`.
// Returns true when the result was applied to page state, false when the
// curator switched streams while the write was in flight -- the write itself
// still landed on the stream it started on, but its {doc, sha} must NOT be
// assigned over whatever loadStream has since installed.
async function persistEvents(mutate, message) {
  const streamId = activeStreamId;   // captured: the path must not follow a stream switch
  if (!streamId) throw new Error('no stream selected');
  const path = `data/streams/${streamId}/events_manual.json`;
  const result = await ghSaveWithRetry(path, (json) => {
    const events = (json && typeof json === 'object' && Array.isArray(json.events))
      ? json.events.slice()
      : (Array.isArray(json) ? json.slice() : []);
    const doc = { version: 1, events };
    mutate(doc);
    return doc;
  }, message, 3, { json: manualState.doc, sha: manualState.sha });
  if (streamId !== activeStreamId) return false;
  manualState = { doc: result.doc, sha: result.sha };
  adminManual = ManualEvents.normalize(result.doc);
  return true;
}

// Merge a brand-new tag into data/manual_event_tags.json. Non-fatal on failure:
// the tag still lives on the event, and stays in this session's option pool.
async function persistTagIfNew(tag) {
  const key = tag.toLowerCase();
  const pool = tagFilePool || ManualEvents.SEED_TAGS;
  if (pool.some(t => t.toLowerCase() === key)) return;
  try {
    const result = await ghSaveWithRetry('data/manual_event_tags.json', (json) => {
      const existing = (json && Array.isArray(json.tags)) ? json.tags
        : (Array.isArray(json) ? json : []);
      return { version: 1, tags: ManualEvents.mergeTags(existing, [tag]) };
    }, `Manual event tags: add '${tag}'`);
    // Union, not replace: the session pool also carries SEED_TAGS, which a
    // freshly-created (or trimmed) remote file need not list.
    tagFilePool = ManualEvents.mergeTags(pool, result.doc.tags);
  } catch (e) {
    tagFilePool = ManualEvents.mergeTags(pool, [tag]);
    toast(`Tag list not updated: ${e.message}`, 'warn');
  }
}

async function saveEventFromModal() {
  if (modalBusy) return;
  const errEl = document.getElementById('evError');
  errEl.textContent = '';

  const tag = document.getElementById('evTag').value.trim();
  if (!tag) { errEl.textContent = 'Tag is required.'; return; }

  const note = document.getElementById('evNote').value.trim();
  let ts = null, endTs = null;
  if (modalKind !== 'stream') {
    ts = fieldToTs(document.getElementById('evStart').value);
    if (ts == null) { errEl.textContent = 'Enter a valid time.'; return; }
    if (modalKind === 'range') {
      endTs = fieldToTs(document.getElementById('evEnd').value);
      if (endTs == null) { errEl.textContent = 'Enter a valid end time.'; return; }
      if (!(ts < endTs)) { errEl.textContent = 'End must be after start.'; return; }
    }
  }

  // A goal tag must carry its threshold: the chart's hit marker has nothing to
  // compare against without one.
  let goalValue = null;
  if (goalFieldVisible()) {
    const raw = document.getElementById('evValue').value.trim();
    goalValue = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
    if (!Number.isFinite(goalValue) || goalValue <= 0) {
      errEl.textContent = 'Enter the goal as a whole number above 0.';
      return;
    }
  }

  const now = Math.floor(Date.now() / 1000);
  const event = {
    id: modalEditing ? modalEditing.id : ManualEvents.newId(),
    tag,
    kind: modalKind,
    ts: modalKind === 'stream' ? null : ts,
    end_ts: modalKind === 'range' ? endTs : null,
    // Rebuilt from scratch on every edit, so `value` must be re-added here or an
    // edited goal event would silently lose its threshold.
    ...(goalValue != null ? { value: goalValue } : {}),
    note,
    created_ts: (modalEditing && Number.isFinite(modalEditing.created_ts)) ? modalEditing.created_ts : now,
    updated_ts: now,
  };
  const editing = modalEditing;

  setModalBusy(true);
  let applied;
  try {
    applied = await persistEvents(doc => {
      const i = editing ? doc.events.findIndex(e => e && e.id === editing.id) : -1;
      if (i >= 0) doc.events[i] = event;
      else doc.events.push(event);
    }, `Manual event: ${editing ? 'update' : 'add'} '${tag}' on ${activeStreamId}`);
  } catch (e) {
    setModalBusy(false);
    errEl.textContent = e.message;
    toast(`Save failed: ${e.message}`, 'err');
    return;
  }

  await persistTagIfNew(tag);

  setModalBusy(false);
  closeModal();               // the page stays armed, per design
  // `applied` is false when the curator switched streams mid-write: the save
  // landed on the stream it started on, but this page now shows another one.
  if (applied) {
    refreshManualUI();
    toast(editing ? 'Event updated' : 'Event saved', 'ok');
  } else {
    toast('Saved to the previous stream — you switched mid-save', 'warn');
  }
}

async function deleteEvent(ev) {
  let applied;
  try {
    applied = await persistEvents(doc => {
      doc.events = doc.events.filter(e => !(e && e.id === ev.id));
    }, `Manual event: delete '${ev.tag}' on ${activeStreamId}`);
  } catch (e) {
    toast(`Delete failed: ${e.message}`, 'err');
    refreshManualUI();
    return;
  }
  if (modalIsOpen() && modalEditing && modalEditing.id === ev.id) closeModal();
  // A delete that finished after a stream switch must not repaint the new
  // stream's table from the old stream's document.
  if (applied) {
    refreshManualUI();
    toast('Event deleted', 'ok');
  } else {
    toast('Deleted from the previous stream — you switched mid-delete', 'warn');
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Wiring + boot
// ═══════════════════════════════════════════════════════════════════════════════
(function wireAdmin() {
  // ── Gate ──
  document.getElementById('gateBtn').addEventListener('click', () => { unlock(); });
  document.getElementById('gateInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); unlock(); }
  });
  document.getElementById('signOutBtn').addEventListener('click', signOut);

  // ── Modal: kind switch ──
  document.getElementById('evKind').addEventListener('click', e => {
    const btn = e.target.closest('button[data-kind]');
    if (btn) setModalKind(btn.dataset.kind);
  });

  // ── Modal: time fields ──
  for (const id of ['evStart', 'evEnd']) {
    document.getElementById(id).addEventListener('input', updateEchoes);
  }

  // ── Modal: tag combobox ──
  const tagInput = document.getElementById('evTag');
  tagInput.addEventListener('input', () => { renderCombo(); syncGoalField(); });
  tagInput.addEventListener('focus', renderCombo);
  tagInput.addEventListener('blur', () => { setTimeout(closeCombo, 120); });
  tagInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (comboOptions.length === 0) { renderCombo(); return; }
      e.preventDefault();
      comboIndex = (comboIndex + (e.key === 'ArrowDown' ? 1 : -1) + comboOptions.length) % comboOptions.length;
      highlightCombo();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (comboOptions.length && comboIndex >= 0) pickCombo(comboIndex);
      else closeCombo();
    } else if (e.key === 'Escape') {
      // Close only the dropdown; the document handler closes the modal when the
      // dropdown is already shut.
      if (comboOptions.length) { e.stopPropagation(); closeCombo(); }
    }
  });

  // ── Modal: buttons ──
  document.getElementById('evSave').addEventListener('click', saveEventFromModal);
  document.getElementById('evCancel').addEventListener('click', closeModal);
  document.getElementById('evDelete').addEventListener('click', () => {
    document.getElementById('evDelete').hidden = true;
    document.getElementById('evDeleteConfirm').hidden = false;
  });
  document.getElementById('evDeleteNo').addEventListener('click', () => setDeleteVisible(true));
  document.getElementById('evDeleteYes').addEventListener('click', async () => {
    if (!modalEditing) return;
    setModalBusy(true);
    document.getElementById('evDeleteYes').disabled = true;
    await deleteEvent(modalEditing);
    setModalBusy(false);
  });
  // Click the scrim (not the panel) to dismiss.
  document.getElementById('modalOverlay').addEventListener('mousedown', e => {
    if (e.target === e.currentTarget && !modalBusy) closeModal();
  });

  // ── Sidebar search (the input lives outside the rebuilt list, so this binds
  //    once and its value/focus survive timezone-switch rebuilds). ──
  const searchInput = document.getElementById('streamSearch');
  if (searchInput) {
    let searchDebounce = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => applyFilter(searchInput.value), 120);
    });
  }

  if (DRYRUN) document.getElementById('dryrunBadge').hidden = false;

  // ── Boot: the page stays inert behind the gate until a token is stored. ──
  if (storedToken()) { hideGate(); loadStreamList(); }
  else { showGate(''); }
})();
</script>

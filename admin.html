<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Standalone guard: these pages are meant to live inside the index.html shell
     (which owns the tabs, theme and background). If loaded top-level, bounce into
     the shell at this page's tab, carrying any deep-link sub-slug (a stream slug
     here) so admin.html#<slug> -> index.html#admin/<slug> stays shareable. -->
<script>(function(){
  if (window.self !== window.top) return;            // embedded in the shell -> normal
  var slug = 'admin';
  var sub  = location.hash.replace(/^#/, '');
  location.replace('index.html#' + slug + (sub ? '/' + sub : ''));
})();</script>
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Lora:ital,wght@0,400;0,500;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
<script>
  // The UMD zoom plugin auto-registers, but register explicitly as a fallback
  // (re-registering the same plugin is a no-op in Chart.js).
  if (window.Chart && window.ChartZoom) { try { Chart.register(window.ChartZoom); } catch (e) {} }
</script>
<link id="theme-css" rel="stylesheet" href="themes/bog-moss.css">
<style>

  /* ═══════════════════════════════════════════════════════════════════════════
     Layout / sidebar / chart CSS below is lifted from streams.html (same
     convention as channelstats.html): keep it recognizably identical so future
     diffs against streams.html stay readable. The stat-card, pie and
     donation-log rules are dropped; the admin-only rules live in their own
     clearly-marked block at the end.
     ═══════════════════════════════════════════════════════════════════════════ */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    color: var(--text-primary);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* Copy edit vs streams.html: body is a flex column so the admin header strip
     can sit above the sidebar+content grid, which then takes the rest. */
  body { display: flex; flex-direction: column; }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--bg-surface);
    border-right: 1px solid var(--border-default);
    overflow-y: auto;
    padding: 0 0;
    position: relative;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: var(--bg-surface); }
  .sidebar::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  .sidebar-label {
    font-family: 'Rye', serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    padding: 4px 16px 8px;
    text-transform: uppercase;
  }

  /* ── Sidebar search (floats at top of the list while it scrolls) ── */
  .sidebar-search {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-surface);
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border-default);
  }

  .sidebar-search input {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: 7px 9px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .sidebar-search input::placeholder { color: var(--text-muted); opacity: 0.7; }

  .sidebar-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
  }

  .search-noresults {
    padding: 16px;
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  .stream-item {
    padding: 7px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
  }

  /* First line of an item: Date | Time | Length */
  .stream-item-meta {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
  }

  /* Second line: the stream title (ellipsised) */
  .stream-item-title {
    font-family: 'Lora', serif;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .stream-item.active .stream-item-title { color: var(--text-primary); }

  .stream-item:hover {
    background: rgba(100,180,60,0.07);
    border-left-color: rgba(100,180,60,0.3);
  }

  .stream-item.active {
    background: rgba(100,180,60,0.12);
    border-left-color: var(--accent);
  }

  /* White (Onion Layers) theme: replace the hardcoded green highlight with the
     theme's warm amber so the selection doesn't clash with the parchment. */
  html[data-theme="white"] .stream-item:hover {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.10);
    border-left-color: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.45);
  }
  html[data-theme="white"] .stream-item.active {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.16);
  }

  /* Single-line entry: Date | Time | Length */
  .stream-item-date {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent);
  }

  .stream-item-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .stream-item-length {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .stream-item-sep {
    font-size: 12px;
    color: var(--border-default);
  }

  .sidebar-empty {
    padding: 16px;
    font-size: 15px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── Content area ── */
  .content-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Stream title bar -- sits between tab bar and stats */
  .stream-title-bar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    padding: 10px 24px;
    flex-shrink: 0;
    min-height: 44px;
    display: flex;
    align-items: center;
  }

  .stream-title-text {
    font-family: 'Rye', serif;
    font-size: 16px;
    color: var(--accent-bright);
    letter-spacing: 0.03em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.9;
  }

  /* ── Main content ── */
  .main {
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }

  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  /* ── Chart panel ── */
  .chart-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    padding: 16px 20px;
  }

  .chart-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    min-height: 34px;
  }

  .chart-title-wrap {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chart-title {
    font-family: 'Rye', serif;
    font-size: 14px;
    color: var(--text-primary);
    letter-spacing: 0.04em;
  }

  .chart-hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.7;
    letter-spacing: 0.02em;
  }

  /* Whole-stream manual event tags. Fixed low-alpha accent (not a theme var):
     one colour for every manual-event mark, chart overlay included. */
  .manual-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .manual-chip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    line-height: 1.2;
    padding: 1px 7px;
    border: 1px solid rgba(255, 120, 200, 0.55);
    border-radius: 9px;
    background: rgba(255, 120, 200, 0.12);
    color: rgba(255, 120, 200, 0.95);
    white-space: nowrap;
  }

  .chart-legend {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
  }

  /* Each metric category is a vertical column; columns sit side-by-side. */
  .legend-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .legend-group-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.8;
    margin-bottom: 1px;
  }

  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-line   { width: 16px; height: 2px;  border-radius: 1px; flex-shrink: 0; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s ease;
  }

  .legend-item:hover { color: var(--accent); }
  .legend-item.hidden { opacity: 0.35; }

  .chart-wrap { position: relative; width: 100%; height: 400px; }

  /* ── Scrub-and-zoom scrollbar ── */
  .chart-scrollbar {
    position: relative;
    width: 100%;
    height: 16px;
    margin-top: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  .chart-scrollbar-thumb {
    position: absolute;
    top: -1px;
    bottom: -1px;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    background: rgba(var(--accent-glow-r), var(--accent-glow-g), var(--accent-glow-b), 0.22);
    border: 1px solid var(--accent);
    border-radius: 4px;
    cursor: grab;
  }
  .chart-scrollbar-thumb:active { cursor: grabbing; }
  .chart-scrollbar-handle {
    position: absolute;
    top: -1px;
    bottom: -1px;
    width: 9px;
    cursor: ew-resize;
  }
  .chart-scrollbar-handle.left  { left: -1px; }
  .chart-scrollbar-handle.right { right: -1px; }
  .chart-scrollbar-handle::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 9px;
    background: var(--accent);
    border-radius: 1px;
    opacity: 0.85;
  }

  .ts-cell    { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .msg-cell   { font-family: 'Lora', serif; color: var(--text-muted); font-size: 14px; word-break: break-word; }

  /* ── States ── */
  .loading-state, .empty-state, .error-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-muted);
    font-style: italic;
    font-size: 16px;
  }

  .loading-glyph {
    font-family: 'Rye', serif;
    font-size: 32px;
    color: var(--accent);
    animation: flicker 2s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.6); }
    50%       { opacity: 0.7; text-shadow: 0 0 8px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.2); }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     ADMIN-ONLY CSS (nothing below here exists in streams.html)
     ═══════════════════════════════════════════════════════════════════════════ */

  /* ── Header strip ── */
  .admin-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding: 6px 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
  }
  .admin-bar-label {
    font-family: 'Rye', serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-bright);
  }
  .admin-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #6bd48a;
    box-shadow: 0 0 6px rgba(107,212,138,0.8);
  }
  .admin-bar-spacer { flex: 1; }
  .dryrun-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 1px 8px;
    border-radius: 3px;
    border: 1px solid #e8952a;
    color: #e8952a;
    background: rgba(232,149,42,0.12);
  }

  /* ── Buttons ── */
  .admin-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .admin-btn:hover { border-color: var(--accent); color: var(--accent-bright); }
  .admin-btn:disabled { opacity: 0.45; cursor: default; }
  .admin-btn:disabled:hover { border-color: var(--border-default); color: var(--text-primary); }
  /* Armed: the same fixed accent every manual-event mark uses. */
  .admin-btn.active {
    border-color: rgba(255,120,200,0.75);
    color: rgba(255,120,200,0.95);
    background: rgba(255,120,200,0.12);
  }
  .admin-btn.active:hover { border-color: rgba(255,120,200,0.95); color: rgba(255,120,200,1); }
  .admin-btn.danger { border-color: rgba(232,96,96,0.55); color: #e86060; }
  .admin-btn.danger:hover { border-color: #e86060; color: #e86060; }
  .admin-btn.primary { border-color: var(--accent); color: var(--accent-bright); }

  .chart-actions {
    position: absolute;
    right: 0;
    top: 0;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }

  /* Admin chips are edit handles, not decoration. */
  .manual-chip { cursor: pointer; }
  .manual-chip:hover {
    border-color: rgba(255,120,200,0.95);
    background: rgba(255,120,200,0.22);
  }

  /* ── Compact stream info row ── */
  .stream-info {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .stream-info .sep { color: var(--border-default); }
  .stream-info .k { color: var(--accent); }

  .no-chart-note {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    padding: 24px 0;
    text-align: center;
  }

  /* ── Events table ── */
  .events-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    padding: 16px 20px;
  }
  .events-title {
    font-family: 'Rye', serif;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  .events-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  .events-table th {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: left;
    padding: 4px 8px 8px;
    border-bottom: 1px solid var(--border-default);
  }
  .events-table td {
    padding: 8px 8px;
    border-bottom: 1px solid rgba(100,180,60,0.07);
    vertical-align: top;
  }
  .events-table tr:last-child td { border-bottom: none; }
  .events-table tr:hover td { background: rgba(100,180,60,0.05); }
  html[data-theme="white"] .events-table td {
    border-bottom-color: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.16);
  }
  html[data-theme="white"] .events-table tr:hover td {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.07);
  }
  .events-empty { font-size: 14px; color: var(--text-muted); font-style: italic; }
  .kind-badge {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid rgba(255,120,200,0.4);
    background: rgba(255,120,200,0.10);
    color: rgba(255,120,200,0.95);
    white-space: nowrap;
  }
  html[data-theme="white"] .kind-badge { color: #a3336f; border-color: rgba(163,51,111,0.45); }
  .tag-cell { font-family: 'Share Tech Mono', monospace; color: var(--text-primary); }
  .echo { display: block; font-size: 11px; opacity: 0.7; }

  /* ── Auth gate ── */
  .gate-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg-base);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate-overlay[hidden] { display: none; }
  .gate-panel {
    width: min(430px, 100%);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .gate-error { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #e86060; min-height: 16px; }

  /* ── Shared form controls ── */
  .admin-input {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: 7px 9px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .admin-input::placeholder { color: var(--text-muted); opacity: 0.7; }
  .admin-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  /* An author `display` beats the UA's [hidden] rule, so restate it. */
  .field[hidden] { display: none; }
  .field-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .field-echo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.85;
    min-height: 14px;
  }

  /* ── Event modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-panel {
    width: min(470px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--bg-base);
    border: 1px solid var(--border-default-strong);
    border-radius: 6px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-title {
    font-family: 'Rye', serif;
    font-size: 15px;
    color: var(--accent-bright);
    letter-spacing: 0.04em;
  }
  .modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .modal-actions .spacer { flex: 1; }
  .modal-warn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: #e8952a;
    min-height: 16px;
  }
  .modal-error {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: #e86060;
    min-height: 16px;
  }

  /* Three-segment kind switch */
  .seg { display: flex; border: 1px solid var(--border-default); border-radius: 4px; overflow: hidden; }
  .seg button {
    flex: 1;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 6px 4px;
    background: transparent;
    border: none;
    border-right: 1px solid var(--border-default);
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { color: var(--accent-bright); }
  .seg button.active {
    background: rgba(255,120,200,0.14);
    color: rgba(255,120,200,0.95);
  }
  html[data-theme="white"] .seg button.active { color: #a3336f; }

  /* Tag combobox */
  .combo { position: relative; }

// ── Theme ─────────────────────────────────────────────────────────────────────
const THEMES = {

  amber: { file: 'themes/firepit.css',        chartGrid: 'rgba(196,125,42,0.08)',   chartTick: '#7a6045', donBar: 'rgba(196,125,42,0.75)',   donBorder: '#e8952a', tooltipBg: '#1c150a', tooltipTitle: '#c47d2a', tooltipBody: '#c8a97a', donTick: '#8a6030',  tooltipBorder: 'rgba(196,125,42,0.4)' },
  grey:  { file: 'themes/dead-stone.css',     chartGrid: 'rgba(160,160,148,0.08)',  chartTick: '#606058', donBar: 'rgba(140,140,130,0.75)',  donBorder: '#b0b0a8', tooltipBg: '#141414', tooltipTitle: '#909088', tooltipBody: '#c0c0b8', donTick: '#606058',  tooltipBorder: 'rgba(160,160,148,0.4)' },

  white: { file: 'themes/onion-layers.css',   chartGrid: 'rgba(120,92,38,0.14)',    chartTick: '#6a5731', donBar: 'rgba(160,109,28,0.80)',  donBorder: '#8a4d08', tooltipBg: '#fbf7ee', tooltipTitle: '#8a4d08', tooltipBody: '#2a2316', donTick: '#6a5731',  tooltipBorder: 'rgba(120,92,38,0.5)' },

// Apply theme from localStorage on load, then listen for live updates from parent.

// ── Utilities ──────────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText} — ${url}`);
  return r.json();
}

async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} — ${url}`);
  return r.text();
}

function parseJSONL(text) {
  return text.trim().split('\n').filter(Boolean).map(l => {
    try { return JSON.parse(l); } catch { return null; }
  }).filter(Boolean);
}

function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleDateString('en-US', withTZ({ month:'short', day:'numeric', year:'numeric' }));
}

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString('en-US', withTZ({ hour:'2-digit', minute:'2-digit' }));
}

function fmtDuration(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function elapsedSeconds(startTs, ts) {
  return Math.max(0, Math.floor(ts - startTs));
}

function fmtElapsed(startTs, ts) {
  const s = elapsedSeconds(startTs, ts);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

function escHtml(str) {
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Toasts
// ═══════════════════════════════════════════════════════════════════════════════
function toast(msg, kind) {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.remove(); }, kind === 'err' ? 7000 : 4000);
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — GitHub writer (Contents API, no git binary)
// ═══════════════════════════════════════════════════════════════════════════════

const TOKEN_KEY = 'admin-gh-token';
// ?dryrun=1 turns every write into a console log. Reads still hit the API.
// Also honoured on the shell's own URL (index.html?dryrun=1#admin): the shell
// loads this page into its iframe as a bare "admin.html", so a query string put
// on admin.html directly never survives the round trip.
const DRYRUN = (() => {
  const test = s => /(^|[?&])dryrun=1(&|$)/.test(s || '');
  if (test(location.search)) return true;
  try { return window.parent !== window && test(window.parent.location.search); }
  catch (e) { return false; }   // cross-origin parent: not our shell
})();

function storedToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
}

// Encode each path segment separately -- the slashes are structure, not data.
function encodePath(path) {
  return String(path).split('/').map(encodeURIComponent).join('/');
}

// btoa() is latin1-only, so UTF-8 encode first and feed btoa the bytes. The
// apply() chunking keeps a long file from blowing the argument limit.
function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  const CHUNK = 8192;
  let binary = '';
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

// The Contents API wraps its base64 at 60 columns, and atob() rejects the
// newlines -- strip all whitespace before decoding.
function b64DecodeUtf8(b64) {
  const clean = String(b64 || '').replace(/\s+/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// Fetch wrapper: adds the API headers, and treats a 401 as "the stored token is
// dead" -- clear it and re-show the gate (the page DOM underneath is untouched).
async function ghApi(path, opts) {
  const options = Object.assign({}, opts || {});
  const headers = Object.assign({
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  }, options.headers || {});
  // Dry run drives the whole editor from a placeholder token, so a real
  // Authorization header would 401 every read. ogrestats is public, so an
  // unauthenticated GET returns exactly the same bytes.
  if (!DRYRUN) headers['Authorization'] = 'Bearer ' + storedToken();
  options.headers = headers;
  const resp = await fetch('https://api.github.com' + path, options);
  if (resp.status === 401) {
    onTokenRejected();
    const err = new Error('401 — token rejected');
    err.status = 401;
    throw err;
  }
  return resp;
}

// Build an Error carrying the HTTP status and GitHub's own `message` field, so
// callers can both show it and test it (the 422-sha conflict check).
async function ghError(resp, path) {
  let message = '';
  try { const j = await resp.json(); if (j && j.message) message = String(j.message); } catch (e) {}
  const err = new Error(`${resp.status}${message ? ' — ' + message : ''} (${path})`);
  err.status = resp.status;
  err.ghMessage = message;
  return err;
}

// GET a JSON file. 404 -> { json: null, sha: null }. Reads go through the API
// (not the raw CDN) so the editor sees its own writes immediately.
async function ghGetFile(path) {
  const url = `/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`;
  const resp = await ghApi(url, { method: 'GET', cache: 'no-store' });
  if (resp.status === 404) return { json: null, sha: null };
  if (!resp.ok) throw await ghError(resp, path);
  const body = await resp.json();
  // Files >1MB come back with encoding:"none" and need the Blobs API. Every file
  // this page touches is tiny, so surface it as a clear error instead.
  if (body.encoding !== 'base64' || typeof body.content !== 'string') {
    throw new Error(`${path}: unsupported encoding "${body.encoding}" — file too large for the Contents API`);
  }
  const text = b64DecodeUtf8(body.content);
  return { json: text.trim() ? JSON.parse(text) : null, sha: body.sha };
}

// PUT a JSON file. Returns the new blob sha. sha=null creates the file.
async function ghPutFile(path, obj, sha, message) {
  if (DRYRUN) {
    console.log('[dryrun] PUT', { path, message, doc: obj });
    return 'dryrun';
  }
  const body = {
    message,
    content: b64EncodeUtf8(JSON.stringify(obj, null, 2) + '\n'),
    branch: BRANCH,
  };
  if (sha) body.sha = sha;
  const url = `/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodePath(path)}`;
  const resp = await ghApi(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw await ghError(resp, path);
  const out = await resp.json();
  return out.content.sha;
}

// Read-modify-write with conflict replay. `seed` lets a caller skip the first
// GET using state it already holds; a conflict always re-GETs and replays
// mutateFn against the fresh document, so a concurrent curator isn't clobbered.
async function ghSaveWithRetry(path, mutateFn, message, maxAttempts = 3, seed) {
  let current = seed || null;
  for (let attempt = 1; ; attempt++) {
    if (!current) current = await ghGetFile(path);
    const doc = mutateFn(current.json);
    try {
      const sha = await ghPutFile(path, doc, current.sha, message);
      return { doc, sha };
    } catch (err) {
      const conflict = err.status === 409
        || (err.status === 422 && /sha/i.test(err.ghMessage || ''));
      if (!conflict || attempt >= maxAttempts) throw err;
      current = null;   // re-GET fresh, replay the mutation
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Auth gate
// ═══════════════════════════════════════════════════════════════════════════════

function gateIsOpen() {
  const el = document.getElementById('gateOverlay');
  return !el || !el.hidden;
}

function showGate(message) {
  const el = document.getElementById('gateOverlay');
  if (!el) return;
  el.hidden = false;
  document.getElementById('gateError').textContent = message || '';
  const input = document.getElementById('gateInput');
  input.value = '';
  input.focus();
  document.getElementById('adminDot').style.background = 'var(--text-muted)';
  document.getElementById('adminDot').style.boxShadow = 'none';
}

function hideGate() {
  const el = document.getElementById('gateOverlay');
  if (el) el.hidden = true;
  document.getElementById('adminDot').style.background = '#6bd48a';
  document.getElementById('adminDot').style.boxShadow = '0 0 6px rgba(107,212,138,0.8)';
}

// A later call rejected the stored token: drop it and re-show the gate. The page
// underneath (including an open modal) is left exactly as it was.
function onTokenRejected() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  if (!gateIsOpen()) {
    toast('GitHub token rejected — sign in again', 'err');
    showGate('Token invalid or revoked.');
  }
}

async function tokenHasWriteAccess(token) {
  let resp;
  try {
    resp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
    });
  } catch (e) {
    return { ok: false, error: 'GitHub unreachable.' };
  }
  if (resp.status === 401) return { ok: false, error: 'Token invalid or revoked.' };
  if (!resp.ok) return { ok: false, error: `GitHub error ${resp.status}.` };
  let json = null;
  try { json = await resp.json(); } catch (e) {}
  if (!json || !json.permissions || json.permissions.push !== true) {
    return { ok: false, error: 'Token lacks write access (needs Contents read/write).' };
  }
  return { ok: true };
}

async function unlock() {
  const input = document.getElementById('gateInput');
  const btn   = document.getElementById('gateBtn');
  const err   = document.getElementById('gateError');
  const token = input.value.trim();
  if (!token) { err.textContent = 'Paste a token first.'; return; }

  // Dry run never writes, and its whole point is UI testing without a real PAT
  // -- validating a placeholder token here would 401 and lock the page out.
  if (!DRYRUN) {
    btn.disabled = true;
    err.textContent = 'checking…';
    const result = await tokenHasWriteAccess(token);
    btn.disabled = false;
    if (!result.ok) { err.textContent = result.error; return; }
  }

  try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  err.textContent = '';
  hideGate();
  loadStreamList();
}

function signOut() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  showGate('');
}

// ═══════════════════════════════════════════════════════════════════════════════
// Stream list + sidebar search — lifted from streams.html (one copy edit, marked)
// ═══════════════════════════════════════════════════════════════════════════════
async function loadStreamList() {
  const listEl = document.getElementById('streamList');
  try {
    // Fat index entries carry title, but legacy/pre-backfill entries may not;
    // channel_stats.json (a dict keyed by stream_id) has them for every stream in
    // one fetch, so fetch both in parallel and build an id->title fallback map. A
    // failed/blocked channel_stats must not break the list -- titles just degrade
    // to de-slugified ids.
    const [index, titleMap] = await Promise.all([
      fetchJSON(`${RAW}/data/streams/index.json`),
      fetchJSON(`${RAW}/data/channel_stats.json`)
        .then(data => {
          // channel_stats.json is { ..., streams: { <stream_id>: {title, ...} } } --
          // a dict keyed by stream_id, not a bare array (see channelstats.html).
          const m = new Map();
          for (const r of Object.values(data?.streams || {})) {
            if (r && r.stream_id && r.title) m.set(r.stream_id, String(r.title));
          }
          return m;
        })
        .catch(() => new Map()),
    ]);

    if (index.length === 0) {
      listEl.innerHTML = '<div class="sidebar-empty">no streams yet — check back after the next broadcast</div>';
      return;
    }

    let streams;
    if (typeof index[0] === 'object' && index[0] !== null) {
      // Fat index: each entry is {id, start_ts, end_ts, platforms} — everything
      // the sidebar renders is already here, so no per-stream metadata fetch.
      // The full metadata.json + events.jsonl load lazily on click (loadStream).
      streams = index.map(e => ({ id: e.id, meta: e }));
    } else {
      // Legacy string-array index: fall back to fetching each metadata.json.
      const metaResults = await Promise.allSettled(
        index.map(id => fetchJSON(`${RAW}/data/streams/${id}/metadata.json`))
      );
      streams = index.map((id, i) => ({
        id,
        meta: metaResults[i].status === 'fulfilled' ? metaResults[i].value : null,
      }));
    }

    // Newest-first by start_ts.
    streams.sort((a, b) => (b.meta?.start_ts ?? 0) - (a.meta?.start_ts ?? 0));

    listEl.innerHTML = '<div class="sidebar-label">Streams</div>';
    searchIndex = [];

    for (const [idx, { id, meta }] of streams.entries()) {
      const div = document.createElement('div');
      div.className = 'stream-item' + (idx === 0 ? ' active' : '');
      div.dataset.id = id;

      let datePart = '—';
      let timePart = '';

      if (meta?.start_ts) {
        const utcDate = new Date(meta.start_ts * 1000);
        // MM/DD/YY (month/day/year), in the active timezone (see config.js withTZ).
        datePart = utcDate.toLocaleDateString('en-US', withTZ({
          month: '2-digit', day: '2-digit', year: '2-digit'
        }));
        // Time only, no timezone label.
        timePart = utcDate.toLocaleTimeString('en-US', withTZ({
          hour: 'numeric', minute: '2-digit'
        }));
      }

      const lengthPart = (meta?.end_ts && meta?.start_ts)
        ? fmtDuration(meta.end_ts - meta.start_ts) : '';

      // Fat index entries carry title; fall back to channel_stats.json (legacy
      // entries / pre-backfill), then a de-slugified id (lossy, but better than nothing).
      const title = (meta && meta.title) || titleMap.get(id) || id.replace(/_/g, ' ');

      div.innerHTML = `
        <div class="stream-item-meta">
          <span class="stream-item-date">${datePart}</span>
          <span class="stream-item-sep">|</span>
          <span class="stream-item-time">${timePart}</span>
          ${lengthPart ? `<span class="stream-item-sep">|</span><span class="stream-item-length">${lengthPart}</span>` : ''}
        </div>
        <div class="stream-item-title" title="${escHtml(title)}">${escHtml(title)}</div>
      `;

      div.addEventListener('click', () => {
        document.querySelectorAll('.stream-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        sessionStorage.setItem('selected-stream', id);
        // COPY EDIT vs streams.html: no 'streamselected' postMessage here. That
        // message makes the shell rewrite the hash to #streams/<id>, which would
        // yank this iframe over to the Streams tab mid-edit.
        loadStream(id);
      });

      listEl.appendChild(div);
      searchIndex.push({
        el: div,
        id,
        startTs: meta?.start_ts || null,
        title: title.toLowerCase(),
      });
    }

    // A timezone switch re-runs loadStreamList; re-apply any active filter so date
    // matching reflects the newly-formatted dates and the list isn't reset.
    const searchInput = document.getElementById('streamSearch');
    if (searchInput && searchInput.value.trim()) applyFilter(searchInput.value);

    if (streams.length > 0) {
      // Selection priority: the stream stashed by the shell / last session, else
      // the newest. Deep links (index.html#admin/<slug>) arrive via the shell,
      // which stashes the slug into sessionStorage before the iframe loads.
      const selected = sessionStorage.getItem('selected-stream');
      if (!selectStreamById(selected)) {
        loadStream(streams[0].id);
      }
    }

  } catch (e) {
    listEl.innerHTML = `<div class="sidebar-empty">couldn't reach the swamp<br><small>${e.message}</small></div>`;
  }
}

// ── Sidebar search ───────────────────────────────────────────────────────────
// Self-contained (no fuzzy-search library): a subsequence title matcher plus a
// multi-format/partial date parser, combined so "smash jt march 2022" requires
// both the title fuzzy-match and the date to hold.

// Order-preserving subsequence: every char of `n` appears in `h` in order.
function isSubseq(n, h) {
  let i = 0;
  for (let j = 0; j < h.length && i < n.length; j++) if (h[j] === n[i]) i++;
  return i === n.length;
}
function fuzzyTitleMatch(tokens, title) {
  return tokens.every(t => isSubseq(t, title));
}

// A stream's tz-local Y/M/D, via en-CA's stable YYYY-MM-DD, so date matching agrees
// with the MM/DD/YY shown on each row (both go through withTZ).
function tsParts(ts) {
  const [y, m, d] = new Date(ts * 1000)
    .toLocaleDateString('en-CA', withTZ({ year: 'numeric', month: '2-digit', day: '2-digit' }))
    .split('-').map(Number);
  return { y, m, d };
}

const MONTHS = ['january','february','march','april','may','june','july',
                'august','september','october','november','december'];
function monthNum(w) {
  w = w.toLowerCase().replace(/,$/, '');
  let i = MONTHS.indexOf(w);
  if (i >= 0) return i + 1;
  if (w.length >= 3) { i = MONTHS.findIndex(m => m.slice(0, 3) === w.slice(0, 3)); if (i >= 0) return i + 1; }
  return null;
}

// Expand a 2-digit year to a 4-digit one (all real data is 2000s).
function expandYear(yy) { return yy < 70 ? 2000 + yy : 1900 + yy; }

// Choose {m,d} from a numeric pair. Default US MM/DD (matches the row display);
// switch to DD/MM only when the first number can't be a month but the second can.
// Both > 12 -> null (no valid date).
function monthDay(a, b) {
  if (a >= 1 && a <= 12 && b >= 1 && b <= 31) return { m: a, d: b };   // MM/DD
  if (a > 12 && a <= 31 && b >= 1 && b <= 12) return { m: b, d: a };   // DD/MM
  return null;
}

// Parse one date-ish token -> partial {y?,m?,d?} or null.
function parseDateFragment(str) {
  // ISO-ish: 2022 | 2022-03 | 2022-03-22
  let m = /^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/.exec(str);
  if (m) {
    const out = { y: +m[1] };
    if (m[2] != null) out.m = +m[2];
    if (m[3] != null) out.d = +m[3];
    if (out.m != null && (out.m < 1 || out.m > 12)) return null;
    if (out.d != null && (out.d < 1 || out.d > 31)) return null;
    return out;
  }
  // Slash/dot numeric: A/B/C, A.B.C, A/B, A.B (year may be 4-digit anywhere, or 2-digit last)
  const parts = str.split(/[/.]/);
  if (parts.length === 2 || parts.length === 3) {
    if (!parts.every(p => /^\d{1,4}$/.test(p) && p.length > 0)) return null;
    const nums = parts.map(Number);
    let year = null, md = null;
    if (parts.length === 3) {
      const yi = parts.findIndex(p => p.length === 4);
      if (yi === 0) { year = nums[0]; md = monthDay(nums[1], nums[2]); }       // YYYY/MM/DD-ish
      else { year = parts[2].length === 4 ? nums[2] : expandYear(nums[2]); md = monthDay(nums[0], nums[1]); }
    } else {
      md = monthDay(nums[0], nums[1]);                                          // A/B, no year
    }
    if (!md) return null;
    const out = { m: md.m, d: md.d };
    if (year != null) out.y = year;
    return out;
  }
  return null;
}

// Split a raw query into date fragment(s) + title tokens.
// Lone 1-2 digit numbers stay as title tokens (so titles like "top 10" aren't hijacked).
function parseQuery(raw) {
  const q = raw.trim().toLowerCase();
  if (!q) return { empty: true };
  const tokens = q.split(/\s+/);
  const dateParts = [], titleTokens = [];
  let i = 0;
  while (i < tokens.length) {
    const tok = tokens[i];
    if (/^\d{4}$/.test(tok)
        || /^\d{4}-\d{1,2}(-\d{1,2})?$/.test(tok)
        || /^\d{1,4}[/.]\d{1,4}([/.]\d{1,4})?$/.test(tok)) {
      const p = parseDateFragment(tok);
      if (p) { dateParts.push(p); i++; continue; }
    }
    const mn = monthNum(tok);
    if (mn != null) {
      // Month name, optionally followed by a day and/or a 4-digit year.
      let j = i + 1, day = null, year = null;
      while (j < tokens.length) {
        const nxt = tokens[j].replace(/,$/, '');
        if (/^\d{4}$/.test(nxt) && year == null) { year = +nxt; j++; continue; }
        if (/^\d{1,2}$/.test(nxt) && +nxt >= 1 && +nxt <= 31 && day == null) { day = +nxt; j++; continue; }
        break;
      }
      const p = { m: mn };
      if (day != null) p.d = day;
      if (year != null) p.y = year;
      dateParts.push(p);
      i = j;
      continue;
    }
    titleTokens.push(tok);
    i++;
  }
  return { empty: false, dateParts, titleTokens };
}

function buildDatePredicate(parts) {
  return (ts) => {
    if (!ts) return false;
    const p = tsParts(ts);
    if (parts.y != null && p.y !== parts.y) return false;
    if (parts.m != null && p.m !== parts.m) return false;
    if (parts.d != null && p.d !== parts.d) return false;
    return true;
  };
}

function showNoResults(listEl) {
  if (listEl.querySelector('.search-noresults')) return;
  const div = document.createElement('div');
  div.className = 'search-noresults';
  div.textContent = 'no streams match…';
  listEl.appendChild(div);
}
function removeNoResults(listEl) {
  const el = listEl.querySelector('.search-noresults');
  if (el) el.remove();
}

function applyFilter(raw) {
  const listEl = document.getElementById('streamList');
  const labelEl = listEl.querySelector('.sidebar-label');
  const parsed = parseQuery(raw);

  if (parsed.empty) {
    for (const e of searchIndex) e.el.style.display = '';
    removeNoResults(listEl);
    if (labelEl) labelEl.textContent = 'Streams';
    return;
  }

  const datePreds = parsed.dateParts.map(buildDatePredicate);
  // Month names ("may", "march") are ambiguous: a date filter OR a literal title
  // word. So besides the date-aware interpretation, also try matching the WHOLE
  // raw query as title text -- a stream matches if EITHER holds. This is why a
  // stream titled "may 1st part 2..." is found by "may 1st" even though it wasn't
  // streamed in May.
  const literalTokens = raw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const e of searchIndex) {
    const dateOk    = datePreds.every(fn => fn(e.startTs));
    const titleOk   = parsed.titleTokens.length === 0 || fuzzyTitleMatch(parsed.titleTokens, e.title);
    const literalOk = fuzzyTitleMatch(literalTokens, e.title);
    const ok = literalOk || (dateOk && titleOk);
    e.el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  }
  if (labelEl) labelEl.textContent = shown + (shown === 1 ? ' Stream' : ' Streams');
  if (shown === 0) showNoResults(listEl); else removeNoResults(listEl);
}

// Select a stream in the sidebar by id (mark active, scroll into view, persist,
// load). Returns true if the stream exists in the current list, false otherwise.
function selectStreamById(id) {
  if (!id) return false;
  const item = document.querySelector(`.stream-item[data-id="${CSS.escape(id)}"]`);
  if (!item) return false;
  document.querySelectorAll('.stream-item').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  item.scrollIntoView({ block: 'nearest' });
  sessionStorage.setItem('selected-stream', id);
  loadStream(id);
  return true;
}

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Admin stream detail (simplified from streams.html's loadStream: no stat
// cards, no pies, no donation log; adds the manual-event read + editor chrome)
// ═══════════════════════════════════════════════════════════════════════════════
async function loadStream(streamId) {
  activeStreamId = streamId;
  // Every piece of per-stream state resets WITH the id, not on the success path.
  // A load that fails (or that a newer selection supersedes) must not leave the
  // previous stream's document, sha or anchor behind: a save would then write
  // those events -- and that stale sha -- to THIS stream's path.
  manualState    = { doc: { version: 1, events: [] }, sha: null };
  adminManual    = { timed: [], wholeStream: [] };
  activeAnchorTs = null;
  activeEndTs    = null;
  goalHitsInputs = { donations: [], startTs: null };
  goalHitsCache  = [];
  if (modalIsOpen()) closeModal();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="loading-state"><span class="loading-glyph">~</span><span>wading in...</span></div>`;
  document.getElementById('streamTitle').textContent = '';
  // main.innerHTML above removed the canvas; drop the orphaned Chart instance
  // (and with it the gesture listeners) before resetting the armed state.
  if (currentChart) { currentChart.destroy(); currentChart = null; }
  setArmed(false);
  lastLegendArgs = null;

  try {
    const [meta, eventsText, manual] = await Promise.all([
      fetchJSON(`${RAW}/data/streams/${streamId}/metadata.json`),
      fetchText(`${RAW}/data/streams/${streamId}/events.jsonl`),
      // Manual events come from the Contents API, never the raw CDN: the editor
      // must read its own writes (the CDN lags ~5 min) and needs the blob sha.
      ghGetFile(`data/streams/${streamId}/events_manual.json`),
    ]);
    if (streamId !== activeStreamId) return;   // the curator switched streams mid-fetch

    manualState = {
      doc: manual.json || { version: 1, events: [] },
      sha: manual.sha,
    };
    adminManual = ManualEvents.normalize(manualState.doc);

    if (meta.title) {
      document.getElementById('streamTitle').textContent = meta.title;
    }

    const events    = parseJSONL(eventsText);
    const snapshots = events.filter(e => e.event === 'viewer_snapshot');
    const donations = events.filter(e => e.event === 'donation');

    const startTs   = meta.start_ts;
    const endTs     = meta.end_ts;
    const duration  = (endTs && startTs) ? endTs - startTs : null;

    // Elapsed-time origin for every time field on this page, and the far edge of
    // the "inside the stream window" check.
    activeAnchorTs = (startTs != null) ? startTs
      : (snapshots.length ? snapshots[0].ts : null);
    activeEndTs = (endTs != null) ? endTs
      : (snapshots.length ? snapshots[snapshots.length - 1].ts : null);

    // Donation events carry the source platform they were collected from; the
    // per-platform donation lines only appear when 2+ platforms contributed.
    const donPlatformKeys = ['youtube', 'twitch', 'kick'];
    const donCountBy = { youtube: 0, twitch: 0, kick: 0 };
    for (const d of donations) {
      if (!donPlatformKeys.includes(d.platform)) continue;
      donCountBy[d.platform] += 1;
    }
    const donPlatforms = donPlatformKeys.filter(p => donCountBy[p] > 0);

    const platforms = meta.platforms || [];
    const hasYT = platforms.includes('youtube');
    const hasTW = platforms.includes('twitch');
    const hasKick = platforms.includes('kick');

    // Viewer-data availability is separate from platform membership: a platform
    // that is null or 0 across every snapshot counts as no data, so its line is
    // never drawn and its legend toggle never appears.
    const hasYTViewers = snapshots.some(s => s.youtube);
    const hasTWViewers = snapshots.some(s => s.twitch);
    const hasKickViewers = snapshots.some(s => s.kick);

    main.innerHTML = '';

    // ── Compact info row (replaces streams.html's stat-card grid) ──
    const info = document.createElement('div');
    info.className = 'stream-info';
    const bits = [];
    if (startTs) bits.push(`<span class="k">${escHtml(fmtDate(startTs))}</span>`);
    if (startTs) bits.push(escHtml(fmtTime(startTs)));
    bits.push(duration ? escHtml(fmtDuration(duration)) : '—');
    if (platforms.length) bits.push(escHtml(platforms.join(' · ')));
    bits.push(`<span class="ts-cell">${escHtml(streamId)}</span>`);
    info.innerHTML = bits.join('<span class="sep">|</span>');
    main.appendChild(info);

    // ── Chart panel (always present -- it also hosts Add Event / Reload / chips) ──
    const hasChartData = snapshots.length > 0;
    const panel = document.createElement('div');
    panel.className = 'chart-panel';

    const hasChatRate = snapshots.some(s =>
      s.youtube_messages_per_minute != null || s.twitch_messages_per_minute != null
      || s.kick_messages_per_minute != null
    );
    const hasActiveYT   = hasYT   && snapshots.some(s => s.active_youtube_chatters);
    const hasActiveTW   = hasTW   && snapshots.some(s => s.active_twitch_chatters);
    const hasActiveKick = hasKick && snapshots.some(s => s.active_kick_chatters);
    const hasYTChat   = hasYT   && snapshots.some(s => s.youtube_messages_per_minute);
    const hasTWChat   = hasTW   && snapshots.some(s => s.twitch_messages_per_minute);
    const hasKickChat = hasKick && snapshots.some(s => s.kick_messages_per_minute);

    panel.innerHTML = `
      <div class="chart-header">
        <div class="chart-title-wrap">
          <span class="chart-title">Viewers &amp; Donations</span>
          <span class="chart-hint" id="chartHint">${escHtml(HINT_DEFAULT)}</span>
          <span class="manual-chips" id="manualChips"></span>
        </div>
        <div class="chart-legend" id="chartLegend"></div>
        <div class="chart-actions">
          <button class="admin-btn" id="addEventBtn" type="button">Add Event</button>
          <button class="admin-btn" id="reloadBtn" type="button">Reload</button>
        </div>
      </div>
      ${hasChartData ? `
      <div class="chart-wrap">
        <canvas id="streamChart" role="img" aria-label="Viewer counts, donations and chat rate over stream duration"></canvas>
      </div>
      <div class="chart-scrollbar" id="chartScrollbar">
        <div class="chart-scrollbar-thumb" id="chartScrollbarThumb">
          <div class="chart-scrollbar-handle left"></div>
          <div class="chart-scrollbar-handle right"></div>
        </div>
      </div>` : `
      <div class="no-chart-note">no chart data for this stream — use Add Event for a whole-stream tag</div>`}`;
    main.appendChild(panel);

    document.getElementById('addEventBtn').addEventListener('click', onAddEventClick);
    document.getElementById('reloadBtn').addEventListener('click', () => {
      if (activeStreamId) loadStream(activeStreamId);
    });

    if (hasChartData) {
      buildChart(snapshots, donations, startTs, hasYTViewers, hasTWViewers, hasKickViewers, hasChatRate, hasActiveYT, hasActiveTW, hasActiveKick, hasYTChat, hasTWChat, hasKickChat, donPlatforms, adminManual);
      lastLegendArgs = [hasYTViewers, hasTWViewers, hasKickViewers, hasChatRate, donations.length > 0, hasActiveYT, hasActiveTW, hasActiveKick, hasYTChat, hasTWChat, hasKickChat, donPlatforms];
      buildLegend(...lastLegendArgs);
      wireCanvasGestures();
    } else {
      document.getElementById('chartHint').textContent = 'whole-stream tags only';
    }

    // ── Events table ──
    const tablePanel = document.createElement('div');
    tablePanel.className = 'events-panel';
    tablePanel.innerHTML = `
      <div class="events-title">Manual Events</div>
      <div id="eventsTableWrap"></div>`;
    main.appendChild(tablePanel);

    renderChips();
    renderEventsTable();

  } catch (e) {
    // Same staleness check as the success path: a slow failing load must not
    // paint its error over a newer stream's panel.
    if (streamId !== activeStreamId) return;
    // This stream's document never loaded, so there is nothing safe to edit
    // here. Dropping the id disables the Add Event hotkey too, so a save can't
    // create a file for a stream we could not read. Re-click the row to retry.
    activeStreamId = null;
    main.innerHTML = `<div class="error-state"><span class="loading-glyph">✕</span><span>failed to load stream<br><small>${escHtml(e.message)}</small></span></div>`;
  }
}

// ── Whole-stream chips (clickable on admin: each opens its edit modal) ──
function renderChips() {
  const chipsEl = document.getElementById('manualChips');
  if (!chipsEl) return;
  chipsEl.innerHTML = adminManual.wholeStream.map((ev, i) => {
    const note = typeof ev.note === 'string' ? ev.note.trim() : '';
    const title = note ? ` title="${escHtml(note)}"` : '';
    return `<span class="manual-chip" data-idx="${i}"${title}>${escHtml(ev.tag)}</span>`;
  }).join('');
  chipsEl.querySelectorAll('.manual-chip').forEach(el => {
    el.addEventListener('click', () => {
      const ev = adminManual.wholeStream[Number(el.dataset.idx)];
      if (ev) openModal({ event: ev });
    });
  });
}

// ── Events table: whole-stream first, then timed ascending ──
function eventRows() {
  return adminManual.wholeStream.concat(adminManual.timed);
}

function fmtEventTime(ev) {
  if (ev.kind === 'stream') return '<span class="ts-cell">whole stream</span>';
  const one = (ts) => escHtml(tsToField(ts));   // elapsed h:mm:ss, or raw seconds with no anchor
  const label = ev.kind === 'range' ? `${one(ev.ts)} – ${one(ev.end_ts)}` : one(ev.ts);
  const echo = ev.kind === 'range'
    ? `${escHtml(fmtWall(ev.ts))} – ${escHtml(fmtWall(ev.end_ts))}`
    : escHtml(fmtWall(ev.ts));
  return `<span class="ts-cell">${label}<span class="echo">${echo}</span></span>`;
}

function renderEventsTable() {
  const wrap = document.getElementById('eventsTableWrap');
  if (!wrap) return;
  const rows = eventRows();
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="events-empty">No manual events yet.</div>';
    return;
  }
  const body = rows.map((ev, i) => `
    <tr>
      <td class="tag-cell">${escHtml(ev.tag)}</td>
      <td><span class="kind-badge">${escHtml(ev.kind)}</span></td>
      <td>${fmtEventTime(ev)}</td>
      <td><span class="ts-cell">${Number.isFinite(ev.value) ? escHtml(String(ev.value)) : ''}</span></td>
      <td><span class="msg-cell">${escHtml(typeof ev.note === 'string' ? ev.note : '')}</span></td>
      <td><button class="admin-btn" type="button" data-act="edit" data-idx="${i}">Edit</button></td>
      <td><span data-cell="del" data-idx="${i}"><button class="admin-btn danger" type="button" data-act="del" data-idx="${i}">Delete</button></span></td>
    </tr>`).join('');
  wrap.innerHTML = `
    <table class="events-table">
      <thead><tr>
        <th>Tag</th><th>Kind</th><th>Time</th><th>Value</th><th>Note</th><th>Edit</th><th>Delete</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;

  wrap.querySelectorAll('button[data-act="edit"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ev = eventRows()[Number(btn.dataset.idx)];
      if (ev) openModal({ event: ev });
    });
  });
  // Inline are-you-sure (never window.confirm), scoped to the row's Delete cell.
  wrap.querySelectorAll('button[data-act="del"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const cell = wrap.querySelector(`span[data-cell="del"][data-idx="${idx}"]`);
      if (!cell) return;
      cell.innerHTML = `<span class="ts-cell">sure?</span>
        <button class="admin-btn danger" type="button" data-yes="1">Delete</button>
        <button class="admin-btn" type="button" data-no="1">No</button>`;
      cell.querySelector('[data-no]').addEventListener('click', () => renderEventsTable());
      cell.querySelector('[data-yes]').addEventListener('click', async () => {
        cell.querySelectorAll('button').forEach(b => { b.disabled = true; });
        const ev = eventRows()[idx];
        if (ev) await deleteEvent(ev);
        else renderEventsTable();
      });
    });
  });
}

// Re-point every manual-event surface at the current in-memory document.
function refreshManualUI() {
  if (currentChart) {
    currentChart.$hasManualEvents = adminManual.timed.length > 0;
    // A saved/deleted goal event moves (or removes) its hit marker, so recompute
    // the cache the plugin reads BEFORE the repaint below.
    goalHitsCache = ManualEvents.computeGoalHits(goalHitsInputs.donations, adminManual, goalHitsInputs.startTs);
    currentChart.draw();
    // The legend's Events toggle appears/disappears with $hasManualEvents, so
    // rebuild it whenever the document changed.
    if (lastLegendArgs) buildLegend(...lastLegendArgs);
  }
  renderChips();
  renderEventsTable();
}

function fmtWall(ts) {
  if (!Number.isFinite(ts)) return '';
  return new Date(ts * 1000).toLocaleString('en-US', withTZ({
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit',
  }));
}

// Tooltip keys: Chart.js can't dash its built-in line glyph, but pointStyle
// accepts a canvas (drawPoint renders it verbatim). So we draw a small line
// with the dataset's exact color + dash pattern and use it as the key. Cached
// by color+dash so we don't rebuild one every tooltip render.
const _lineKeyCache = {};
function lineKeyCanvas(color, dash) {
  const pattern = (dash && dash.length) ? dash.join(',') : 'solid';
  const cacheKey = color + '|' + pattern;
  if (_lineKeyCache[cacheKey]) return _lineKeyCache[cacheKey];
  const w = 26, h = 10;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.strokeStyle = color;
  cx.lineWidth = 2;
  cx.setLineDash((dash && dash.length) ? dash : []);
  cx.beginPath();
  cx.moveTo(1, h / 2);
  cx.lineTo(w - 1, h / 2);
  cx.stroke();
  _lineKeyCache[cacheKey] = cv;
  return cv;
}

// Persisted set of dataset labels the user has toggled off; survives stream changes.

// Show/hide each y-axis based on whether any of its datasets are currently visible.
function syncAxisDisplay() {
  if (!currentChart) return;
  const axisMap = {
    yViewers:        [DS.YT_VIEWERS, DS.TW_VIEWERS, DS.KICK_VIEWERS, DS.TOTAL_VIEWERS],
    yActiveChatters: [DS.YT_ACTIVE_CHATTERS, DS.TW_ACTIVE_CHATTERS, DS.KICK_ACTIVE_CHATTERS, DS.TOTAL_ACTIVE_CHATTERS],
    yDonations:      [DS.DONATIONS, DS.DON_YT, DS.DON_TW, DS.DON_KICK],

  };

    });

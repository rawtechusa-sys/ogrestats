// ── Smooth (non-snapping) y-axis auto-fit ───────────────────────────────────
// When the x-axis is zoomed/panned, Chart.js fits each y-axis to ONLY the points
// inside the visible x-window. That inclusion is binary, so the y-scale snaps the
// instant a tall/short point crosses the visible edge. To make the scale move
// continuously, smoothYExtent() computes each axis's min/max itself, letting
// off-screen points still contribute with a weight that decays with distance past
// the edge -- so a peak's influence fades in/out instead of popping. The plugin
// that applies this lives inline in the Chart config (see "smoothYFit").
const MARGIN_FRAC = 0.6;       // off-screen influence band, as a fraction of the visible range
const Y_HEADROOM = 0.05;       // top padding, mirroring Chart.js's auto headroom
const ANCHOR_MIN_ZERO = false; // keep the floating min (set true to floor every axis at 0)

// Smoothstep falloff: 1 at the visible edge (u<=0), 0 beyond the band (u>=1), with a
// continuous slope between. w=1 exactly at the edge so an off-screen point matches its
// own value the moment it scrolls into view -- that equality at the crossing is what
// removes the snap.
function falloff(u) {
  if (u <= 0) return 1;
  if (u >= 1) return 0;
  return 1 - (3 * u * u - 2 * u * u * u);
}

// Pin the smoothYFit x-window to the live x-scale. The scrollbar paths set $xWindow
// explicitly before each instant zoomScale; the zoom plugin's chart-body pan/pinch
// instead move the live x-scale directly, so call this from their onPan/onZoom so the
// y-axes refit to the new region instead of staying pinned to the old window.
function syncXWindow(chart) {
  const x = chart.scales && chart.scales.x;
  if (!x || !isFinite(x.min) || !isFinite(x.max)) return;
  chart.$xWindow = { min: x.min, max: x.max };
}

// Set true (or `currentChart.$smoothYDebug = true` from devtools) to cross-check
// the bounded fast path against the linear reference on every call and warn on any
// divergence. Off in production -- the bounded path is proven equivalent below.
const SMOOTH_Y_DEBUG = false;

// First index i with xs[i] >= target (in [0, xs.length]). xs is sorted ascending.
function lowerBound(xs, target) {
  let lo = 0, hi = xs.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (xs[mid] < target) lo = mid + 1; else hi = mid; }
  return lo;
}
// First index i with xs[i] > target (in [0, xs.length]).
function upperBound(xs, target) {
  let lo = 0, hi = xs.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (xs[mid] <= target) lo = mid + 1; else hi = mid; }
  return lo;
}

// Reference implementation: a full linear scan of every point of every visible set.
// O(N x datasets). Used as the fallback when sets don't share the chart's x-grid,
// and as the oracle for SMOOTH_Y_DEBUG. The bounded path returns identical results.
function windowExtentLinear(sets, xmin, xmax) {
  const R = xmax - xmin;
  const M = MARGIN_FRAC * R;

  // Pass 1: extent of points strictly inside the window.
  let visMin = Infinity, visMax = -Infinity, haveInterior = false;
  // Track the nearest bracketing point on each side for the empty-interior fallback.
  let leftPt = null, leftDist = Infinity, rightPt = null, rightDist = Infinity;
  for (const data of sets) for (const p of data) {
    if (p.y == null || Number.isNaN(p.y)) continue;
    if (p.x >= xmin && p.x <= xmax) {
      haveInterior = true;
      if (p.y < visMin) visMin = p.y;
      if (p.y > visMax) visMax = p.y;
    } else if (p.x < xmin) {
      const d = xmin - p.x;
      if (d < leftDist) { leftDist = d; leftPt = p; }
    } else {
      const d = p.x - xmax;
      if (d < rightDist) { rightDist = d; rightPt = p; }
    }
  }

  if (!haveInterior) {
    // Window sits between samples: seed the extent from the nearest bracketing
    // point(s) at full value so the axis stays meaningful (it can't fade to a
    // collapsed range). It meets the interior case continuously: the instant such
    // a point scrolls in it becomes visMin/visMax directly.
    const seeds = [];
    if (leftPt)  seeds.push(leftPt.y);
    if (rightPt) seeds.push(rightPt.y);
    if (seeds.length === 0) return null;
    visMin = Math.min(...seeds);
    visMax = Math.max(...seeds);
  }

  // Pass 2: let off-screen points pull the envelope outward, fading with distance.
  // Each point's faded candidate is measured from the interior extent (visMin/visMax),
  // and we keep the most extreme candidate -- a nearer, lower peak must not overwrite a
  // farther, taller one, so compare candidates, not raw values.
  let yMin = visMin, yMax = visMax;
  for (const data of sets) for (const p of data) {
    if (p.y == null || Number.isNaN(p.y)) continue;
    if (p.x >= xmin && p.x <= xmax) continue;
    const d = p.x < xmin ? xmin - p.x : p.x - xmax;
    const w = M > 0 ? falloff(d / M) : 0;
    if (w === 0) continue;
    if (p.y > visMax) {
      const cand = visMax + w * (p.y - visMax);
      if (cand > yMax) yMax = cand;
    } else if (p.y < visMin) {
      const cand = visMin + w * (p.y - visMin);
      if (cand < yMin) yMin = cand;
    }
  }

  return padExtent(yMin, yMax);
}

// Bounded fast path: identical result to windowExtentLinear, but binary-searches the
// shared x-grid `xs` (data[i].x === xs[i] for every set) so it only touches the visible
// window plus the off-screen margin band [edge-M, edge]. Points beyond M have falloff
// weight 0 (skipped today too), so excluding them changes nothing; min/max are
// order-independent, so scanning point-major instead of dataset-major is equivalent.
function windowExtentBounded(sets, xs, xmin, xmax) {
  const n = xs.length;
  const R = xmax - xmin;
  const M = MARGIN_FRAC * R;

  const iLo   = lowerBound(xs, xmin);   // first index inside the window (x >= xmin)
  const iHiEx = upperBound(xs, xmax);   // one past the window (first x > xmax)

  // Pass 1: interior extent, scanning only [iLo, iHiEx). haveInterior tracks a real
  // non-null sample (an all-null interior must still fall through to the bracket seed).
  let visMin = Infinity, visMax = -Infinity, haveInterior = false;
  for (const data of sets) {
    for (let i = iLo; i < iHiEx; i++) {
      const y = data[i].y;
      if (y == null || Number.isNaN(y)) continue;
      haveInterior = true;
      if (y < visMin) visMin = y;
      if (y > visMax) visMax = y;
    }
  }

  if (!haveInterior) {
    // Nearest non-null sample just left, then just right, of the window. Walking
    // outward from the boundary and taking the first set with a value at that index
    // reproduces the linear scan's nearest-by-distance, iteration-order tiebreak.
    let leftY = null, rightY = null;
    for (let i = iLo - 1; i >= 0 && leftY === null; i--) {
      for (const data of sets) {
        const y = data[i].y;
        if (y != null && !Number.isNaN(y)) { leftY = y; break; }
      }
    }
    for (let i = iHiEx; i < n && rightY === null; i++) {
      for (const data of sets) {
        const y = data[i].y;
        if (y != null && !Number.isNaN(y)) { rightY = y; break; }
      }
    }
    const seeds = [];
    if (leftY !== null)  seeds.push(leftY);
    if (rightY !== null) seeds.push(rightY);
    if (seeds.length === 0) return null;
    visMin = Math.min(...seeds);
    visMax = Math.max(...seeds);
  }

  // Pass 2: off-screen falloff, restricted to the margin bands. leftStart/rightEnd
  // bound the scan to x within M of the edge; the w === 0 guard still drops the exact
  // boundary, so the band may be a harmless superset of the contributing points.
  let yMin = visMin, yMax = visMax;
  const apply = (i, d) => {
    const w = M > 0 ? falloff(d / M) : 0;
    if (w === 0) return;
    for (const data of sets) {
      const y = data[i].y;
      if (y == null || Number.isNaN(y)) continue;
      if (y > visMax) {
        const cand = visMax + w * (y - visMax);
        if (cand > yMax) yMax = cand;
      } else if (y < visMin) {
        const cand = visMin + w * (y - visMin);
        if (cand < yMin) yMin = cand;
      }
    }
  };
  const leftStart = lowerBound(xs, xmin - M);
  for (let i = leftStart; i < iLo; i++) apply(i, xmin - xs[i]);
  const rightEnd = upperBound(xs, xmax + M);
  for (let i = iHiEx; i < rightEnd; i++) apply(i, xs[i] - xmax);

  return padExtent(yMin, yMax);
}

// Distance-weighted [min,max] for one y-axis over its currently-visible datasets.
// Returns null when the axis has no usable data (caller then leaves Chart's default).
function smoothYExtent(chart, axisId) {
  // Resolve the intended x-window. $xWindow is stashed wherever the window is driven
  // (pan/zoom/reset); fall back to the live x-scale, then to the full data extent so
  // the very first render (before the scrollbar is wired) matches today's full fit.
  let xmin, xmax;
  if (chart.$xWindow) { xmin = chart.$xWindow.min; xmax = chart.$xWindow.max; }
  else if (chart.scales.x && isFinite(chart.scales.x.min)) { xmin = chart.scales.x.min; xmax = chart.scales.x.max; }

  const sets = [];
  chart.data.datasets.forEach((ds, i) => {
    if (ds.yAxisID === axisId && chart.isDatasetVisible(i)) sets.push(ds.data);
  });
  if (sets.length === 0) return null;

  // If we still have no x-window, fit the full extent of the visible data.
  if (xmin == null || !isFinite(xmin) || !isFinite(xmax)) {
    let lo = Infinity, hi = -Infinity;
    for (const data of sets) for (const p of data) {
      if (p.y == null || Number.isNaN(p.y)) continue;
      if (p.y < lo) lo = p.y;
      if (p.y > hi) hi = p.y;
    }
    if (lo > hi) return null;
    return padExtent(lo, hi);
  }

  // Fast path requires the shared x-grid with every visible set aligned to it.
  const xs = chart.$xs;
  let aligned = Array.isArray(xs) && xs.length > 0;
  if (aligned) for (const data of sets) { if (data.length !== xs.length) { aligned = false; break; } }
  if (!aligned) return windowExtentLinear(sets, xmin, xmax);

  const result = windowExtentBounded(sets, xs, xmin, xmax);

  if (SMOOTH_Y_DEBUG || chart.$smoothYDebug) {
    const ref = windowExtentLinear(sets, xmin, xmax);
    const close = (a, b) => (a == null && b == null) ||
      (a != null && b != null && Math.abs(a.min - b.min) < 1e-9 && Math.abs(a.max - b.max) < 1e-9);
    if (!close(result, ref)) console.warn('[smoothYExtent] bounded != linear', { axisId, xmin, xmax, result, ref });
  }

  return result;
}

// Add headroom and guarantee min < max for a finite [lo,hi] pair.
function padExtent(lo, hi) {
  let range = hi - lo;
  if (range <= 0) range = Math.max(Math.abs(hi), 1) * 0.1;
  hi += Y_HEADROOM * range;
  if (ANCHOR_MIN_ZERO) lo = Math.min(lo, 0);
  if (hi <= lo) hi = lo + (Math.max(Math.abs(lo), 1) * 0.1);
  return { min: lo, max: hi };
}

// Tick label callback that clamps tick values to whole numbers. With bounds:'data'
// the axis edges (and thus the first/last tick) sit at the exact smooth min/max,
// which are fractional -- so round every tick to an integer and drop a label that
// repeats the previous tick's rounded value (the fractional edge tick can collide
// with its neighbour in tight ranges). `fmt` renders the final integer.
function intTick(fmt) {
  return (v, i, ticks) => {
    const r = Math.round(v);
    if (i > 0 && Math.round(ticks[i - 1].value) === r) return null;
    return fmt(r);
  };
}

function buildChart(snapshots, donations, startTs, hasYTViewers, hasTWViewers, hasKickViewers, hasChatRate, hasActiveYT, hasActiveTW, hasActiveKick, hasYTChat, hasTWChat, hasKickChat, donPlatforms, manualEvents = { timed: [], wholeStream: [] }) {
  if (currentChart) { currentChart.destroy(); currentChart = null; }

  const ctx = document.getElementById('streamChart');
  if (!ctx) return;

  const snapshotData = snapshots.map(s => ({
    x:          s.ts * 1000,
    yt:         s.youtube ?? null,
    tw:         s.twitch  ?? null,
    kick:       s.kick    ?? null,
    ytMpm:      s.youtube_messages_per_minute ?? null,
    twMpm:      s.twitch_messages_per_minute  ?? null,
    kickMpm:    s.kick_messages_per_minute    ?? null,
    ytActive:   s.active_youtube_chatters     ?? null,
    twActive:   s.active_twitch_chatters      ?? null,
    kickActive: s.active_kick_chatters        ?? null,
    inFrame:    s.in_frame_view ?? null,
    paused:     s.source_paused ?? null,
  }));

  // Pausing band: contiguous time runs where the source was in frame view
  // (in_frame_view >= 0.5), coloured green (playing) / yellow (paused, when
  // source_paused >= 0.5). Each minute spans [x, nextX] (last extends +60s).
  // Adjacent same-state minutes merge into one run. Empty for pre-detector
  // streams (fields null). Read by the `pausingBand` plugin.
  const pausingSegments = [];
  for (let i = 0; i < snapshotData.length; i++) {
    const s = snapshotData[i];
    if (s.inFrame == null || s.inFrame < 0.5) continue;
    const state = (s.paused != null && s.paused >= 0.5) ? 'paused' : 'playing';
    const x0 = s.x;
    const x1 = (i + 1 < snapshotData.length) ? snapshotData[i + 1].x : s.x + 60000;
    const last = pausingSegments[pausingSegments.length - 1];
    if (last && last.state === state && last.x1 === x0) last.x1 = x1;
    else pausingSegments.push({ x0, x1, state });
  }

  // Bucket donations onto the snapshot index grid so the bar dataset shares the
  // same index space as the line series. This keeps mode:'index' tooltips
  // coherent (every dataset's index i is the same timestamp) and prevents a
  // sparse donation bar from hijacking the nearest-index lookup.
  const donationByIndex = new Array(snapshotData.length).fill(0);
  // Per-platform buckets ride along on the same nearest-index search, and only
  // when 2+ platforms have donations -- a lone platform's line duplicates the
  // total, mirroring the Total Viewers / Total Msg-Min gating.
  const splitPlatforms = donPlatforms.length >= 2 ? donPlatforms : [];
  const donationByPlatformIndex = new Map(
    splitPlatforms.map(p => [p, new Array(snapshotData.length).fill(0)])
  );
  if (snapshotData.length > 0) {
    for (const d of donations) {
      const dx = d.ts * 1000;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < snapshotData.length; i++) {
        const dist = Math.abs(snapshotData[i].x - dx);
        if (dist < best) { best = dist; nearest = i; }
        else if (dist > best) break;  // x is sorted ascending; distance is convex
      }
      donationByIndex[nearest] += (d.amount_usd || 0);
      const platformBucket = donationByPlatformIndex.get(d.platform);
      if (platformBucket) platformBucket[nearest] += (d.amount_usd || 0);
    }
  }
  // Running total across the snapshot grid: the donation line is the cumulative
  // money raised up to each point, so it climbs with each donation and plateaus
  // at the stream total. Every index carries a value, making the line solid.
  const donationCumByIndex = new Array(snapshotData.length).fill(0);
  {
    let running = 0;
    for (let i = 0; i < snapshotData.length; i++) {
      running += donationByIndex[i];
      donationCumByIndex[i] = running;
    }
  }
  const donationCumByPlatform = new Map();
  for (const [p, bucket] of donationByPlatformIndex) {
    const cum = new Array(snapshotData.length).fill(0);
    let running = 0;
    for (let i = 0; i < snapshotData.length; i++) {
      running += bucket[i];
      cum[i] = running;
    }
    donationCumByPlatform.set(p, cum);
  }
  const hasDonations = donations.length > 0 && snapshotData.length > 0;

  // Members/subs: the same nearest-index bucketing and running total as the
  // donation series, but counting heads instead of money (ManualEvents.subCount:
  // 1 per membership/sub, N per gift, 0 for everything else). This is what the
  // streamer's sub goals are measured against.
  const memberByIndex = new Array(snapshotData.length).fill(0);
  if (snapshotData.length > 0) {
    for (const d of donations) {
      const count = ManualEvents.subCount(d);
      if (count <= 0) continue;
      const dx = d.ts * 1000;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < snapshotData.length; i++) {
        const dist = Math.abs(snapshotData[i].x - dx);
        if (dist < best) { best = dist; nearest = i; }
        else if (dist > best) break;  // x is sorted ascending; distance is convex
      }
      memberByIndex[nearest] += count;
    }
  }
  const memberCumByIndex = new Array(snapshotData.length).fill(0);
  {
    let running = 0;
    for (let i = 0; i < snapshotData.length; i++) {
      running += memberByIndex[i];
      memberCumByIndex[i] = running;
    }
  }
  const hasMembers = memberCumByIndex.length > 0 && memberCumByIndex[memberCumByIndex.length - 1] > 0;

  // Goal-hit markers: the moments the running members/subs count first met the
  // goal that was active then (see ManualEvents.computeGoalHits). ADMIN EDIT vs
  // streams.html: the goal events are editable here, so the hits cannot be
  // captured at build time -- refreshManualUI recomputes goalHitsCache from
  // these inputs after every save or delete.
  goalHitsInputs = { donations, startTs };
  goalHitsCache = ManualEvents.computeGoalHits(donations, manualEvents, startTs);

  // Time label for the chart x-axis ticks and tooltip, in the active timezone
  // (Ogre/Local/UTC -- see config.js withTZ). Chart.js reformats every tick on every
  // pan/zoom frame, so cache the Intl formatter (rebuilt only when the TZ changes) and
  // memoize per millisecond rather than constructing a formatter on each call.
  let _dtfTz = false, _dtf = null;
  const _dtMemo = new Map();
  function fmtET(ms) {
    const tz = getTimeZone();
    if (tz !== _dtfTz) {
      _dtfTz = tz;
      _dtf = new Intl.DateTimeFormat('en-US', withTZ({ hour: 'numeric', minute: '2-digit' }));
      _dtMemo.clear();
    }
    let s = _dtMemo.get(ms);
    if (s === undefined) { s = _dtf.format(new Date(ms)); _dtMemo.set(ms, s); }
    return s;
  }

  // Cached + memoized integer tick formatters for the y-axes. Same reason as fmtET:
  // ticks are reformatted every frame, and a fresh Intl.NumberFormat per call (which is
  // what Number.toLocaleString() does) dominated the pan profile. One shared formatter
  // (default locale, matching the old toLocaleString) plus a per-value memo.
  const _tickNumFmt = new Intl.NumberFormat();
  const _numMemo = new Map();
  const fmtTickInt = v => { let s = _numMemo.get(v); if (s === undefined) { s = _tickNumFmt.format(v); _numMemo.set(v, s); } return s; };
  const _dollarMemo = new Map();
  const fmtTickDollar = v => { let s = _dollarMemo.get(v); if (s === undefined) { s = '$' + _tickNumFmt.format(v); _dollarMemo.set(v, s); } return s; };

  const t = THEMES[localStorage.getItem('swamp-theme') || 'green'] || THEMES.green;
  const datasets = [];

  // ── Viewer series ──
  // A null viewer sample means the collector had no data for that minute, not
  // zero viewers. Nulls stay null and spanGaps bridges them; the bridged
  // segment is drawn dashed (gapDash) so interpolation is visible as such.
  const gapDash = { borderDash: c => (c.p0.skip || c.p1.skip) ? [5, 5] : undefined };

  if (hasYTViewers && snapshotData.length > 0) {
    datasets.push({
      label: DS.YT_VIEWERS,
      hidden: hiddenDatasets.has(DS.YT_VIEWERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.yt })),
      type: 'line',
      borderColor: '#e84040',
      backgroundColor: 'rgba(232,64,64,0.08)',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: true, spanGaps: true, segment: gapDash,
      yAxisID: 'yViewers',
    });
  }

  if (hasTWViewers && snapshotData.length > 0) {
    datasets.push({
      label: DS.TW_VIEWERS,
      hidden: hiddenDatasets.has(DS.TW_VIEWERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.tw })),
      type: 'line',
      borderColor: '#6650d8',
      backgroundColor: 'rgba(102,80,216,0.08)',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: true, spanGaps: true, segment: gapDash,
      yAxisID: 'yViewers',
    });
  }

  // Kick viewers -- mirrors the YT/TW path; renders for streams whose
  // snapshots carry the backend's kick viewer field (added 2026-07).
  if (hasKickViewers && snapshotData.length > 0) {
    datasets.push({
      label: DS.KICK_VIEWERS,
      hidden: hiddenDatasets.has(DS.KICK_VIEWERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.kick })),
      type: 'line',
      borderColor: '#53fc18',
      backgroundColor: 'rgba(83,252,24,0.08)',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: true, spanGaps: true, segment: gapDash,
      yAxisID: 'yViewers',
    });
  }

  // Total viewers -- shown when 2+ platforms have viewer data; sums the platforms
  // that have data this stream. An index where any of them is null becomes a gap
  // (bridged by spanGaps like the per-platform lines) -- summing the survivors
  // would understate the total exactly where a collector dropped out.
  const totalViewerKeys = [hasYTViewers && 'yt', hasTWViewers && 'tw', hasKickViewers && 'kick'].filter(Boolean);
  if (totalViewerKeys.length >= 2 && snapshotData.length > 0) {
    datasets.push({
      label: DS.TOTAL_VIEWERS,
      hidden: hiddenDatasets.has(DS.TOTAL_VIEWERS),
      data: snapshotData.map(s => ({
        x: s.x,
        y: totalViewerKeys.some(k => s[k] == null)
          ? null
          : totalViewerKeys.reduce((sum, k) => sum + s[k], 0),
      })),
      type: 'line',
      borderColor: '#40c4ff',
      backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true, segment: gapDash,
      yAxisID: 'yViewers',
    });
  }

  // ── Active chatter series ──
  // Built from the full snapshotData (null where missing) so indices stay
  // aligned with the viewer series; spanGaps bridges the nulls visually.
  if (hasActiveYT) {
    datasets.push({
      label: DS.YT_ACTIVE_CHATTERS,
      hidden: hiddenDatasets.has(DS.YT_ACTIVE_CHATTERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.ytActive })),
      type: 'line',
      borderColor: '#e84040',
      backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [2, 2],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yActiveChatters',
    });
  }

  if (hasActiveTW) {
    datasets.push({
      label: DS.TW_ACTIVE_CHATTERS,
      hidden: hiddenDatasets.has(DS.TW_ACTIVE_CHATTERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.twActive })),
      type: 'line',
      borderColor: '#6650d8',
      backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [2, 2],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yActiveChatters',
    });
  }

  if (hasActiveKick) {
    datasets.push({
      label: DS.KICK_ACTIVE_CHATTERS,
      hidden: hiddenDatasets.has(DS.KICK_ACTIVE_CHATTERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.kickActive })),
      type: 'line',
      borderColor: '#53fc18',
      backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [2, 2],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yActiveChatters',
    });
  }

  // Combined active chatters -- sum of every platform with data. Only shown when
  // 2+ platforms are live (a single-platform total duplicates that line). Null at
  // a point only when all present platforms are missing that sample; otherwise a
  // missing side counts as 0.
  if ([hasActiveYT, hasActiveTW, hasActiveKick].filter(Boolean).length >= 2) {
    datasets.push({
      label: DS.TOTAL_ACTIVE_CHATTERS,
      hidden: hiddenDatasets.has(DS.TOTAL_ACTIVE_CHATTERS),
      data: snapshotData.map(s => ({
        x: s.x,
        y: (s.ytActive == null && s.twActive == null && s.kickActive == null)
          ? null : (s.ytActive ?? 0) + (s.twActive ?? 0) + (s.kickActive ?? 0),
      })),
      type: 'line',
      borderColor: '#909090',
      backgroundColor: 'transparent',
      borderWidth: 2, borderDash: [2, 2],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yActiveChatters',
    });
  }

  // ── Donations (cumulative) ──
  if (hasDonations) {
    datasets.push({
      label: DS.DONATIONS,
      hidden: hiddenDatasets.has(DS.DONATIONS),
      data: snapshotData.map((s, i) => ({
        x: s.x,
        y: donationCumByIndex[i],
      })),
      type: 'line',
      borderColor: '#e8c020',
      backgroundColor: 'rgba(232,192,32,0.12)',
      borderWidth: 2,
      pointRadius: 0, pointHoverRadius: 4,
      // Stepped, not interpolated: the total is flat between donations and jumps
      // at the snapshot that first includes the money ('after' puts the riser at
      // that snapshot's x, where the donation was bucketed).
      tension: 0,
      stepped: 'after',
      fill: true,
      yAxisID: 'yDonations',
    });

    for (const p of splitPlatforms) {
      const meta = DON_PLATFORM_META[p];
      const cum = donationCumByPlatform.get(p);
      datasets.push({
        label: meta.ds,
        hidden: hiddenDatasets.has(meta.ds),
        data: snapshotData.map((s, i) => ({
          x: s.x,
          y: cum[i],
        })),
        type: 'line',
        borderColor: meta.color,
        backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [8, 3],
        pointRadius: 0, pointHoverRadius: 4,
        tension: 0,
        stepped: 'after',
        fill: false,
        yAxisID: 'yDonations',
      });
    }
  }

  // ── Members/subs (cumulative count) ──
  // Stepped like the donation total, on its own count axis -- it is heads, not
  // dollars, and the two scales have nothing to do with each other.
  if (hasMembers) {
    datasets.push({
      label: DS.MEMBERS,
      hidden: hiddenDatasets.has(DS.MEMBERS),
      data: snapshotData.map((s, i) => ({
        x: s.x,
        y: memberCumByIndex[i],
      })),
      type: 'line',
      borderColor: '#ffb74d',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0,
      stepped: 'after',
      fill: false,
      yAxisID: 'yMembers',
    });
  }

  // ── Chat rate series ──
  // Built from the full snapshotData so indices align with the viewer series
  // (mode:'index' tooltips match by index, not by x). Missing samples map to
  // null and are bridged with spanGaps; the tooltip filter drops null entries.
  if (hasChatRate && snapshotData.length > 0) {
    if (hasYTChat) {
      datasets.push({
        label: DS.YT_CHAT,
        hidden: hiddenDatasets.has(DS.YT_CHAT),
        data: snapshotData.map(s => ({ x: s.x, y: s.ytMpm })),
        type: 'line',
        borderColor: '#e84040',
        backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [8, 3],
        pointRadius: 0, pointHoverRadius: 4,
        tension: 0.3, fill: false, spanGaps: true,
        yAxisID: 'yChatRate',
      });
    }

    if (hasTWChat) {
      datasets.push({
        label: DS.TW_CHAT,
        hidden: hiddenDatasets.has(DS.TW_CHAT),
        data: snapshotData.map(s => ({ x: s.x, y: s.twMpm })),
        type: 'line',
        borderColor: '#6650d8',
        backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [8, 3],
        pointRadius: 0, pointHoverRadius: 4,
        tension: 0.3, fill: false, spanGaps: true,
        yAxisID: 'yChatRate',
      });
    }

    if (hasKickChat) {
      datasets.push({
        label: DS.KICK_CHAT,
        hidden: hiddenDatasets.has(DS.KICK_CHAT),
        data: snapshotData.map(s => ({ x: s.x, y: s.kickMpm })),
        type: 'line',
        borderColor: '#53fc18',
        backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [8, 3],
        pointRadius: 0, pointHoverRadius: 4,
        tension: 0.3, fill: false, spanGaps: true,
        yAxisID: 'yChatRate',
      });
    }

    // Combined -- sum of every platform with data. Null at a point only when all
    // present platforms are missing that sample; otherwise treat a missing side as
    // 0. Only shown when 2+ platforms are present (a single-platform total would
    // duplicate that platform's line, mirroring Total Active Chatters).
    if ([hasYTChat, hasTWChat, hasKickChat].filter(Boolean).length >= 2) {
      datasets.push({
        label: DS.TOTAL_CHAT,
        hidden: hiddenDatasets.has(DS.TOTAL_CHAT),
        data: snapshotData.map(s => ({
          x: s.x,
          y: (s.ytMpm == null && s.twMpm == null && s.kickMpm == null)
            ? null : (s.ytMpm ?? 0) + (s.twMpm ?? 0) + (s.kickMpm ?? 0),
        })),
        type: 'line',
        borderColor: '#82b1ff',
        backgroundColor: 'transparent',
        borderWidth: 2, borderDash: [12, 3],
        pointRadius: 0, pointHoverRadius: 4,
        tension: 0.3, fill: false, spanGaps: true,
        yAxisID: 'yChatRate',
      });
    }
  }

  // For a series with gaps (null y at some indices), return the value at idx,
  // or the nearest non-null value by index distance. Lets the tooltip show every
  // stat at the hovered position even where that stat has no exact sample.
  function nearestValue(dataArr, idx) {
    const at = dataArr[idx];
    if (at && at.y != null && !Number.isNaN(at.y)) return at.y;
    for (let d = 1; d < dataArr.length; d++) {
      const lo = dataArr[idx - d];
      if (lo && lo.y != null && !Number.isNaN(lo.y)) return lo.y;
      const hi = dataArr[idx + d];
      if (hi && hi.y != null && !Number.isNaN(hi.y)) return hi.y;
    }
    return null;
  }

  // Is at least one dataset for this axis group present in this stream AND not hidden by the user?
  function axisHasVisibleDs(labels) {
    return labels.some(l => datasets.some(d => d.label === l) && !hiddenDatasets.has(l));
  }

  // Pausing band visibility (persisted; default on). Closed over by the
  // pausingBand plugin below and toggled from the legend.
  let showPausingBand = localStorage.getItem('stream-chart-pausing') !== '0';

  // Manual event overlay visibility (persisted; default on), same shape as the
  // pausing band. Closed over by the manualEvents plugin below.
  let showManualEvents = localStorage.getItem('stream-chart-manualevents') !== '0';

  currentChart = new Chart(ctx, {
    type: 'bar',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // Data is already pre-sorted, unique-by-x {x,y} (the shared snapshot grid),
      // so skip Chart.js's per-update parse/sort pass entirely.
      parsing: false,
      normalized: true,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 400 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.tooltipBg,
          borderColor: t.tooltipBorder,
          borderWidth: 1,
          titleColor: t.tooltipTitle,
          bodyColor: t.tooltipBody,
          titleFont: { family: "'Share Tech Mono', monospace", size: 11 },
          bodyFont:  { family: "'Lora', serif", size: 13 },
          // Draw each row's key as a line matching the dataset's color AND dash
          // pattern (see lineKeyCanvas) so the tooltip key mirrors the chart line.
          usePointStyle: true,
          boxWidth: 26,
          boxHeight: 10,
          boxPadding: 6,
          // Order tooltip rows to match the legend on top of the chart.
          itemSort: (a, b) => LEGEND_ORDER.indexOf(a.dataset.label) - LEGEND_ORDER.indexOf(b.dataset.label),
          // Donations only show when that bucket actually has a donation.
          // Continuous series always show -- the label callback fills gaps with
          // the nearest sample, so every stat appears whenever the tooltip is up.
          filter: item => {
            if (item.dataset.yAxisID === 'yDonations') {
              return item.parsed.y != null && !Number.isNaN(item.parsed.y);
            }
            return true;
          },
          callbacks: {
            title: items => fmtET(items[0].parsed.x),
            // Key = a short line in the dataset's color + dash pattern.
            labelPointStyle: item => ({
              pointStyle: lineKeyCanvas(item.dataset.borderColor, item.dataset.borderDash),
              rotation: 0,
            }),
            label: item => {
              const isDon = item.dataset.yAxisID === 'yDonations';
              let y = item.parsed.y;
              if (!isDon && (y == null || Number.isNaN(y))) {
                y = nearestValue(item.dataset.data, item.dataIndex);
              }
              if (y == null || Number.isNaN(y)) return null;
              switch (item.dataset.label) {
                case DS.DONATIONS:          return ` $${y.toFixed(2)} raised so far`;
                case DS.DON_YT:             return ` $${y.toFixed(2)} raised (YT)`;
                case DS.DON_TW:             return ` $${y.toFixed(2)} raised (TW)`;
                case DS.DON_KICK:           return ` $${y.toFixed(2)} raised (Kick)`;
                case DS.MEMBERS:            return ` ${Math.round(y).toLocaleString()} members+subs`;
                case DS.YT_CHAT:            return ` YT chat: ${y.toFixed(1)} mpm`;
                case DS.TW_CHAT:            return ` TW chat: ${y.toFixed(1)} mpm`;
                case DS.KICK_CHAT:          return ` Kick chat: ${y.toFixed(1)} mpm`;
                case DS.TOTAL_CHAT:         return ` Total chat: ${y.toFixed(1)} mpm`;
                case DS.YT_ACTIVE_CHATTERS: return ` YT active chatters: ${Math.round(y).toLocaleString()}`;
                case DS.TW_ACTIVE_CHATTERS: return ` TW active chatters: ${Math.round(y).toLocaleString()}`;
                case DS.KICK_ACTIVE_CHATTERS: return ` Kick active chatters: ${Math.round(y).toLocaleString()}`;
                case DS.TOTAL_ACTIVE_CHATTERS: return ` Total active chatters: ${Math.round(y).toLocaleString()}`;
                default:                    return ` ${item.dataset.label}: ${Math.round(y).toLocaleString()} viewers`;
              }
            }
          }
        },
        // X-axis zoom/pan. Wheel + pinch zoom and drag-to-pan, clamped to the
        // stream's own time range. Double-click the chart to reset (see below).
        // Armed mode disables pan.enabled so a drag draws a range instead.
        zoom: {
          pan: {
            enabled: true, mode: 'x',
            // Sync $xWindow to the live x-scale so smoothYFit refits the y-axes to the
            // panned region (the scrollbar drag does the same). Without this the
            // y-scale stays pinned to the pre-drag window.
            onPan: ({ chart }) => { syncXWindow(chart); chart.$updateScrollbar && chart.$updateScrollbar(); },
          },
          zoom: {
            // Wheel zoom is handled manually in setupScrollbar so it can be eased
            // and less sensitive; pinch stays on the plugin for touch devices.
            wheel: { enabled: false },
            pinch: { enabled: true },
            mode: 'x',
            onZoom: ({ chart }) => { syncXWindow(chart); chart.$updateScrollbar && chart.$updateScrollbar(); },
          },
          limits: { x: { min: 'original', max: 'original' } },
        },
      },
      scales: {
        x: {
          type: 'linear',
          offset: false, // override the bar-chart default so lines span edge-to-edge (no slot padding that grows when zoomed)
          grid: { color: t.chartGrid },
          ticks: {
            color: t.chartTick,
            font: { family: "'Share Tech Mono', monospace", size: 15 },
            callback: v => fmtET(v),
            maxTicksLimit: 10,
          }
        },
        yViewers: {
          type: 'linear',
          position: 'left',
          display: axisHasVisibleDs([DS.YT_VIEWERS, DS.TW_VIEWERS, DS.KICK_VIEWERS, DS.TOTAL_VIEWERS]),
          bounds: 'data', // keep smoothYFit's exact min/max; 'ticks' (default) would round them to tick steps and re-snap the scale
          grid: { color: t.chartGrid },
          ticks: {
            color: '#40c4ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 6,
          },
          title: {
            display: true,
            text: 'viewers',
            color: '#40c4ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yActiveChatters: {
          type: 'linear',
          position: 'left',
          display: axisHasVisibleDs([DS.YT_ACTIVE_CHATTERS, DS.TW_ACTIVE_CHATTERS, DS.KICK_ACTIVE_CHATTERS, DS.TOTAL_ACTIVE_CHATTERS]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#909090',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'chatters',
            color: '#909090',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yDonations: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.DONATIONS, DS.DON_YT, DS.DON_TW, DS.DON_KICK]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#e8c020',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickDollar),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: { display: false },
        },
        yMembers: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.MEMBERS]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#ffb74d',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'members + subs',
            color: '#ffb74d',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yChatRate: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.YT_CHAT, DS.TW_CHAT, DS.KICK_CHAT, DS.TOTAL_CHAT]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#82b1ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'msg / min',
            color: '#82b1ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
      }
    },
    plugins: [{
      // Override each y-axis's auto-fit with the distance-weighted envelope so the
      // scale moves continuously during x zoom/pan instead of snapping. Runs on every
      // update (incl. the 'none'-mode zoomScale frames), reads state and writes
      // scale.min/max in place -- no re-entrant update(), so no animation loop.
      id: 'smoothYFit',
      afterDataLimits(chart, args) {
        const scale = args.scale;
        if (!scale || scale.axis !== 'y') return;       // leave the x-axis to the zoom plugin
        if (scale.options.display === false) return;     // skip hidden axes
        const ext = smoothYExtent(chart, scale.id);      // scale.id === 'yViewers', etc.
        if (!ext) return;
        scale.min = ext.min;
        scale.max = ext.max;
      },
    }, {
      // Pausing band: drawn BEHIND the data lines (beforeDatasetsDraw) as a
      // vertical alpha-gradient fill (0.7 top -> 0.1 bottom) over each in-frame-
      // view run -- green=playing, yellow=paused. chartArea height is constant
      // under this chart's x-only zoom, so the band is always full height;
      // getPixelForValue maps x under zoom/pan, so runs clip to the visible window.
      id: 'pausingBand',
      beforeDatasetsDraw(chart) {
        if (!showPausingBand || !pausingSegments.length) return;
        const xs = chart.scales.x;
        const { left, right, top, bottom } = chart.chartArea;
        const ctx = chart.ctx;
        const RGB = { playing: '76,175,80', paused: '255,213,79' };
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, right - left, bottom - top);
        ctx.clip();
        for (const seg of pausingSegments) {
          let x1 = xs.getPixelForValue(seg.x0);
          let x2 = xs.getPixelForValue(seg.x1);
          if (x2 < left || x1 > right) continue;
          x1 = Math.max(x1, left);
          x2 = Math.min(x2, right);
          if (x2 <= x1) continue;
          const g = ctx.createLinearGradient(0, top, 0, bottom);
          g.addColorStop(0, `rgba(${RGB[seg.state]},0.7)`);
          g.addColorStop(1, `rgba(${RGB[seg.state]},0.1)`);
          ctx.fillStyle = g;
          ctx.fillRect(x1, top, x2 - x1, bottom - top);
        }
        ctx.restore();
      },
    },
    // Curator-authored point/range markers, drawn by the shared overlay plugin
    // (manual-events.js). ADMIN EDIT vs streams.html: getState reads the page's
    // LIVE state -- adminManual is replaced on every save, goalHitsCache is
    // recomputed from it, and dragSelection is the in-flight drag band.
    ManualEvents.makePlugin(() => ({ events: adminManual.timed, visible: showManualEvents, selection: dragSelection, goalHits: goalHitsCache })),
    ],
  });

  // Shared sorted x-grid for the whole chart: every dataset is built from
  // snapshotData.map(s => ({x: s.x, ...})), so all data arrays share these x
  // values index-for-index. smoothYExtent binary-searches this once per frame to
  // bound its scan to the visible window instead of walking every series in full.
  currentChart.$xs = snapshotData.map(s => s.x);

  // Legend hook for the members/subs line: the legend is built separately, so it
  // reads the same gate the dataset did.
  currentChart.$hasMembers = hasMembers;

  // Legend hooks for the (non-dataset) Pausing band.
  currentChart.$hasPausingData = pausingSegments.length > 0;
  currentChart.$pausingBandVisible = () => showPausingBand;
  currentChart.$togglePausingBand = () => {
    showPausingBand = !showPausingBand;
    localStorage.setItem('stream-chart-pausing', showPausingBand ? '1' : '0');
    currentChart.draw();
    return showPausingBand;
  };

  // Legend hooks for the (non-dataset) manual event overlay.
  currentChart.$hasManualEvents = manualEvents.timed.length > 0;
  currentChart.$manualEventsVisible = () => showManualEvents;
  currentChart.$toggleManualEvents = () => {
    showManualEvents = !showManualEvents;
    try { localStorage.setItem('stream-chart-manualevents', showManualEvents ? '1' : '0'); } catch (e) {}
    currentChart.draw();
    return showManualEvents;
  };

  // Double-click anywhere on the chart to reset an x-axis zoom/pan.
  ctx.ondblclick = () => {
    // ADMIN EDIT: while armed the canvas belongs to the event gesture, so a
    // double-click there must not also reset the zoom.
    if (armed) return;
    if (currentChart && currentChart.resetZoom) {
      if (currentChart.$stopZoomAnim) currentChart.$stopZoomAnim();
      currentChart.resetZoom('none');  // instant reset; afterDataLimits fits y to the (stale) window here
      currentChart.$xWindow = { min: currentChart.scales.x.min, max: currentChart.scales.x.max };
      currentChart.update('none');     // re-run smoothYFit against the restored full window so y refits too
      if (currentChart.$updateScrollbar) currentChart.$updateScrollbar();
    }
  };

  setupScrollbar();
}

// ── Scrub-and-zoom scrollbar ───────────────────────────────────────────────────
// A track under the chart whose thumb shows the visible x-window: drag the thumb
// body to scroll/pan, drag a handle to resize (zoom). Stays in sync with wheel
// zoom and chart panning via the zoom plugin's onZoom/onPan callbacks.
function setupScrollbar() {
  const track = document.getElementById('chartScrollbar');
  const thumb = document.getElementById('chartScrollbarThumb');
  if (!track || !thumb || !currentChart) return;

  const fullMin = currentChart.scales.x.min;
  const fullMax = currentChart.scales.x.max;
  const fullRange = (fullMax - fullMin) || 1;
  const minRange = fullRange * 0.02; // smallest window the thumb can shrink to
  currentChart.$xWindow = { min: fullMin, max: fullMax }; // smoothYFit reads this for the y-fit



  function updateScrollbar() {
    const xs = currentChart.scales.x;
    let lo = Math.max(0, Math.min(1, (xs.min - fullMin) / fullRange));
    let hi = Math.max(0, Math.min(1, (xs.max - fullMin) / fullRange));
    thumb.style.left = (lo * 100) + '%';
    thumb.style.width = Math.max(0, (hi - lo) * 100) + '%';
  }

  function clampRange(min, max) {
    if (max - min < minRange) max = min + minRange;
    if (min < fullMin) { max += (fullMin - min); min = fullMin; }
    if (max > fullMax) { min -= (max - fullMax); max = fullMax; }
    return { min: Math.max(fullMin, min), max: Math.min(fullMax, max) };
  }

  // Instant apply -- used for resize (zoom) where immediate feedback feels best.
  function applyRange(min, max) {
    const r = clampRange(min, max);
    currentChart.$xWindow = { min: r.min, max: r.max };
    currentChart.zoomScale('x', r, 'none');
    updateScrollbar();
  }

  // Smoothed apply -- used for scrolling/panning. Drags are damped (less
  // sensitive) and the view eases toward the target instead of snapping.
  const PAN_SENSITIVITY = 0.6; // < 1 => view moves less than the cursor
  const PAN_SMOOTH = 0.5;      // fraction eased toward target per frame (higher => snappier, fewer full updates per gesture)
  const ZOOM_STEP = 0.0007;    // wheel-zoom sensitivity (smaller => less sensitive)
  let targetMin = null, targetMax = null, rafId = null;

  function animateToward() {
    if (!currentChart || !currentChart.scales || !currentChart.scales.x) { rafId = null; return; }
    const xs = currentChart.scales.x;
    let min = xs.min + (targetMin - xs.min) * PAN_SMOOTH;
    let max = xs.max + (targetMax - xs.max) * PAN_SMOOTH;
    const eps = fullRange * 0.0004;
    if (Math.abs(targetMin - min) < eps && Math.abs(targetMax - max) < eps) {
      min = targetMin; max = targetMax; rafId = null;
    } else {
      rafId = requestAnimationFrame(animateToward);
    }
    currentChart.$xWindow = { min, max };
    currentChart.zoomScale('x', { min, max }, 'none');
    updateScrollbar();
  }

  function smoothTo(min, max) {
    const r = clampRange(min, max);
    targetMin = r.min; targetMax = r.max;
    if (rafId == null) rafId = requestAnimationFrame(animateToward);
  }

  // Let the zoom plugin's callbacks refresh the thumb during wheel/drag on the chart.
  currentChart.$updateScrollbar = updateScrollbar;
  // Cancel any in-flight easing so a reset isn't fought by a pending animation.
  currentChart.$stopZoomAnim = () => {
    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
    targetMin = targetMax = null;
  };

  function startDrag(e, mode) {
    e.preventDefault();
    e.stopPropagation();
    const trackW = track.clientWidth || 1;
    const startX = e.touches ? e.touches[0].clientX : e.clientX;
    const startMin = currentChart.scales.x.min;
    const startMax = currentChart.scales.x.max;
    function onMove(ev) {
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const dxVal = ((cx - startX) / trackW) * fullRange;
      if (mode === 'pan')        smoothTo(startMin + dxVal * PAN_SENSITIVITY, startMax + dxVal * PAN_SENSITIVITY);
      else if (mode === 'left')  applyRange(Math.min(startMin + dxVal, startMax - minRange), startMax);
      else if (mode === 'right') applyRange(startMin, Math.max(startMax + dxVal, startMin + minRange));
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  thumb.addEventListener('mousedown', e => startDrag(e, 'pan'));
  thumb.addEventListener('touchstart', e => startDrag(e, 'pan'), { passive: false });
  const hLeft = thumb.querySelector('.chart-scrollbar-handle.left');
  const hRight = thumb.querySelector('.chart-scrollbar-handle.right');
  if (hLeft)  { hLeft.addEventListener('mousedown', e => startDrag(e, 'left'));   hLeft.addEventListener('touchstart', e => startDrag(e, 'left'), { passive: false }); }
  if (hRight) { hRight.addEventListener('mousedown', e => startDrag(e, 'right')); hRight.addEventListener('touchstart', e => startDrag(e, 'right'), { passive: false }); }

  // Click empty track to recenter the current window where you clicked.
  track.addEventListener('mousedown', e => {
    if (e.target !== track) return; // ignore clicks that land on the thumb/handles
    const rect = track.getBoundingClientRect();
    const frac = (e.clientX - rect.left) / (rect.width || 1);
    const xs = currentChart.scales.x;
    const half = (xs.max - xs.min) / 2;
    const center = fullMin + frac * fullRange;
    smoothTo(center - half, center + half);
  });

  // Eased, less-sensitive wheel zoom toward the cursor (replaces the plugin's
  // built-in wheel zoom, which is instant and steppy). Normalizes wheel delta
  // across devices, caps each step, then eases toward the target via smoothTo.
  const canvas = currentChart.canvas;
  if (canvas) {
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;        // line units -> approx pixels
      else if (e.deltaMode === 2) d *= 400;  // page units -> approx pixels
      d = Math.max(-80, Math.min(80, d));    // cap the per-event zoom step
      const factor = Math.exp(d * ZOOM_STEP); // >1 zoom out, <1 zoom in
      // Build on the in-flight target while animating so fast scrolls accumulate.
      const animating = rafId != null && targetMin != null;
      const baseMin = animating ? targetMin : currentChart.scales.x.min;
      const baseMax = animating ? targetMax : currentChart.scales.x.max;
      const area = currentChart.chartArea;
      const rect = canvas.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left - area.left) / ((area.right - area.left) || 1)));
      const cursor = baseMin + frac * (baseMax - baseMin);
      smoothTo(cursor - (cursor - baseMin) * factor, cursor + (baseMax - cursor) * factor);
    }, { passive: false });
  }

  updateScrollbar();
}

// ── Interactive legend ─────────────────────────────────────────────────────────
function buildLegend(hasYTViewers, hasTWViewers, hasKickViewers, hasChatRate, hasDonations, hasActiveYT, hasActiveTW, hasActiveKick, hasYTChat, hasTWChat, hasKickChat, donPlatforms) {
  const container = document.getElementById('chartLegend');
  if (!container || !currentChart) return;

  // Each category is a column: { title, items }. title=null renders header-less
  // (single-item Donations / Pausing columns); empty columns are dropped. A
  // "Total" entry appears only when 2+ platforms in that category have data,
  // matching the dataset gating in buildChart.
  // Item: { label, type ('line'|'dashed'|'dotted'|'bar'), color, ds } or
  // { special:'pausing'|'manualevents' }.
  const groups = [];

  const gDonations = [];
  const splitDonations = hasDonations && donPlatforms.length >= 2;
  if (splitDonations) {
    gDonations.push({ label: 'Total', type: 'line', color: '#e8c020', ds: DS.DONATIONS });
    for (const p of donPlatforms) {
      const meta = DON_PLATFORM_META[p];
      gDonations.push({ label: meta.legend, type: 'dashed', color: meta.color, ds: meta.ds });
    }
  } else if (hasDonations) {
    gDonations.push({ label: 'Donations', type: 'line', color: '#e8c020', ds: DS.DONATIONS });
  }
  // Members/subs rides in the Donations column: same origin (donation events),
  // different unit. $hasMembers mirrors buildChart's dataset gate.
  if (currentChart.$hasMembers)
    gDonations.push({ label: 'Members+Subs', type: 'line', color: '#ffb74d', ds: DS.MEMBERS });
  groups.push({ title: splitDonations ? 'Donations' : null, items: gDonations });

  const gViewers = [];
  if ([hasYTViewers, hasTWViewers, hasKickViewers].filter(Boolean).length >= 2)
    gViewers.push({ label: 'Total Viewers', type: 'line', color: '#40c4ff', ds: DS.TOTAL_VIEWERS });
  if (hasYTViewers)   gViewers.push({ label: 'YT Viewers',   type: 'line', color: '#e84040', ds: DS.YT_VIEWERS });
  if (hasTWViewers)   gViewers.push({ label: 'TW Viewers',   type: 'line', color: '#6650d8', ds: DS.TW_VIEWERS });
  if (hasKickViewers) gViewers.push({ label: 'Kick Viewers', type: 'line', color: '#53fc18', ds: DS.KICK_VIEWERS });
  groups.push({ title: 'Viewers', items: gViewers });

  const gActive = [];
  if ([hasActiveYT, hasActiveTW, hasActiveKick].filter(Boolean).length >= 2)
    gActive.push({ label: 'Total Active Chatters', type: 'dotted', color: '#909090', ds: DS.TOTAL_ACTIVE_CHATTERS });
  if (hasActiveYT)   gActive.push({ label: 'YT Active Chatters',   type: 'dotted', color: '#e84040', ds: DS.YT_ACTIVE_CHATTERS });
  if (hasActiveTW)   gActive.push({ label: 'TW Active Chatters',   type: 'dotted', color: '#6650d8', ds: DS.TW_ACTIVE_CHATTERS });
  if (hasActiveKick) gActive.push({ label: 'Kick Active Chatters', type: 'dotted', color: '#53fc18', ds: DS.KICK_ACTIVE_CHATTERS });
  groups.push({ title: 'Active Chatters', items: gActive });

  const gChat = [];
  if (hasChatRate) {
    if ([hasYTChat, hasTWChat, hasKickChat].filter(Boolean).length >= 2)
      gChat.push({ label: 'Total Msg/Min', type: 'dashed', color: '#82b1ff', ds: DS.TOTAL_CHAT });
    if (hasYTChat)   gChat.push({ label: 'YT Msg/Min',   type: 'dashed', color: '#e84040', ds: DS.YT_CHAT });
    if (hasTWChat)   gChat.push({ label: 'TW Msg/Min',   type: 'dashed', color: '#6650d8', ds: DS.TW_CHAT });
    if (hasKickChat) gChat.push({ label: 'Kick Msg/Min', type: 'dashed', color: '#53fc18', ds: DS.KICK_CHAT });
  }
  groups.push({ title: 'Msg/Min', items: gChat });

  // Pausing band (non-dataset overlay) -- only when this stream has frame data.
  const gPausing = [];
  if (currentChart.$hasPausingData) gPausing.push({ special: 'pausing' });
  if (currentChart.$hasManualEvents) gPausing.push({ special: 'manualevents' });
  groups.push({ title: null, items: gPausing });

  container.innerHTML = '';

  // One dataset toggle element (indicator + label + click-to-hide/persist).
  function makeItem(item) {
    const span = document.createElement('span');
    span.className = 'legend-item';
    span.dataset.ds = item.ds;

    let indicator;
    if (item.type === 'bar') {
      indicator = `<span class="legend-swatch" style="background:${item.color};"></span>`;
    } else if (item.type === 'dashed') {
      // Dashed line indicator: two short segments with a gap
      indicator = `<svg width="20" height="8" style="flex-shrink:0;"><line x1="0" y1="4" x2="7" y2="4" stroke="${item.color}" stroke-width="2"/><line x1="11" y1="4" x2="20" y2="4" stroke="${item.color}" stroke-width="2"/></svg>`;
    } else if (item.type === 'dotted') {
      // Dotted line indicator: matches the [2,2] dash on the active-chatter lines
      indicator = `<svg width="20" height="8" style="flex-shrink:0;"><line x1="0" y1="4" x2="20" y2="4" stroke="${item.color}" stroke-width="2" stroke-dasharray="2 2"/></svg>`;
    } else {
      indicator = `<span class="legend-line" style="background:${item.color};"></span>`;
    }

    span.innerHTML = `${indicator}${item.label}`;
    if (hiddenDatasets.has(item.ds)) span.classList.add('hidden');

    span.addEventListener('click', () => {
      const dsIndex = currentChart.data.datasets.findIndex(d => d.label === item.ds);
      if (dsIndex === -1) return;
      const nowVisible = currentChart.isDatasetVisible(dsIndex);
      currentChart.setDatasetVisibility(dsIndex, !nowVisible);
      span.classList.toggle('hidden', nowVisible);
      if (nowVisible) hiddenDatasets.add(item.ds);
      else hiddenDatasets.delete(item.ds);
      localStorage.setItem('stream-chart-hidden', JSON.stringify([...hiddenDatasets]));
      syncAxisDisplay();
    });

    return span;
  }

  // Non-dataset Pausing overlay toggle: green play / yellow pause glyphs.
  function makePausing() {
    const span = document.createElement('span');
    span.className = 'legend-item';
    span.innerHTML = `Pausing <span style="color:#4caf50;font-weight:bold;">&#9654;</span><span style="color:#ffd54f;font-weight:bold;">||</span>`;
    if (!currentChart.$pausingBandVisible()) span.classList.add('hidden');
    span.addEventListener('click', () => {
      const visible = currentChart.$togglePausingBand();
      span.classList.toggle('hidden', !visible);
    });
    return span;
  }

  // Non-dataset manual event overlay toggle: the same accent as the marks.
  function makeManualEventsToggle() {
    const span = document.createElement('span');
    span.className = 'legend-item';
    span.innerHTML = `Events <span style="color:rgba(255,120,200,0.95);font-weight:bold;">&#9662;</span>`;
    if (!currentChart.$manualEventsVisible()) span.classList.add('hidden');
    span.addEventListener('click', () => {
      const visible = currentChart.$toggleManualEvents();
      span.classList.toggle('hidden', !visible);
    });
    return span;
  }

  // Render each non-empty category as a vertical column; columns sit side-by-side.
  for (const group of groups) {
    if (group.items.length === 0) continue;
    const col = document.createElement('div');
    col.className = 'legend-group';
    for (const item of group.items) {
      if (item.special === 'pausing')           col.appendChild(makePausing());
      else if (item.special === 'manualevents') col.appendChild(makeManualEventsToggle());
      else                                      col.appendChild(makeItem(item));
    }
    container.appendChild(col);
  }
}

// NEW — "Add Event" armed mode
// ═══════════════════════════════════════════════════════════════════════════════

function setArmed(on) {
  armed = !!on;
  dragging = false;
  dragSelection = null;

  const btn = document.getElementById('addEventBtn');
  if (btn) btn.classList.toggle('active', armed);

  const hint = document.getElementById('chartHint');
  if (hint && currentChart) hint.textContent = armed ? HINT_ARMED : HINT_DEFAULT;

  if (currentChart) {
    const canvas = currentChart.canvas;
    if (canvas) canvas.style.cursor = armed ? 'crosshair' : '';
    // Armed: a drag draws a range band, so the zoom plugin must not also pan.
    currentChart.options.plugins.zoom.pan.enabled = !armed;
    currentChart.update('none');
  }
}

function onAddEventClick() {
  // A snapshot-less stream has no canvas to gesture on -- go straight to a
  // whole-stream entry (the modal's kind switch can still change it).
  if (!currentChart) { openModal({ kind: 'stream' }); return; }
  setArmed(!armed);
}

// Canvas pixel -> unix seconds on the chart's x-scale (which is epoch millis).
function pxToTs(px) {
  return Math.round(currentChart.scales.x.getValueForPixel(px) / 1000);
}

// Gesture listeners live on the canvas for the chart's whole lifetime and check
// `armed` themselves, so arming/disarming never rebinds anything. Coordinates
// use offsetX/offsetY, matching how streams.html reads pointer coords.
function wireCanvasGestures() {
  const canvas = currentChart && currentChart.canvas;
  if (!canvas) return;

  canvas.addEventListener('mousedown', ev => {
    if (!armed || ev.button !== 0) return;
    const area = currentChart.chartArea;
    if (ev.offsetX < area.left || ev.offsetX > area.right
        || ev.offsetY < area.top || ev.offsetY > area.bottom) return;
    ev.preventDefault();
    dragging = true;
    dragX0 = ev.offsetX;
    dragSelection = null;
  });

  canvas.addEventListener('mousemove', ev => {
    if (!armed || !dragging) return;
    dragSelection = { x0px: dragX0, x1px: ev.offsetX };
    currentChart.draw();
  });

  canvas.addEventListener('mouseup', ev => {
    if (!armed || !dragging) return;
    dragging = false;
    const x0 = dragX0, x1 = ev.offsetX;
    dragSelection = null;
    currentChart.draw();
    if (Math.abs(x1 - x0) < 5) {
      openModal({ kind: 'point', ts: pxToTs(x0) });
    } else {
      const lo = Math.min(x0, x1), hi = Math.max(x0, x1);
      openModal({ kind: 'range', ts: pxToTs(lo), end_ts: pxToTs(hi) });
    }
  });

  // Leaving the canvas mid-drag cancels it rather than committing a range whose
  // far edge the curator never chose.
  canvas.addEventListener('mouseleave', () => {
    if (!dragging) return;
    dragging = false;
    dragSelection = null;
    currentChart.draw();
  });
}

// ── Hotkeys ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalIsOpen()) { closeModal(); return; }
    if (armed) { setArmed(false); return; }
    return;
  }
  if (modalIsOpen() || gateIsOpen()) return;
  const el = e.target;
  const tag = (el && el.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (el && el.isContentEditable)) return;
  if (e.key === 'a' || e.key === 'A') {
    if (!activeStreamId) return;
    e.preventDefault();
    onAddEventClick();
  }
});

// ═══════════════════════════════════════════════════════════════════════════════
// NEW — Elapsed-time helpers
// ═══════════════════════════════════════════════════════════════════════════════

// Always h:mm:ss (fmtElapsed drops the hour field; manual-event times don't).
function fmtHMS(secs) {
  const s = Math.max(0, Math.floor(secs));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtSignedHMS(secs) {
  return (secs < 0 ? '-' : '') + fmtHMS(Math.abs(secs));
}

// Accepts h:mm:ss, m:ss or bare seconds, with an optional leading sign. Junk -> null.
// A NEGATIVE elapsed value is legitimate here: stream_stats realigns start_ts
// forward post-hoc (to the output broadcast's actualStartTime), so the leftmost
// chart region routinely predates the anchor. fmtSignedHMS prefills such a click
// as "-0:01:05" and this must round-trip it, or the modal would reject its own
// prefill.
function parseElapsedInput(str) {
  let s = String(str == null ? '' : str).trim();
  if (!s) return null;
  let sign = 1;
  if (s[0] === '-')      { sign = -1; s = s.slice(1).trim(); }
  else if (s[0] === '+') {            s = s.slice(1).trim(); }
  if (!s) return null;
  const parts = s.split(':');
  if (parts.length > 3) return null;
  const nums = [];
  for (const p of parts) {
    const q = p.trim();
    if (!/^\d+(\.\d+)?$/.test(q)) return null;   // an inner sign fails here
    nums.push(parseFloat(q));
  }
  let secs;
  if (nums.length === 3)      secs = nums[0] * 3600 + nums[1] * 60 + nums[2];
  else if (nums.length === 2) secs = nums[0] * 60 + nums[1];
  else                        secs = nums[0];
  if (!Number.isFinite(secs)) return null;
  return sign * Math.round(secs);
}

// A stream with neither start_ts nor snapshots has no elapsed origin, so the
// time fields take raw unix seconds instead.
function hasAnchor() { return activeAnchorTs != null; }

// Field text -> unix seconds (or null when unparseable).
function fieldToTs(text) {
  if (!hasAnchor()) {
    const s = String(text == null ? '' : text).trim();
    if (!/^\d+$/.test(s)) return null;
    return parseInt(s, 10);
  }
  const secs = parseElapsedInput(text);
  return secs == null ? null : activeAnchorTs + secs;
}

// Unix seconds -> field text.
function tsToField(ts) {
  if (!Number.isFinite(ts)) return '';
  return hasAnchor() ? fmtSignedHMS(ts - activeAnchorTs) : String(ts);
}

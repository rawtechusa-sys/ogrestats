name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual skip button for the debounce timer: "Run workflow" in the Actions
  # UI deploys immediately. The debounce sleep below only runs on push events,
  # and the dispatched run's debounce job shares the pages-debounce
  # cancel-in-progress group, so it cancels any run still waiting out the
  # timer and deploys the current main right away.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Debounce timer: each new commit cancels the previous waiting run and
  # restarts the clock, so a commit burst deploys once, at the newest commit.
  # A run already past the sleep has no active debounce job, so an in-flight
  # deploy is never cancelled.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-debounce
      cancel-in-progress: true
    steps:
      # A workflow_dispatch run skips this sleep entirely -- that is the
      # manual skip path documented on the trigger above.
      - name: Wait for the commit burst to settle
        if: github.event_name == 'push'
        run: sleep 120

  deploy:
    needs: debounce
    timeout-minutes: 10
    # cancel-in-progress on BOTH groups: a job must never wait in a concurrency
    # queue -- a cancelled pending job can wedge the group and every later
    # deploy sits "waiting" for hours (happened 2026-08-06). A newer deploy
    # cancels an older in-flight one instead; the debounce sleep (120s) is far
    # longer than a normal deploy (~40s), so in practice deploys finish
    # untouched, and a cancelled Pages deploy just leaves the old version live.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into secrets.js
        # Using node's JSON.stringify so the key can contain any character
        # (quotes, backslashes) without breaking the generated JS file.
        env:
          RENTON_API_KEY: ${{ secrets.RENTON_API_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const key = process.env.RENTON_API_KEY || '';
            const body = [
              '// Auto-generated at deploy time by .github/workflows/deploy.yml.',
              '// Do not commit -- this file is .gitignored.',
              'window.RENTON_API_KEY = ' + JSON.stringify(key) + ';',
              ''
            ].join('\n');
            fs.writeFileSync('secrets.js', body);
            console.log('secrets.js written (' + body.length + ' bytes, key length ' + key.length + ')');
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Adjust if your site lives in a subdirectory.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

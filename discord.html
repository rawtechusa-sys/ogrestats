<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Standalone guard: these pages live inside the index.html shell. If loaded
     top-level, bounce into the shell at this page's tab, carrying any sub-slug
     (a channel slug here) so discord.html#<slug> -> index.html#discord/<slug>
     stays shareable. #discord is a hidden route: no visible tab points here. -->
<script>(function(){
  if (window.self !== window.top) return;            // embedded in the shell -> normal
  var slug = 'discord';
  var sub  = location.hash.replace(/^#/, '');
  location.replace('index.html#' + slug + (sub ? '/' + sub : ''));
})();</script>
<title>Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Lora:ital,wght@0,400;0,500;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link id="theme-css" rel="stylesheet" href="themes/bog-moss.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    color: var(--text-primary);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .sidebar {
    background: var(--bg-surface);
    border-right: 1px solid var(--border-default);
    overflow-y: auto;
    position: relative;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: var(--bg-surface); }
  .sidebar::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  .server-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border-default);
  }
  .server-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border-default-strong, var(--border-default));
    flex-shrink: 0;
  }
  .server-name {
    font-family: 'Rye', serif;
    font-size: 14px;
    color: var(--accent-bright);
    letter-spacing: 0.04em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Sticky filter (floats at the top of the list while it scrolls). */
  .sidebar-search {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-surface);
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border-default);
  }
  .sidebar-search input {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: 7px 9px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .sidebar-search input::placeholder { color: var(--text-muted); opacity: 0.7; }
  .sidebar-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
  }

  .cat-label {
    font-family: 'Rye', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    padding: 12px 16px 4px;
    text-transform: uppercase;
  }

  .chan-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
    overflow: hidden;
  }
  .chan-row:hover {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.08);
    border-left-color: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
  }
  .chan-row.active {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.14);
    border-left-color: var(--accent);
  }
  .chan-row.thread { padding-left: 28px; }
  .chan-hash {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .chan-row.active .chan-hash { color: var(--accent); }
  .chan-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chan-row.active .chan-name, .chan-row:hover .chan-name { color: var(--text-primary); }
  .chan-count {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.65;
    flex-shrink: 0;
  }

  .sidebar-empty, .search-noresults {
    padding: 16px;
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── Content area ────────────────────────────────────────────── */
  .content-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chan-head {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    padding: 9px 20px;
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    min-height: 42px;
  }
  .chan-title {
    font-family: 'Rye', serif;
    font-size: 16px;
    color: var(--accent-bright);
  }
  .chan-topic {
    font-size: 13px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60%;
  }
  .chan-count-big {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border-default);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .month-nav { display: flex; align-items: center; gap: 6px; }

  .btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    background: var(--bg-panel);
    color: var(--accent-bright);
    border: 1px solid var(--border-default-strong, var(--border-default));
    border-radius: 4px;
    padding: 5px 11px;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.10);
  }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.on {
    border-color: var(--accent);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.16);
  }
  .spacer { margin-left: auto; }

  select, .filters input[type="text"], .filters input[type="search"], .filters input[type="date"] {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    background: var(--bg-panel);
    color: var(--text-primary);
    border: 1px solid var(--border-default-strong, var(--border-default));
    border-radius: 4px;
    padding: 5px 8px;
    outline: none;
  }
  select:focus, .filters input:focus { border-color: var(--accent); }
  .filters input[type="date"] { color-scheme: dark; }
  html[data-theme="white"] .filters input[type="date"] { color-scheme: light; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border-default);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.04);
    flex-shrink: 0;
  }
  .filters .field { display: flex; flex-direction: column; gap: 3px; }
  .filters label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #q { min-width: 220px; }

  /* ── Scrolling message pane ──────────────────────────────────── */
  .scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 20px 40px;
    /* Browse mode compensates scrollTop by hand every time it prepends or evicts a
       chunk. The browser's own scroll anchoring would apply a second correction on
       top of ours and the reading position would drift, so switch it off. Search
       mode never moves content above the viewport, so this costs it nothing. */
    overflow-anchor: none;
  }
  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  .day-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .day-divider::before, .day-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-default);
  }
  /* Two adjacent chunks can open and close on the same LOCAL day (chunks are
     bucketed by UTC month), which would print the same date twice across a seam.
     Hide the second one. The class is re-evaluated on every timezone switch. */
  .day-divider.seam-dup { display: none; }

  /* ── Continuous browse seams ─────────────────────────────────── */
  /* One element per end of the mounted window, doing three jobs at once: it is the
     IntersectionObserver target that triggers the next chunk, the "wading in…" row
     while that chunk loads, and the error/retry row when it fails. An element with
     no area is an unreliable observer target, hence the min-height. */
  .b-seam {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 2px;
    padding: 8px 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-align: center;
  }
  .b-seam:empty { padding: 0; }
  .b-seam .seam-err { color: var(--text-muted); font-style: italic; }

  .msg {
    padding: 5px 8px;
    border-radius: 4px;
    scroll-margin-top: 16px;
  }
  .msg:hover { background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.05); }
  .msg.flash { animation: flash 1.8s ease-out 1; }
  @keyframes flash {
    0%   { background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35); }
    100% { background: transparent; }
  }

  .msg-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
  }
  .msg-user {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-bright);
  }
  .msg-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .msg-edited {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.8;
  }
  .msg-text {
    font-size: 14px;
    color: var(--text-primary);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-text a.msg-link {
    color: var(--accent-bright);
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
    word-break: break-all;
  }
  .msg-text a.msg-link:hover { text-decoration: none; border-bottom-style: solid; }
  .msg-text mark {
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
    color: var(--accent-bright);
    border-radius: 2px;
    padding: 0 1px;
  }

  .reply-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.85;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .reply-line .reply-user { color: var(--accent); }
  .reply-line a { color: inherit; text-decoration: none; cursor: pointer; }
  .reply-line a:hover { text-decoration: underline; }

  .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .att-img img {
    max-height: 360px;
    max-width: 100%;
    object-fit: contain;
    border-radius: 4px;
    border: 1px solid var(--border-default);
    display: block;
  }
  /* URL embeds are a preview of a link that is already readable in the text, so they
     stay smaller than a real attachment. */
  .url-embeds { margin-top: 2px; }
  .att-img.url-embed img { max-height: 240px; }
  .att-media { max-width: 480px; width: 100%; }
  video.att-media { max-height: 360px; border-radius: 4px; }
  .att-file {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--accent-bright);
    border: 1px solid var(--border-default-strong, var(--border-default));
    border-radius: 4px;
    padding: 4px 9px;
    text-decoration: none;
  }
  .att-file:hover { background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.10); }

  .reacts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .react {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 10px;
    padding: 1px 8px;
  }

  .poll {
    margin-top: 6px;
    max-width: 440px;
    border: 1px solid var(--border-default);
    border-radius: 6px;
    background: var(--bg-panel);
    padding: 8px 10px;
    font-size: 13px;
  }
  .poll-q { font-weight: 600; margin-bottom: 6px; }
  .poll-ans {
    position: relative;
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 3px 6px;
    margin: 2px 0;
    border-radius: 4px;
    overflow: hidden;
  }
  .poll-bar {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.18);
    border-radius: 4px;
  }
  .poll-ans > span { position: relative; }
  .poll-ans-n {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .poll-voters { margin: 0 6px 4px; font-size: 11px; color: var(--text-muted); }
  .poll-voters summary { cursor: pointer; }
  .poll-voters div { padding: 2px 0 0 14px; }
  .poll-foot {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ── Search results ──────────────────────────────────────────── */
  .result-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding: 6px 0 2px;
  }
  .hit-group {
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .hit-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.06);
    border-bottom: 1px solid var(--border-default);
    flex-wrap: wrap;
  }
  .hit-chan {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent-bright);
  }
  .hit-meta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }
  .hit-count { margin-left: auto; }
  .hit {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-default);
  }
  .hit:last-child { border-bottom: none; }
  .jump-link {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    cursor: pointer;
  }
  .jump-link:hover { color: var(--accent-bright); }

  /* ── States ──────────────────────────────────────────────────── */
  .loading-state, .empty-state, .error-state, .hint-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 12px;
    color: var(--text-muted);
    font-style: italic;
    text-align: center;
    padding: 0 20px;
  }
  .loading-glyph {
    font-family: 'Rye', serif;
    font-size: 32px;
    color: var(--accent);
    animation: flicker 2s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="server-head" id="serverHead">
      <span class="server-name" id="serverName">Discord</span>
    </div>
    <div class="sidebar-search">
      <input id="chanSearch" type="search" placeholder="filter channels…"
             autocomplete="off" spellcheck="false" aria-label="Filter channels">
    </div>
    <div id="chanList">
      <div class="loading-state" style="height:160px;">
        <span class="loading-glyph">~</span>
        <span>wading in...</span>
      </div>
    </div>
  </nav>

  <div class="content-area">
    <header class="chan-head" id="chanHead">
      <span class="chan-title" id="chanTitle"></span>
    </header>

    <div class="toolbar" id="toolbar">
      <!-- Scrolling loads neighbouring months on its own; the picker is the
           long-range jump, so there are no step buttons any more. -->
      <div class="month-nav">
        <select id="monthSel" aria-label="Jump to month"></select>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="nameToggle" title="Toggle server display names vs discord usernames">Nicknames</button>
      <button class="btn" id="searchToggle">Search</button>
    </div>

    <div class="filters" id="filters" style="display:none;">
      <div class="field">
        <label for="q">Search text</label>
        <input type="search" id="q" placeholder="words to find…" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="author">Author</label>
        <!-- The datalist is filled on first focus (see wire()), not at load: it needs
             authors.json, which the search path already fetches lazily. -->
        <input type="text" id="author" list="authorOptions" placeholder="username"
               autocomplete="off" spellcheck="false">
        <datalist id="authorOptions"></datalist>
      </div>
      <div class="field">
        <label for="scope">Channels</label>
        <select id="scope">
          <option value="all">All channels</option>
          <option value="current">This channel</option>
        </select>
      </div>
      <div class="field">
        <label for="dateFrom">From</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="field">
        <label for="dateTo">To</label>
        <input type="date" id="dateTo">
      </div>
      <button class="btn" id="searchBtn">Go</button>
      <button class="btn" id="closeSearch">Close</button>
    </div>

    <main class="scroll-area" id="main">
      <div class="loading-state">
        <span class="loading-glyph">~</span>
        <span>loading the archive…</span>
      </div>
    </main>
  </div>
</div>

<script src="config.js"></script>

<script>
const RAW = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}`;
const DISCORD_BASE = `${RAW}/data/discord`;

// Chunks (one channel-month of messages) hydrated per scroll page during search.
// Mirrors chat.html: results stream in as the user scrolls, so a broad query never
// fetches more than the user actually scrolls through.
const BATCH = 8;
// A query can match many chunks but few messages once the message-level filter runs,
// so auto-fill would keep fetching to fill the viewport. Cap that continuous scan and
// offer a "Keep scanning" button past it.
const MAX_AUTOSCAN = 60;

// ── Theme (mirrors chat.html / streams.html) ────────────────────────────────
function applyTheme(key) {
  const themes = {
    green: 'themes/bog-moss.css',
    amber: 'themes/firepit.css',
    grey:  'themes/dead-stone.css',
    void:  'themes/the-void.css',
    white: 'themes/onion-layers.css',
  };
  document.getElementById('theme-css').href = themes[key] || themes.green;
  document.documentElement.setAttribute('data-theme', key);
}
applyTheme(localStorage.getItem('swamp-theme') || 'green');

// Only 'theme' and 'timezone' are handled. Every other message type is a deliberate
// no-op -- the shell broadcasts {type:'selectstream'} to whatever page is loaded
// (sendPendingStream in index.html), and that must not disturb this page.
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'theme') applyTheme(d.key);
  else if (d.type === 'timezone') rerenderMessages();
});

// Mouse forwarding so the parent's roach/eye animations still react.
document.addEventListener('mousemove', e => {
  try { window.parent.postMessage({ type: 'mousemove', x: e.clientX, y: e.clientY }, '*'); } catch(err) {}
});
document.addEventListener('mouseleave', () => {
  try { window.parent.postMessage({ type: 'mouseleave' }, '*'); } catch(err) {}
});

// ── Utilities ───────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} — ${url}`);
  return r.json();
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Attachment/icon URLs come from our own backend (archive.org downloads), but a
// scripted scheme would still execute if one ever slipped in, so drop those.
function safeUrl(u) {
  const s = String(u ?? '').trim();
  return /^(javascript|vbscript|data:text\/html|file):/i.test(s) ? '' : s;
}

// Same tokenizer as discord_site_build/chat_search_index: lowercase, [a-z0-9]+, 2..40.
function tokenize(text) {
  const out = new Set();
  for (const t of String(text ?? '').toLowerCase().match(/[a-z0-9]+/g) || []) {
    if (t.length >= 2 && t.length <= 40) out.add(t);
  }
  return [...out];
}
// Same normalization as chat_search_index._norm_username (the authors.json keys).
function normUser(raw) {
  return (String(raw ?? '').replace(/^@/, '').trim().toLowerCase()) || 'unknown';
}

// Name-mode preference: 'user' shows the discord account username (the default),
// 'display' the server display name. A durable display preference like the theme,
// so localStorage rather than sessionStorage.
function getNameMode() {
  try { return localStorage.getItem('discord-name-mode') === 'display' ? 'display' : 'user'; }
  catch (e) { return 'user'; }
}

// The rendered name for a message. A message carries `user` only when it differs
// from `author` (see discord_site_build.map_message), so user mode must fall back
// to `author` -- for those messages the username IS the display name.
function authorLabel(m) {
  if (getNameMode() === 'display') return m.author ?? 'unknown';
  return m.user || m.author || 'unknown';
}

// A poll voter's rendered name. Voters carry the same dual-name convention as
// message authors (`user` only when it differs), just under `name` instead of
// `author` -- so the Nicknames toggle flips these too.
function voterLabel(v) {
  if (getNameMode() === 'display') return v?.name ?? 'unknown';
  return v?.user || v?.name || 'unknown';
}

// Sorted-array intersection (two-pointer) — postings are sorted + unique.
function intersectSorted(a, b) {
  const out = [];
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push(a[i]); i++; j++; }
    else if (a[i] < b[j]) i++;
    else j++;
  }
  return out;
}

// Highlight query tokens. Tokens are [a-z0-9]+ so they need no regex escaping.
function highlight(text, tokens) {
  const esc = escHtml(text);
  if (!tokens || !tokens.length) return esc;
  const re = new RegExp(`(${tokens.join('|')})`, 'gi');
  return esc.replace(re, '<mark>$1</mark>');
}

// ── URLs in message text ────────────────────────────────────────────────────
// Message text is RAW (unescaped) when it reaches renderText. Never run a URL regex
// over already-escaped HTML: an entity like &amp; or &lt; would be re-parsed as URL
// characters and the escaping could be undone. The split below runs on the raw string
// and every segment is escaped exactly once on its way out.
//
// Conservative shape: a scheme we allow, then non-whitespace. < > " ' are excluded so
// a URL can never eat into surrounding markup even before escaping.
const URL_RE = /https?:\/\/[^\s<>"']+/gi;
const MAX_URL_EMBEDS = 4;                 // per message

function countChar(s, c) { let n = 0; for (const ch of s) if (ch === c) n++; return n; }

// One match can hold two URLs. The character class has to allow , ; : ) inside a URL
// (real ones contain them), so "https://a.com,https://b.com" with no space between is
// a SINGLE match -- and trimUrlTail only trims the end, so without this the pair would
// render as one garbled anchor and the second URL would lose both its link and its
// embed. Split the match wherever a scheme follows a character that ends a URL.
//
// Only those joiner characters split, so a scheme nested in a path or query is left
// alone: https://web.archive.org/web/2024/https://x/y and .../l.php?u=https://x/y stay
// one URL, which is what they are.
const URL_JOINERS = ',;:)]}|';
function splitJoinedUrls(s) {
  const starts = [];
  const re = /https?:\/\//gi;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index === 0 || URL_JOINERS.includes(s[m.index - 1])) starts.push(m.index);
  }
  if (starts.length < 2 || starts[0] !== 0) return [s];
  return starts.map((a, i) => s.slice(a, i + 1 < starts.length ? starts[i + 1] : s.length));
}

// Discord drops trailing sentence punctuation from an autolink, and drops a trailing
// closer only when the URL carries no matching opener -- "(see https://x/a)." links
// https://x/a, while https://x/a_(b) keeps its paren. Same rule here.
function trimUrlTail(u) {
  let s = String(u);
  for (;;) {
    const last = s.slice(-1);
    if (last && '.,;:!?’*_~'.includes(last)) { s = s.slice(0, -1); continue; }
    const open = { ')': '(', ']': '[', '}': '{' }[last];
    if (open && countChar(s, open) < countChar(s, last)) { s = s.slice(0, -1); continue; }
    break;
  }
  return s;
}

// A URL whose path ends in an image extension is the image (query string allowed --
// Discord CDN signatures and ?size=96 emoji variants both live there).
const IMG_EXT_RE = /\.(png|jpe?g|gif|webp|avif)$/i;

// Page URLs whose media file is derivable from the URL text alone. Extensible: add
// { name, test, media }. Deliberately absent: klipy.com and friends -- klipy's media
// host sits behind Cloudflare and answers 403 to a hotlinked <img>, so an embed would
// be permanently broken; a plain hyperlink is the honest result. The same goes for any
// host that needs an oEmbed/API round trip, because this page is static and does no
// server-side lookups.
const EMBED_HOST_RULES = [
  {
    name: 'giphy',
    // https://giphy.com/gifs/<slug-words>-<id>, and the bare-id form.
    // The id is the last dash-separated segment; a tracking query is tolerated.
    test: /^https?:\/\/(?:www\.)?giphy\.com\/gifs\/(?:[A-Za-z0-9._-]*-)?([A-Za-z0-9]+)\/?(?:[?#].*)?$/i,
    media: m => `https://media.giphy.com/media/${m[1]}/giphy.gif`,
  },
];

// The media URL to embed for `url`, or '' when nothing is safely derivable.
function embedMediaUrl(url) {
  let path = String(url);
  const cut = path.search(/[?#]/);
  if (cut >= 0) path = path.slice(0, cut);
  if (IMG_EXT_RE.test(path)) return url;
  for (const rule of EMBED_HOST_RULES) {
    const m = rule.test.exec(url);
    if (m) return rule.media(m);
  }
  return '';
}

// Split raw text into URL / non-URL segments.
//   non-URL -> escHtml + highlight (exactly the pre-existing behavior)
//   URL     -> an anchor whose href and label are each escaped once, never highlighted
// Query tokens therefore can only ever mark text OUTSIDE a URL -- that falls out of
// the segmentation itself, so no <mark> can ever land inside an href.
// Returns { html, embeds }; embeds is deduped and capped, each { page, media }.
function renderText(raw, tokens, opts) {
  const text = String(raw ?? '');
  const wantEmbeds = !opts || opts.embeds !== false;
  const embeds = [];
  const seen = new Set();
  let html = '';
  let last = 0;
  URL_RE.lastIndex = 0;                    // module-level /gi regex; not reentrant
  let m;
  while ((m = URL_RE.exec(text)) !== null) {
    html += highlight(text.slice(last, m.index), tokens);
    // One match can be several joined URLs; each piece links and embeds on its own.
    for (const piece of splitJoinedUrls(m[0])) {
      const url = trimUrlTail(piece);
      // Tightened allowlist. The match already guarantees it, so this is belt-and-braces
      // against a future loosening of URL_RE, not dead weight.
      if (!url || !/^https?:\/\//i.test(url)) { html += highlight(piece, tokens); continue; }
      const esc = escHtml(url);
      html += `<a class="msg-link" href="${esc}" target="_blank" rel="noopener noreferrer">${esc}</a>`;
      // Whatever trimUrlTail shaved off is ordinary text again (a joining comma, a
      // closing paren, the full stop that ended the sentence).
      html += highlight(piece.slice(url.length), tokens);
      if (wantEmbeds && embeds.length < MAX_URL_EMBEDS) {
        const media = embedMediaUrl(url);
        if (media && !seen.has(media)) { seen.add(media); embeds.push({ page: url, media }); }
      }
    }
    last = m.index + m[0].length;
    URL_RE.lastIndex = last;
  }
  html += highlight(text.slice(last), tokens);
  return { html, embeds };
}

// ── Dates (all display goes through withTZ from config.js) ──────────────────
function fmtDay(ts) {
  try {
    return new Date(ts * 1000).toLocaleDateString('en-US',
      withTZ({ weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' }));
  } catch (e) { return ''; }
}
function fmtClock(ts) {
  try {
    return new Date(ts * 1000).toLocaleTimeString('en-US',
      withTZ({ hour: '2-digit', minute: '2-digit' }));
  } catch (e) { return ''; }
}
function fmtStamp(ts) {
  try {
    return new Date(ts * 1000).toLocaleString('en-US',
      withTZ({ year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
  } catch (e) { return ''; }
}
// A YYYY-MM-DD <input type=date> value -> unix seconds, interpreted in UTC so the
// message-level bound and the chunk-level month bound (chunks are bucketed by UTC
// month, see discord_site_build invariant 3) can never disagree at a boundary.
function dateToTs(v, endOfDay) {
  if (!v) return null;
  const [y, m, d] = v.split('-').map(Number);
  if (!y || !m || !d) return null;
  return Math.floor(Date.UTC(y, m - 1, d, endOfDay ? 23 : 0, endOfDay ? 59 : 0, endOfDay ? 59 : 0) / 1000);
}
// The YYYY-MM prefix of a date input value; '' when unset. Months are zero-padded
// fixed-width strings, so plain string compare is a correct chronological compare.
function monthOf(v) {
  return (v && /^\d{4}-\d{2}/.test(v)) ? v.slice(0, 7) : '';
}
function monthLabel(m) {
  const [y, mm] = String(m || '').split('-').map(Number);
  if (!y || !mm) return String(m || '');
  // Month names are calendar labels, not instants: format at UTC noon so no
  // timezone offset can roll them into the neighbouring month.
  try {
    return new Date(Date.UTC(y, mm - 1, 15, 12)).toLocaleDateString('en-US',
      { year: 'numeric', month: 'long', timeZone: 'UTC' });
  } catch (e) { return String(m); }
}

// ── State ───────────────────────────────────────────────────────────────────
let MANIFEST = null;
let CHANNELS = [];                     // manifest.channels
const CHAN_BY_ID   = new Map();
const CHAN_BY_SLUG = new Map();
let chanIndex = [];                    // [{el, wrap, name, slug, cat}] for the filter

let INDEX   = null;   // search.json  (lazy: first search)
let AUTHORS = null;   // authors.json (lazy: first search that names an author)

const chunkCache = new Map();          // "<cid>/<month>" -> messages[]
const chunkInflight = new Map();       // "<cid>/<month>" -> Promise (request dedup)

let MODE = 'browse';                   // 'browse' | 'search'
let currentChannel = null;
// The month currently under the top of the viewport -- browse mounts several at
// once, so this is a read-out of where the reader is, not what is loaded.
let currentMonth = null;

let SEARCH = null;    // { q, gen, candidates, cursor, rendered: [...], ... }
let GEN = 0;          // bumped per search so a stale in-flight batch detects it lost
let OBSERVER = null;

// ── Continuous browse state ─────────────────────────────────────────────────
// BROWSE.lo..hi are inclusive indices into the channel's ascending months array:
// the contiguous window of chunks currently mounted in the DOM. "At the start of
// history" is lo === 0 and "at the end" is hi === months.length - 1 -- derived, so
// no flag can desync from what is on screen.
let BROWSE = null;      // { ch, lo, hi, loadingUp, loadingDown, errUp, errDown }
let BGEN = 0;           // browse generation; every await re-checks it before touching the DOM
let BOBSERVER = null;   // browse seam observer (search keeps its own OBSERVER)
let BROWSE_STASH = null;// { slug, lo, hi, anchor } saved on the browse->search edge
const MAX_MOUNTED = 5;  // chunks kept in the DOM; the rest are evicted as you scroll
const SEAM_MARGIN = 600;// px of look-ahead: observer rootMargin AND the manual re-check

// ── Data access ─────────────────────────────────────────────────────────────
function chunkKey(cid, month) { return `${cid}/${month}`; }

function chunkUrl(cid, month) {
  return `${DISCORD_BASE}/messages/${encodeURIComponent(cid)}/${encodeURIComponent(month)}.json`;
}

// Load one channel-month, memoized. Messages arrive ascending by ts.
// Two callers can want the same chunk at the same instant (a seam that fires while
// a search batch is already fetching it), so in-flight requests are shared by key.
// A rejection drops the in-flight entry, otherwise a Retry would re-await the same
// dead promise instead of refetching.
async function loadChunk(cid, month) {
  const key = chunkKey(cid, month);
  const cached = chunkCache.get(key);
  if (cached) return cached;
  let p = chunkInflight.get(key);
  if (!p) {
    p = fetchJSON(chunkUrl(cid, month)).then(data => {
      const msgs = Array.isArray(data?.messages) ? data.messages : [];
      chunkCache.set(key, msgs);
      chunkInflight.delete(key);
      return msgs;
    }, err => {
      chunkInflight.delete(key);
      throw err;
    });
    chunkInflight.set(key, p);
  }
  return p;
}

// ── Sidebar ─────────────────────────────────────────────────────────────────
function renderChannelList() {
  const listEl = document.getElementById('chanList');
  listEl.innerHTML = '';
  chanIndex = [];

  if (!CHANNELS.length) {
    listEl.innerHTML = '<div class="sidebar-empty">no channels in the archive yet</div>';
    return;
  }

  // Group by category, preserving the manifest's order within and between groups.
  const cats = new Map();
  for (const ch of CHANNELS) {
    const cat = ch.category || 'Channels';
    if (!cats.has(cat)) cats.set(cat, []);
    cats.get(cat).push(ch);
  }

  for (const [cat, chans] of cats) {
    const wrap = document.createElement('div');
    wrap.className = 'chan-cat';
    const head = document.createElement('div');
    head.className = 'cat-label';
    head.textContent = cat;                     // textContent: no escaping needed
    wrap.appendChild(head);

    for (const ch of chans) {
      const row = document.createElement('div');
      row.className = 'chan-row' + (ch.type === 'thread' ? ' thread' : '');
      row.dataset.slug = ch.slug || '';
      row.dataset.id = ch.id || '';
      row.title = ch.topic ? `#${ch.name} — ${ch.topic}` : `#${ch.name}`;
      const count = Number(ch.message_count) || 0;
      row.innerHTML =
        `<span class="chan-hash">${ch.type === 'thread' ? '↳' : '#'}</span>` +
        `<span class="chan-name">${escHtml(ch.name)}</span>` +
        `<span class="chan-count">${count.toLocaleString()}</span>`;
      row.addEventListener('click', () => selectChannel(ch.slug));
      wrap.appendChild(row);
      chanIndex.push({
        el: row, wrap,
        name: String(ch.name || '').toLowerCase(),
        slug: String(ch.slug || '').toLowerCase(),
        cat: String(cat).toLowerCase(),
      });
    }
    listEl.appendChild(wrap);
  }
}

// Display-toggle filter (no re-render), so the input keeps focus + value.
function applyChannelFilter(raw) {
  const listEl = document.getElementById('chanList');
  const q = String(raw || '').trim().toLowerCase();
  let shown = 0;
  for (const e of chanIndex) {
    const ok = !q || e.name.includes(q) || e.slug.includes(q) || e.cat.includes(q);
    e.el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  }
  // Hide a category header whose rows are all filtered out.
  for (const wrap of new Set(chanIndex.map(e => e.wrap))) {
    const any = chanIndex.some(e => e.wrap === wrap && e.el.style.display !== 'none');
    wrap.style.display = any ? '' : 'none';
  }
  const old = listEl.querySelector('.search-noresults');
  if (shown === 0 && !old) {
    const div = document.createElement('div');
    div.className = 'search-noresults';
    div.textContent = 'no channels match…';
    listEl.appendChild(div);
  } else if (shown > 0 && old) {
    old.remove();
  }
}

// ── Channel selection + month browsing ──────────────────────────────────────
function selectChannel(slug, month, scrollToId) {
  const ch = CHAN_BY_SLUG.get(String(slug || ''));
  if (!ch) return false;
  currentChannel = ch;
  try { sessionStorage.setItem('selected-discord-channel', ch.slug); } catch (e) {}

  document.querySelectorAll('.chan-row').forEach(el => el.classList.remove('active'));
  const row = document.querySelector(`.chan-row[data-slug="${CSS.escape(ch.slug || '')}"]`);
  if (row) { row.classList.add('active'); row.scrollIntoView({ block: 'nearest' }); }

  renderChannelHeader(ch);
  setMode('browse');

  const months = Array.isArray(ch.months) ? ch.months : [];
  const target = (month && months.includes(month)) ? month : months[months.length - 1];
  renderMonthNav(ch, target);
  // A fresh channel invalidates any stashed browse window (it belongs to the old
  // one), including the jump-to-context path out of search.
  BROWSE_STASH = null;
  // No month asked for -> newest, opened at the bottom like a chat client. A month
  // asked for -> land on it: centred on the message when one was named, else its top.
  quietly(openBrowse(target, scrollToId, month ? (scrollToId ? 'center' : 'top') : 'bottom'));
  return true;
}

function renderChannelHeader(ch) {
  const head = document.getElementById('chanHead');
  const count = Number(ch.message_count) || 0;
  head.innerHTML =
    `<span class="chan-title">${ch.type === 'thread' ? '↳ ' : '#'}${escHtml(ch.name)}</span>` +
    (ch.topic ? `<span class="chan-topic" title="${escHtml(ch.topic)}">${escHtml(ch.topic)}</span>` : '') +
    `<span class="chan-count-big">${count.toLocaleString()} message${count === 1 ? '' : 's'}</span>`;
}

function renderMonthNav(ch, month) {
  const sel = document.getElementById('monthSel');
  const months = Array.isArray(ch.months) ? ch.months : [];
  // Newest first in the picker; the underlying array stays ascending.
  sel.innerHTML = months.slice().reverse()
    .map(m => `<option value="${escHtml(m)}">${escHtml(monthLabel(m))}</option>`).join('');
  if (month) sel.value = month;
  sel.disabled = months.length <= 1;
}

// ── Continuous browse engine ────────────────────────────────────────────────
// The pane holds one <section class="chunk"> per mounted channel-month, wrapped by
// two seams. Scrolling towards a seam loads the next month into the same stream and
// evicts the far end, so reading never breaks; the month picker is the long jump.

function browseScaffold(sectionsHtml) {
  return `<div class="b-seam" id="seamTop"></div>` +
         `<div id="chunks">${sectionsHtml}</div>` +
         `<div class="b-seam" id="seamBot"></div>`;
}

function renderChunkSection(month, msgs) {
  return `<section class="chunk" data-month="${escHtml(month)}">${renderConversation(msgs)}</section>`;
}

// The loaders are fire-and-forget from observers, buttons and event handlers. They
// own their own error UI (the seam rows), so a rejection escaping one is a bug, not
// a user-facing state -- swallow it rather than raise an unhandled rejection.
function quietly(p) {
  if (p && typeof p.catch === 'function') p.catch(() => { /* the seam row said it */ });
}

// Record the height every image occupies RIGHT NOW. onMediaLoad then compensates for
// the difference on load, which is what makes a browser-cached image -- already laid
// out at full height, but it still fires load -- correctly cost nothing. Without the
// stamp its height is counted a second time on every re-mount and every re-render.
function stampImages(root) {
  if (!root) return;
  for (const img of root.querySelectorAll('img')) {
    img.dataset.h0 = String(img.getBoundingClientRect().height);
  }
}

// Open a channel at `month`. position: 'bottom' (newest message in view, chat-client
// style), 'top' (the month's first message), or 'center' (on scrollToId).
// Every await re-checks the generation: a channel switch mid-fetch must not paint.
async function openBrowse(month, scrollToId, position) {
  const main = document.getElementById('main');
  const ch = currentChannel;
  const gen = ++BGEN;
  if (BOBSERVER) { BOBSERVER.disconnect(); BOBSERVER = null; }
  BROWSE = null;
  currentMonth = month || null;
  if (!ch) return;

  const months = Array.isArray(ch.months) ? ch.months : [];
  if (!months.length || !month) {
    main.innerHTML = `<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span>
      <span>no archived messages in this channel</span></div>`;
    return;
  }
  const idx = months.indexOf(month);
  if (idx < 0) return openBrowse(months[months.length - 1], scrollToId, position);

  main.innerHTML = `<div class="loading-state"><span class="loading-glyph">~</span><span>wading in...</span></div>`;
  let msgs;
  try {
    msgs = await loadChunk(ch.id, month);
  } catch (e) {
    if (gen !== BGEN) return;
    // The very first chunk failed, so there is nothing to read: own the whole pane.
    // Incremental failures further up or down only take over their own seam.
    main.innerHTML = `<div class="error-state"><span class="loading-glyph">✕</span>
      <span>couldn't load ${escHtml(monthLabel(month))}<br><small>${escHtml(e.message)}</small></span>
      <button class="btn" id="browseRetry">Retry</button></div>`;
    const retry = document.getElementById('browseRetry');
    if (retry) retry.addEventListener('click', () => quietly(openBrowse(month, scrollToId, position)));
    return;
  }
  if (gen !== BGEN || MODE !== 'browse') return;

  main.innerHTML = browseScaffold(renderChunkSection(month, msgs));
  BROWSE = { ch, lo: idx, hi: idx, loadingUp: false, loadingDown: false, errUp: null, errDown: null };
  stampImages(main);
  updateSeams();
  // Point the picker at where we actually landed. updateCurrentMonth() can't do it
  // for us: currentMonth was already set above, so its "nothing changed" early-out
  // would leave the picker showing the month we came from on the paths that pick a
  // month themselves (the closeSearch fallback, the unknown-month recovery).
  const sel = document.getElementById('monthSel');
  if (sel) sel.value = month;

  if (position === 'center' && scrollToId) {
    if (!flashMessage(scrollToId)) main.scrollTop = 0;
  } else if (position === 'bottom') {
    main.scrollTop = main.scrollHeight;
    // Lazy images and web fonts settle a frame later and change the height under us,
    // so re-pin once the first layout has happened. onMediaLoad covers the rest.
    requestAnimationFrame(() => {
      if (gen === BGEN && BROWSE && MODE === 'browse') main.scrollTop = main.scrollHeight;
    });
  } else {
    main.scrollTop = 0;
  }

  // Fill first, observe second: a seam that is still on screen while the viewport is
  // half empty would otherwise fire against a window that is still being built.
  await fillViewport(gen);
  if (gen !== BGEN || MODE !== 'browse' || !BROWSE) return;
  attachSeamObserver();
  updateCurrentMonth();
}

function attachSeamObserver() {
  const main = document.getElementById('main');
  const top = document.getElementById('seamTop');
  const bot = document.getElementById('seamBot');
  if (BOBSERVER) { BOBSERVER.disconnect(); BOBSERVER = null; }
  if (!main || !top || !bot) return;
  BOBSERVER = new IntersectionObserver(entries => {
    if (MODE !== 'browse' || !BROWSE) return;
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      if (en.target.id === 'seamTop') quietly(loadOlder());
      else quietly(loadNewer());
    }
  }, { root: main, rootMargin: `${SEAM_MARGIN}px` });
  BOBSERVER.observe(top);
  BOBSERVER.observe(bot);
}

// Mount the month before the window. The guards make the loader inert at the start
// of history and while an error is showing, so a seam parked on screen can't spin.
async function loadOlder() {
  const B = BROWSE;
  if (!B || B.loadingUp || B.errUp || B.lo <= 0) return;
  const months = Array.isArray(B.ch.months) ? B.ch.months : [];
  const month = months[B.lo - 1];
  if (!month) return;

  const main = document.getElementById('main');
  const gen = BGEN;
  B.loadingUp = true;
  updateSeams();

  let msgs;
  try {
    msgs = await loadChunk(B.ch.id, month);
  } catch (e) {
    // Object identity, not just the generation: a stale loader must not clear or set
    // flags on the window that replaced it.
    if (gen !== BGEN || BROWSE !== B) return;
    B.loadingUp = false;
    B.errUp = e;
    updateSeams();
    return;
  }
  if (gen !== BGEN || BROWSE !== B || MODE !== 'browse') return;

  // loadNewer runs on its own flag, concurrently, and its evict('top') moves B.lo.
  // So the month picked before the await is not necessarily the one that belongs
  // above the window any more -- mounting it blind would skip one month and
  // duplicate another. Re-derive and bail if it moved. Same bail covers a missing
  // #chunks, which must still clear the flag or the seam wedges on "wading in...".
  const chunks = document.getElementById('chunks');
  if (!chunks || months[B.lo - 1] !== month) {
    B.loadingUp = false;
    updateSeams();
    return;
  }

  // Measure before the insert and fold the seam de-duplication into the SAME
  // measurement. Hiding a repeated day divider takes ~40px away above the reader, so
  // compensating first and de-duplicating after would jump on most seam crossings
  // (UTC month boundaries land mid-local-day for anyone west of Greenwich).
  const prevTop = main.scrollTop;
  const prevH = main.scrollHeight;
  chunks.insertAdjacentHTML('afterbegin', renderChunkSection(month, msgs));
  B.lo--;
  dedupeSeams();
  stampImages(chunks.firstElementChild);
  // Everything already on screen moved down by exactly what landed above it. Assign
  // rather than +=, so an intermediate clamp can't be baked into the result.
  main.scrollTop = prevTop + (main.scrollHeight - prevH);
  B.loadingUp = false;

  evict('bottom');
  updateSeams();
  updateCurrentMonth();
  // The observer does not re-fire promptly after we mutate the DOM ourselves, so
  // keep filling by hand while the seam is still inside the look-ahead band. This
  // mirrors sentinelVisible() in search.
  if (seamNear('seamTop')) return loadOlder();
}

// Mount the month after the window. Appending happens below the reading position,
// so there is nothing to compensate.
async function loadNewer() {
  const B = BROWSE;
  if (!B || B.loadingDown || B.errDown) return;
  const months = Array.isArray(B.ch.months) ? B.ch.months : [];
  if (B.hi >= months.length - 1) return;
  const month = months[B.hi + 1];
  if (!month) return;

  const gen = BGEN;
  B.loadingDown = true;
  updateSeams();

  let msgs;
  try {
    msgs = await loadChunk(B.ch.id, month);
  } catch (e) {
    if (gen !== BGEN || BROWSE !== B) return;
    B.loadingDown = false;
    B.errDown = e;
    updateSeams();
    return;
  }
  if (gen !== BGEN || BROWSE !== B || MODE !== 'browse') return;

  // Mirror of loadOlder: loadOlder's evict('bottom') moves B.hi under us, so the
  // month captured before the await has to be re-checked before it is mounted.
  const chunks = document.getElementById('chunks');
  if (!chunks || months[B.hi + 1] !== month) {
    B.loadingDown = false;
    updateSeams();
    return;
  }

  // Appending happens below the reading position, so there is nothing to compensate
  // and the de-duplication down here is free.
  chunks.insertAdjacentHTML('beforeend', renderChunkSection(month, msgs));
  B.hi++;
  dedupeSeams();
  stampImages(chunks.lastElementChild);
  B.loadingDown = false;

  evict('top');                        // re-dedupes inside its own measurement window
  updateSeams();
  updateCurrentMonth();
  if (seamNear('seamBot')) return loadNewer();
}

// Drop chunks off the far end so the DOM stays small. No spacer stands in for what
// left: the scrollbar represents the mounted window (Discord does the same) and the
// month picker is the long-range navigator.
function evict(end) {
  const B = BROWSE;
  const main = document.getElementById('main');
  const chunks = document.getElementById('chunks');
  if (!B || !main || !chunks) return;
  // Never move an index out from under the loader that is mid-flight on that side:
  // it captured its month before its await and is about to mount it. Trimming the
  // other end is always safe, and whatever we skip here the next evict picks up.
  if (end === 'top' && B.loadingUp) return;
  if (end === 'bottom' && B.loadingDown) return;

  while (chunks.children.length > MAX_MOUNTED) {
    const victim = end === 'top' ? chunks.firstElementChild : chunks.lastElementChild;
    if (!victim) return;
    // MAX_MOUNTED is a soft target, not a cap: never evict down to a window that no
    // longer overflows the pane by more than the look-ahead band on BOTH sides, or
    // both seams sit inside it, the two loaders take turns adding and evicting, and
    // the pane fetches forever. A sparse channel therefore legitimately holds more
    // than MAX_MOUNTED sections -- bounded by content height, not by section count,
    // and a few extra sections in the DOM is the cheaper trade.
    if (main.scrollHeight - victim.offsetHeight < main.clientHeight + 2 * SEAM_MARGIN) return;
    if (end === 'top') {
      const prevTop = main.scrollTop;
      const prevH = main.scrollHeight;
      victim.remove();
      B.lo++;
      // Losing the first section can strand a seam-dup on the new first section's
      // opening divider. Re-dedupe INSIDE the measurement window: that height change
      // is above the reader too and belongs in the same single correction.
      dedupeSeams();
      // Assign, never -=. The removal itself clamps scrollTop when the evicted
      // section is taller than everything left below it, and a read-modify-write on
      // an already-clamped value throws the reader to the top of the pane. Measure
      // with scrollHeight, NOT the section's offsetHeight: day-divider margins
      // collapse through the section edge, so offsetHeight under-reports what goes.
      main.scrollTop = prevTop - (prevH - main.scrollHeight);
    } else {
      // Below the reading position, so in principle nothing to fix up -- except that
      // removing a bottom chunk that dwarfs the rest shortens the scroll range and
      // clamps scrollTop anyway. Hold a message instead of trusting the number.
      const anchor = captureAnchor();
      victim.remove();
      B.hi--;
      restoreAnchor(anchor);
    }
  }
}

// A channel whose newest month is a handful of messages leaves the pane unscrollable
// and the seams unable to fire, so pull neighbours in until it scrolls. Termination
// is by index movement, never by height: a chunk that adds no height still counts.
async function fillViewport(gen) {
  const main = document.getElementById('main');
  for (let guard = 0; guard < 40; guard++) {
    if (gen !== BGEN || MODE !== 'browse') return;
    const B = BROWSE;
    if (!B || !main) return;
    if (main.scrollHeight > main.clientHeight + 1) return;
    const months = Array.isArray(B.ch.months) ? B.ch.months : [];
    const lo = B.lo, hi = B.hi;
    if (B.lo > 0) await loadOlder();
    else if (B.hi < months.length - 1) await loadNewer();
    else return;                       // whole channel is mounted; nothing left
    if (gen !== BGEN || BROWSE !== B) return;
    if (B.lo === lo && B.hi === hi) return;   // a guard or an error blocked it: stop
  }
}

// Is a seam inside the look-ahead band? Same margin as the observer's rootMargin.
function seamNear(id) {
  const main = document.getElementById('main');
  const seam = document.getElementById(id);
  if (!main || !seam) return false;
  const r = main.getBoundingClientRect();
  const s = seam.getBoundingClientRect();
  return id === 'seamTop' ? s.bottom >= r.top - SEAM_MARGIN : s.top <= r.bottom + SEAM_MARGIN;
}

// Repaint both seams from BROWSE. At the ends of history they become static markers
// and their loaders are inert, so an observer hit there costs nothing.
function updateSeams() {
  const B = BROWSE;
  const top = document.getElementById('seamTop');
  const bot = document.getElementById('seamBot');
  if (!B || !top || !bot) return;
  const months = Array.isArray(B.ch.months) ? B.ch.months : [];
  paintSeam(top, 'up',   B.errUp,   B.loadingUp,   B.lo <= 0,                 'the beginning of the archive');
  paintSeam(bot, 'down', B.errDown, B.loadingDown, B.hi >= months.length - 1, 'the end of the archive');
}

function paintSeam(el, dir, err, loading, atEdge, edgeText) {
  if (err) {
    el.innerHTML = `<span class="seam-err">couldn't load — ${escHtml(err.message)}</span>` +
      `<button class="btn" data-seam-retry="${dir}">Retry</button>`;
    const btn = el.querySelector('[data-seam-retry]');
    // Clearing the error is what un-blocks the loader; until then the observer keeps
    // hitting an inert seam instead of retrying in a loop.
    if (btn) btn.addEventListener('click', () => {
      const B = BROWSE;
      if (!B) return;
      if (dir === 'up') B.errUp = null; else B.errDown = null;
      updateSeams();
      quietly(dir === 'up' ? loadOlder() : loadNewer());
    });
    return;
  }
  if (loading) { el.innerHTML = `<span>wading in...</span>`; return; }
  el.innerHTML = atEdge ? `<span>${escHtml(edgeText)}</span>` : '';
}

// Chunks are bucketed by UTC month but dividers are labelled in local time, so the
// last day of one chunk and the first day of the next can be the same local day.
// Hide the repeat; re-evaluate every time (a timezone switch regroups the days).
function dedupeSeams() {
  const chunks = document.getElementById('chunks');
  if (!chunks) return;
  const secs = [...chunks.children];
  for (let i = 0; i < secs.length; i++) {
    const first = secs[i].querySelector('.day-divider');
    if (!first) continue;
    const prevDivs = i > 0 ? secs[i - 1].querySelectorAll('.day-divider') : [];
    const prevLast = prevDivs.length ? prevDivs[prevDivs.length - 1] : null;
    first.classList.toggle('seam-dup', !!prevLast && prevLast.textContent === first.textContent);
  }
}

// The month picker reads out where the reader is: the last mounted section whose top
// has passed the top of the pane.
function updateCurrentMonth() {
  const chunks = document.getElementById('chunks');
  const main = document.getElementById('main');
  if (!BROWSE || !chunks || !main) return;
  const limit = main.getBoundingClientRect().top + 10;
  let month = null;
  for (const sec of chunks.children) {
    if (sec.getBoundingClientRect().top <= limit) month = sec.dataset.month;
  }
  if (!month) month = chunks.firstElementChild ? chunks.firstElementChild.dataset.month : null;
  if (!month || month === currentMonth) return;
  currentMonth = month;
  const sel = document.getElementById('monthSel');
  // Setting .value in script fires no change event, so this cannot feed back.
  if (sel) sel.value = month;
}

// Reading position as "this message sat N px below the top of the pane". Survives a
// re-render that changes heights (a timezone switch merges or splits day dividers),
// which a raw scrollTop would not.
function captureAnchor() {
  const main = document.getElementById('main');
  if (!main) return null;
  const mainTop = main.getBoundingClientRect().top;
  for (const el of main.querySelectorAll('.msg')) {
    const r = el.getBoundingClientRect();
    if (r.bottom > mainTop) return { id: el.id, delta: r.top - mainTop };
  }
  return null;
}

function restoreAnchor(a) {
  const main = document.getElementById('main');
  if (!a || !a.id || !main) return;
  const el = document.getElementById(a.id);
  if (!el) return;                     // the anchor is gone: leave scrollTop alone
  main.scrollTop += (el.getBoundingClientRect().top - main.getBoundingClientRect().top) - a.delta;
}

// Opening search tears the browse window down; remember enough to put it back with
// zero fetches. Guarded on BROWSE so a second setMode('search') (runSearch's early
// hint/empty paths call it too) cannot overwrite the real stash with nothing.
function stashBrowse() {
  const B = BROWSE;
  if (!B) return;
  BROWSE_STASH = { slug: B.ch.slug, lo: B.lo, hi: B.hi, anchor: captureAnchor() };
}

// Rebuild the stashed window synchronously from chunkCache. Everything that was
// mounted is cached by construction, so this never touches the network; a miss can
// only mean the cache was cleared, and then a plain open is the honest answer.
function restoreBrowse(stash) {
  const main = document.getElementById('main');
  const ch = stash ? CHAN_BY_SLUG.get(String(stash.slug || '')) : null;
  const months = ch && Array.isArray(ch.months) ? ch.months : [];
  if (!ch || !months.length) return;
  BGEN++;                              // retire anything still in flight from before
  if (BOBSERVER) { BOBSERVER.disconnect(); BOBSERVER = null; }
  BROWSE = null;

  const secs = [];
  for (let i = stash.lo; i <= stash.hi; i++) {
    const m = months[i];
    const msgs = m ? chunkCache.get(chunkKey(ch.id, m)) : null;
    if (!msgs) { quietly(openBrowse(months[months.length - 1], null, 'bottom')); return; }
    secs.push(renderChunkSection(m, msgs));
  }
  main.innerHTML = browseScaffold(secs.join(''));
  BROWSE = { ch, lo: stash.lo, hi: stash.hi, loadingUp: false, loadingDown: false, errUp: null, errDown: null };
  stampImages(main);
  dedupeSeams();
  updateSeams();
  restoreAnchor(stash.anchor);
  attachSeamObserver();
  updateCurrentMonth();
}

// Attachment images carry no intrinsic size, so they lay out at zero height and grow
// (up to 360px) when the bytes land. Growth ABOVE the reading position shoves the
// page down, so hand that height back. 'load' does not bubble -- hence the
// capture-phase listener on the pane, which catches mounts, prepends and appends
// alike. Video/audio are preload=none and never grow on their own.
//
// Compensate for the DIFFERENCE against the stamp, not the raw height: a
// browser-cached image lays out at full height immediately and STILL fires load, so
// paying its full height again would drift the pane by the sum of every image above
// the reader on every re-mount, re-render and restore.
function onMediaLoad(e) {
  const img = e.target;
  if (MODE !== 'browse' || !img || img.tagName !== 'IMG') return;
  const main = document.getElementById('main');
  if (!main) return;
  const r = img.getBoundingClientRect();
  const grew = r.height - (Number(img.dataset.h0) || 0);
  img.dataset.h0 = String(r.height);
  if (grew > 0 && r.top < main.getBoundingClientRect().top) main.scrollTop += grew;
}

// Signed Discord CDN URLs expire and giphy ids rot, so a URL embed is allowed to fail:
// drop the picture and keep the hyperlink in the text above it, which is the real
// content. Attachments are left alone -- their broken icon is information. 'error' does
// not bubble any more than 'load' does, hence the same capture-phase listener.
function onMediaError(e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.closest) return;
  const embed = img.closest('.url-embed');
  if (!embed) return;
  // No shrink compensation on purpose: an embed that errored never painted, so it was
  // holding ~0px (its stamped h0 is ~0 too) and hiding it moves the pane by nothing.
  embed.style.display = 'none';
  const box = embed.parentElement;
  if (box && box.classList.contains('url-embeds') &&
      !Array.prototype.some.call(box.children, c => c.style.display !== 'none')) {
    box.style.display = 'none';
  }
}

// Day dividers + messages, ascending. Messages carry id="m<id>" so a search hit can
// jump straight to one.
function renderConversation(msgs, tokens) {
  const byId = new Map();
  for (const m of msgs) if (m && m.id != null) byId.set(String(m.id), m);
  let html = '';
  let lastDay = null;
  for (const m of msgs) {
    const day = fmtDay(m.ts);
    if (day !== lastDay) {
      html += `<div class="day-divider"><span>${escHtml(day)}</span></div>`;
      lastDay = day;
    }
    html += renderMessage(m, byId, tokens);
  }
  return html;
}

// Hover tooltip carrying the name form the label does NOT show: the display name
// in user mode, "@username" in display mode. Empty when the message has no `user`
// (then the two forms are one string and there is nothing extra to show). escHtml
// escapes the quote character, so this is safe to interpolate into an attribute.
function userTitle(m) {
  if (!m || !m.user) return '';
  const other = getNameMode() === 'display' ? `@${m.user}` : (m.author ?? '');
  return other ? ` title="${escHtml(other)}"` : '';
}

function renderMessage(m, byId, tokens) {
  const reply = m.reply_to != null ? renderReply(m.reply_to, byId) : '';
  const body = renderText(m.text, tokens);
  const text = m.text
    ? `<div class="msg-text">${body.html}</div>`
    : '';
  return `<div class="msg" id="m${escHtml(m.id)}">
    ${reply}
    <div class="msg-head">
      <span class="msg-user"${userTitle(m)}>${escHtml(authorLabel(m))}</span>
      <span class="msg-time">${escHtml(fmtClock(m.ts))}</span>
      ${m.edited ? '<span class="msg-edited">(edited)</span>' : ''}
    </div>
    ${text}
    ${renderPoll(m.poll)}
    ${renderUrlEmbeds(body.embeds)}
    ${renderAttachments(m.attachments)}
    ${renderReactions(m.reactions)}
  </div>`;
}

// The reply target is only resolvable if it sits in the same loaded chunk (a reply
// across a month boundary shows the raw id instead).
function renderReply(rid, byId) {
  const target = byId ? byId.get(String(rid)) : null;
  if (!target) {
    return `<div class="reply-line">↩ <span>replying to #${escHtml(rid)}</span></div>`;
  }
  const snippet = String(target.text ?? '').replace(/\s+/g, ' ').slice(0, 90);
  return `<div class="reply-line">↩ <a data-jump-msg="${escHtml(rid)}">replying to
    <span class="reply-user">${escHtml(authorLabel(target))}</span></a>
    <span>${escHtml(snippet)}</span></div>`;
}

// Embeds for URLs found in the message text. Same wrapper/markup as an image
// attachment (so stampImages + onMediaLoad, which walk every <img> under the pane,
// cover them with no extra wiring) plus .url-embed, which marks them as droppable:
// unlike an attachment, a dead embed can just disappear -- see onMediaError.
function renderUrlEmbeds(embeds) {
  if (!Array.isArray(embeds) || !embeds.length) return '';
  const parts = embeds.map(e => {
    const page  = escHtml(safeUrl(e?.page));
    const media = escHtml(safeUrl(e?.media));
    if (!page || !media) return '';
    return `<a class="att-img url-embed" href="${page}" target="_blank" rel="noopener noreferrer">
      <img loading="lazy" src="${media}" alt=""></a>`;
  }).join('');
  return parts ? `<div class="atts url-embeds">${parts}</div>` : '';
}

function renderAttachments(atts) {
  if (!Array.isArray(atts) || !atts.length) return '';
  const parts = atts.map(a => {
    const url  = escHtml(safeUrl(a?.url));
    const name = escHtml(a?.name ?? 'attachment');
    if (!url) return `<span class="att-file">${name}</span>`;
    switch (a?.kind) {
      case 'image':
        // archive.org is external, so target=_blank is right here.
        return `<a class="att-img" href="${url}" target="_blank" rel="noopener noreferrer">
          <img loading="lazy" src="${url}" alt="${name}" title="${name}"></a>`;
      case 'video':
        return `<video class="att-media" controls preload="none" src="${url}"></video>`;
      case 'audio':
        return `<audio class="att-media" controls preload="none" src="${url}"></audio>`;
      default:
        return `<a class="att-file" href="${url}" target="_blank" rel="noopener noreferrer">📎 ${name}</a>`;
    }
  });
  return `<div class="atts">${parts.join('')}</div>`;
}

function renderReactions(reacts) {
  if (!Array.isArray(reacts) || !reacts.length) return '';
  const chips = reacts.map(r =>
    `<span class="react">${escHtml(r?.e ?? '')} ${Number(r?.n) || 0}</span>`).join('');
  return `<div class="reacts">${chips}</div>`;
}

// A poll patched in by the backend's API pass (DCE can't export poll bodies).
// Counts render as fill bars scaled to the winning share of the total; voter
// lists (non-anonymous on Discord) sit behind a native <details> so a long
// roster costs no vertical space until opened.
function renderPoll(p) {
  if (!p || typeof p !== 'object') return '';
  const answers = Array.isArray(p.answers) ? p.answers : [];
  const total = answers.reduce((s, a) => s + (Number(a?.n) || 0), 0);
  const rows = answers.map(a => {
    const n = Number(a?.n) || 0;
    const pct = total ? Math.round(n / total * 100) : 0;
    const label = `${a?.emoji ? escHtml(a.emoji) + ' ' : ''}${escHtml(a?.text ?? '')}`;
    const voters = Array.isArray(a?.voters) && a.voters.length
      ? `<details class="poll-voters"><summary>${a.voters.length} voter${a.voters.length === 1 ? '' : 's'}</summary>
          <div>${a.voters.map(v => escHtml(voterLabel(v))).join(', ')}</div></details>`
      : '';
    return `<div class="poll-ans">
      <i class="poll-bar" style="width:${pct}%"></i>
      <span class="poll-ans-text">${label}</span>
      <span class="poll-ans-n">${n} · ${pct}%</span>
    </div>${voters}`;
  }).join('');
  const bits = [`${total} vote${total === 1 ? '' : 's'}`];
  if (p.multi) bits.push('multiple choice');
  bits.push(p.final ? 'final results' : 'poll open');
  return `<div class="poll">
    <div class="poll-q">📊 ${escHtml(p.q ?? '')}</div>
    ${rows}
    <div class="poll-foot">${bits.join(' · ')}</div>
  </div>`;
}

// Scroll a rendered message into view and flash it. Ids come from the data, so use
// getElementById rather than a selector (no escaping question at all). Returns
// whether the message was actually on screen, so callers can fall back.
function flashMessage(msgId) {
  const el = document.getElementById('m' + String(msgId));
  if (!el) return false;
  el.scrollIntoView({ block: 'center' });
  el.classList.remove('flash');
  void el.offsetWidth;                 // restart the animation
  el.classList.add('flash');
  return true;
}

// ── Mode switching ──────────────────────────────────────────────────────────
function setMode(mode) {
  MODE = mode;
  document.getElementById('searchToggle').classList.toggle('on', mode === 'search');
  if (mode === 'browse') {
    // Leaving search: stop any in-flight batch loop from rendering into the pane.
    GEN++;
    if (OBSERVER) { OBSERVER.disconnect(); OBSERVER = null; }
    SEARCH = null;
  } else {
    // Leaving browse: photograph the mounted window and the reading position BEFORE
    // the teardown, because the teardown drops the state stashBrowse reads.
    stashBrowse();
    BGEN++;
    if (BOBSERVER) { BOBSERVER.disconnect(); BOBSERVER = null; }
    BROWSE = null;
  }
}

// ── Search ──────────────────────────────────────────────────────────────────
async function ensureIndex() {
  if (!INDEX) INDEX = await fetchJSON(`${DISCORD_BASE}/search.json`);
  return INDEX;
}
async function ensureAuthors() {
  if (!AUTHORS) AUTHORS = await fetchJSON(`${DISCORD_BASE}/authors.json`);
  return AUTHORS;
}

async function runSearch() {
  const main = document.getElementById('main');

  // Retire the previous search FIRST, before any early return below. A hint/error/
  // empty result must still invalidate an in-flight batch loop: if the old search
  // kept its generation, its finishSearch() would land after this call and overwrite
  // the pane with the old query's state (and the old OBSERVER would be left watching
  // a detached sentinel). The real search re-bumps GEN once it has candidates.
  GEN++;
  if (OBSERVER) { OBSERVER.disconnect(); OBSERVER = null; }
  SEARCH = null;

  const rawQ = document.getElementById('q').value.trim();
  const rawAuthor = document.getElementById('author').value.trim();
  const fromV = document.getElementById('dateFrom').value;
  const toV   = document.getElementById('dateTo').value;

  const q = {
    tokens: tokenize(rawQ),
    author: rawAuthor ? normUser(rawAuthor) : null,
    scope: document.getElementById('scope').value === 'current' && currentChannel
      ? currentChannel.id : null,
    fromMonth: monthOf(fromV),
    toMonth:   monthOf(toV),
    from: dateToTs(fromV, false),
    to:   dateToTs(toV, true),
  };

  if (!q.tokens.length && !q.author && q.from == null && q.to == null) {
    setMode('search');
    main.innerHTML = `<div class="hint-state"><span class="loading-glyph" style="font-size:34px;">?</span>
      <span>Search the Discord archive.<br>Type a word, or filter by author or date.</span></div>`;
    return;
  }

  setMode('search');
  main.innerHTML = `<div class="loading-state"><span class="loading-glyph">~</span><span>reading the index…</span></div>`;

  try {
    await ensureIndex();
    if (q.author) await ensureAuthors();
  } catch (e) {
    main.innerHTML = `<div class="error-state"><span class="loading-glyph">✕</span>
      <span>couldn't load the search index<br><small>${escHtml(e.message)}</small></span></div>`;
    return;
  }
  if (MODE !== 'search') return;       // the user left search while the index loaded

  const cand = resolveCandidates(q);
  if (!cand.length) {
    main.innerHTML = `<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span>
      <span>nothing in the index matches those filters</span></div>`;
    return;
  }

  const gen = ++GEN;
  if (OBSERVER) { OBSERVER.disconnect(); OBSERVER = null; }
  SEARCH = {
    q, gen, candidates: cand, cursor: 0,
    loading: false, done: false, paused: false,
    shownMsgs: 0, shownChunks: 0, scanned: 0, autoScan: 0,
    rendered: [],                      // [{cid, month, msgs}] -- kept for tz re-render
  };

  main.innerHTML =
    `<div class="result-count" id="resultStatus"></div><div id="groups"></div><div id="sentinel"></div>`;
  updateStatus();

  OBSERVER = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) loadNextBatch();
  }, { root: main, rootMargin: '600px' });
  OBSERVER.observe(document.getElementById('sentinel'));

  loadNextBatch();
}

// Index-only candidate resolution: which chunks CAN contain a hit.
function resolveCandidates(q) {
  const chunks = Array.isArray(INDEX?.chunks) ? INDEX.chunks : [];
  let cand = null;                     // null = "all so far"

  for (const tok of q.tokens) {
    const postings = INDEX.tokens?.[tok];
    if (!postings) return [];          // unknown token -> nothing matches
    cand = cand === null ? postings.slice() : intersectSorted(cand, postings);
    if (!cand.length) return [];
  }

  if (q.author) {
    const postings = AUTHORS?.authors?.[q.author] || [];
    cand = cand === null ? postings.slice() : intersectSorted(cand, postings);
    if (!cand.length) return [];
  }

  if (cand === null) cand = chunks.map((_, i) => i);

  // Chunk-level metadata filters. Months are fixed-width YYYY-MM, so a plain
  // string compare is a chronological compare.
  const out = cand.filter(i => {
    const c = chunks[i];
    if (!c) return false;
    if (q.scope && String(c.c) !== String(q.scope)) return false;
    if (q.fromMonth && String(c.m) < q.fromMonth) return false;
    if (q.toMonth   && String(c.m) > q.toMonth) return false;
    return true;
  });

  // Newest chunk first, so the first page is the most recent conversation.
  out.sort((a, b) => {
    const A = chunks[a], B = chunks[b];
    if (A.m !== B.m) return A.m < B.m ? 1 : -1;
    return String(A.c).localeCompare(String(B.c));
  });
  return out;
}

// Message-level second pass: the index is chunk-grain, so every candidate chunk
// still has to be checked message by message.
function matchMessages(all, q) {
  return (all || []).filter(m => {
    // Either name matches: the display name, or the account username when the
    // message carries one. authors.json indexes both, so the candidate chunks are
    // already right; this is the exact check inside them.
    //
    // The `m.user &&` guard is required, not defensive: normUser('') returns
    // 'unknown', which is a REAL key (blank-author messages), so testing
    // normUser(m.user || '') would make a search for "unknown" match every
    // message that simply has no `user`.
    if (q.author && normUser(m.author) !== q.author &&
        !(m.user && normUser(m.user) === q.author)) return false;
    if (q.from != null && (m.ts == null || m.ts < q.from)) return false;
    if (q.to   != null && (m.ts == null || m.ts > q.to)) return false;
    // Poll question/answer text is searchable -- this mirrors build_search's
    // token index exactly, so a candidate chunk always yields a visible hit.
    let hay = String(m.text ?? '');
    if (m.poll) {
      hay += ' ' + (m.poll.q ?? '');
      for (const a of m.poll.answers || []) hay += ' ' + (a?.text ?? '');
    }
    const lc = hay.toLowerCase();
    for (const tok of q.tokens) if (!lc.includes(tok)) return false;
    return true;
  });
}

// Hydrate + render the next BATCH of candidate chunks. Re-entrant-safe via S.loading;
// a stale search (GEN changed) drops on return so it never renders into a new query.
async function loadNextBatch() {
  const S = SEARCH;
  if (!S || S.loading || S.done || S.paused || S.gen !== GEN) return;
  if (S.cursor >= S.candidates.length) { finishSearch(); return; }

  S.loading = true;
  const chunks = INDEX.chunks;
  const slice = S.candidates.slice(S.cursor, S.cursor + BATCH);
  S.cursor += slice.length;

  let batch;
  try {
    batch = await Promise.allSettled(slice.map(i => loadChunk(chunks[i].c, chunks[i].m)));
  } catch (e) {
    batch = [];
  }
  if (S.gen !== GEN) return;           // a newer search superseded us; drop this result

  const groupsEl = document.getElementById('groups');
  let batchHits = 0;
  slice.forEach((idx, k) => {
    S.scanned++;
    const res = batch[k];
    if (!res || res.status !== 'fulfilled') return;
    const c = chunks[idx];
    const hits = matchMessages(res.value, S.q);
    if (!hits.length) return;
    batchHits += hits.length;
    S.shownChunks++;
    S.shownMsgs += hits.length;
    const group = { cid: String(c.c), month: String(c.m), msgs: hits };
    S.rendered.push(group);
    if (groupsEl) groupsEl.insertAdjacentHTML('beforeend', renderHitGroup(group, S.q.tokens));
  });

  S.loading = false;

  if (S.cursor >= S.candidates.length) { finishSearch(); return; }

  // Auto-fill while the sentinel is still on screen, but cap a continuous run of
  // empty batches so a restrictive filter on a common token can't silently fetch
  // hundreds of chunks.
  S.autoScan = batchHits ? 0 : S.autoScan + slice.length;
  if (S.autoScan >= MAX_AUTOSCAN) { pauseAutoScan(); return; }
  updateStatus();
  if (sentinelVisible()) loadNextBatch();
}

function sentinelVisible() {
  const main = document.getElementById('main');
  const sentinel = document.getElementById('sentinel');
  if (!main || !sentinel) return false;
  const r = main.getBoundingClientRect();
  const s = sentinel.getBoundingClientRect();
  return s.top <= r.bottom + 600;      // matches the observer rootMargin
}

function renderHitGroup(group, tokens) {
  const ch = CHAN_BY_ID.get(group.cid);
  const label = ch ? `${ch.type === 'thread' ? '↳ ' : '#'}${ch.name}` : `#${group.cid}`;
  const rows = group.msgs.map(m => `<div class="hit">
      <div class="hit-head" style="background:none;border:none;padding:0 0 2px;">
        <span class="msg-user"${userTitle(m)}>${escHtml(authorLabel(m))}</span>
        <span class="hit-meta">${escHtml(fmtStamp(m.ts))}</span>
        <a class="jump-link hit-count" data-jump-c="${escHtml(group.cid)}"
           data-jump-m="${escHtml(group.month)}" data-jump-id="${escHtml(m.id)}">jump to context →</a>
      </div>
      <div class="msg-text">${renderText(m.text, tokens, { embeds: false }).html}</div>
      ${renderPoll(m.poll)}
      ${renderAttachments(m.attachments)}
    </div>`).join('');
  return `<div class="hit-group">
    <div class="hit-head">
      <span class="hit-chan">${escHtml(label)}</span>
      <span class="hit-meta">${escHtml(monthLabel(group.month))}</span>
      <span class="hit-meta hit-count">${group.msgs.length} hit${group.msgs.length === 1 ? '' : 's'}</span>
    </div>
    ${rows}
  </div>`;
}

function updateStatus() {
  const S = SEARCH;
  const el = document.getElementById('resultStatus');
  if (!S || !el) return;
  const total = S.candidates.length;
  const msgs = `${S.shownMsgs} message${S.shownMsgs === 1 ? '' : 's'}`;
  if (S.cursor >= total) {
    el.innerHTML = S.shownMsgs
      ? `${msgs} in ${S.shownChunks} channel-month${S.shownChunks === 1 ? '' : 's'} <span style="opacity:0.5;">· ${total} scanned</span>`
      : '';
  } else {
    el.innerHTML = `${msgs} so far <span style="opacity:0.5;">· scanning ${S.scanned}/${total} channel-months…</span>`;
  }
}

function finishSearch() {
  const S = SEARCH;
  if (!S) return;
  S.done = true;
  if (OBSERVER) { OBSERVER.disconnect(); OBSERVER = null; }
  const sentinel = document.getElementById('sentinel');
  if (sentinel) sentinel.remove();
  updateStatus();
  if (!S.shownMsgs) {
    document.getElementById('main').innerHTML =
      `<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span>
       <span>no messages match — the terms are indexed in ${S.candidates.length} channel-month${S.candidates.length === 1 ? '' : 's'} but no message passed your filters</span></div>`;
  }
}

// Stop auto-fetching after a long empty run; let the user opt to keep going.
function pauseAutoScan() {
  const S = SEARCH;
  if (!S) return;
  S.paused = true;
  S.autoScan = 0;
  const sentinel = document.getElementById('sentinel');
  if (!sentinel) return;
  const remain = S.candidates.length - S.cursor;
  sentinel.innerHTML =
    `<button class="btn" id="keepScanning" style="display:block;margin:14px auto;">Keep scanning (${remain} more)</button>`;
  const btn = document.getElementById('keepScanning');
  if (btn) btn.addEventListener('click', () => {
    sentinel.innerHTML = '';
    S.paused = false;
    loadNextBatch();
  });
  updateStatus();
}

// ── Timezone / name-mode switch: repaint every visible message ──────────────
// config.js helpers read the zone -- and authorLabel/userTitle the name mode --
// at render time, so a plain re-render is enough.
function rerenderMessages() {
  if (MODE === 'search') {
    const S = SEARCH;
    const groupsEl = document.getElementById('groups');
    if (!S || !groupsEl) return;
    groupsEl.innerHTML = S.rendered.map(g => renderHitGroup(g, S.q.tokens)).join('');
    return;
  }
  const B = BROWSE;

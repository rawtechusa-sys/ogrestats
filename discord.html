  const chunks = document.getElementById('chunks');
  if (!B || !chunks) return;
  // A new zone can merge or split day dividers, so the pane's height changes and a
  // plain scrollTop restore drifts. Hold a message instead.
  const anchor = captureAnchor();
  for (const sec of chunks.children) {
    const msgs = chunkCache.get(chunkKey(B.ch.id, sec.dataset.month));
    if (msgs) sec.innerHTML = renderConversation(msgs);
  }
  dedupeSeams();
  stampImages(chunks);                 // fresh <img> elements: re-stamp before they load
  restoreAnchor(anchor);
  updateCurrentMonth();                // every height just changed
}

// ── Wiring ──────────────────────────────────────────────────────────────────
function wire() {
  let filterDebounce = null;
  const chanSearch = document.getElementById('chanSearch');
  chanSearch.addEventListener('input', () => {
    clearTimeout(filterDebounce);
    filterDebounce = setTimeout(() => applyChannelFilter(chanSearch.value), 120);
  });

  document.getElementById('monthSel').addEventListener('change', e => {
    setMode('browse');
    quietly(openBrowse(e.target.value, null, 'top'));
  });

  const mainEl = document.getElementById('main');
  // The picker follows the reader. Throttled to one read per frame: this runs on
  // every scroll event and each call measures section rects.
  let monthTick = false;
  mainEl.addEventListener('scroll', () => {
    if (MODE !== 'browse' || monthTick) return;
    monthTick = true;
    requestAnimationFrame(() => { monthTick = false; updateCurrentMonth(); });
  }, { passive: true });
  // 'load' does not bubble, so the pane can only hear its images finish in the
  // capture phase. See onMediaLoad for why it matters.
  mainEl.addEventListener('load', onMediaLoad, true);
  mainEl.addEventListener('error', onMediaError, true);

  const nameToggle = document.getElementById('nameToggle');
  nameToggle.classList.toggle('on', getNameMode() === 'display');
  nameToggle.addEventListener('click', () => {
    const next = getNameMode() === 'display' ? 'user' : 'display';
    try { localStorage.setItem('discord-name-mode', next); } catch (e) {}
    nameToggle.classList.toggle('on', next === 'display');
    rerenderMessages();
  });

  const filters = document.getElementById('filters');
  document.getElementById('searchToggle').addEventListener('click', () => {
    const opening = filters.style.display === 'none';
    filters.style.display = opening ? '' : 'none';
    if (opening) {
      // Light the button as soon as the panel opens, not only once a search runs.
      document.getElementById('searchToggle').classList.add('on');
      document.getElementById('q').focus();
    } else {
      closeSearch();
    }
  });
  document.getElementById('closeSearch').addEventListener('click', closeSearch);
  document.getElementById('searchBtn').addEventListener('click', runSearch);

  // Native suggestions for the Author field. One-shot, on first focus: authors.json
  // is only otherwise fetched when a search actually filters by author, and this
  // must not put it on the page-load path.
  document.getElementById('author').addEventListener('focus', async () => {
    const dl = document.getElementById('authorOptions');
    if (!dl) return;
    let index;
    try {
      index = await ensureAuthors();
    } catch (e) {
      return;                            // suggestions are a convenience; typing still works
    }
    // The keys are already normalized lowercase (chat_search_index._norm_username),
    // which is exactly what normUser() produces from what the user types -- so a
    // picked suggestion is an exact index key, never a near-miss. They cover both
    // display names and account usernames.
    //
    // Uncapped: ~100-200 entries at current scale renders instantly. If the roster
    // ever explodes, slice this list rather than dropping the datalist.
    const names = Object.keys(index?.authors || {}).sort();
    dl.innerHTML = names.map(n => `<option value="${escHtml(n)}"></option>`).join('');
  }, { once: true });
  ['q', 'author', 'dateFrom', 'dateTo'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') runSearch();
    });
  });
  document.getElementById('scope').addEventListener('change', () => {
    if (MODE === 'search' && SEARCH) runSearch();
  });

  // Delegated: "jump to context" in search results, and in-chunk reply links.
  document.getElementById('main').addEventListener('click', e => {
    const jump = e.target.closest('[data-jump-c]');
    if (jump) {
      const ch = CHAN_BY_ID.get(jump.dataset.jumpC);
      if (!ch) return;
      document.getElementById('filters').style.display = 'none';
      selectChannel(ch.slug, jump.dataset.jumpM, jump.dataset.jumpId);
      return;
    }
    const reply = e.target.closest('[data-jump-msg]');
    if (reply) flashMessage(reply.dataset.jumpMsg);
  });
}

function closeSearch() {
  document.getElementById('filters').style.display = 'none';
  document.getElementById('searchToggle').classList.remove('on');
  if (MODE !== 'search') return;
  setMode('browse');
  if (!currentChannel) return;
  // Put the reader back exactly where search interrupted them, from cache. The stash
  // belongs to one channel; anything else (a jump to context changed channel) opens
  // that channel fresh at its newest month.
  const stash = BROWSE_STASH;
  if (stash && stash.slug === currentChannel.slug) {
    restoreBrowse(stash);
  } else {
    const months = Array.isArray(currentChannel.months) ? currentChannel.months : [];
    quietly(openBrowse(months[months.length - 1], null, 'bottom'));
  }
}

// ── Load ────────────────────────────────────────────────────────────────────
async function load() {
  const main = document.getElementById('main');
  try {
    MANIFEST = await fetchJSON(`${DISCORD_BASE}/manifest.json`);
    CHANNELS = Array.isArray(MANIFEST?.channels) ? MANIFEST.channels : [];
    CHAN_BY_ID.clear(); CHAN_BY_SLUG.clear();
    for (const ch of CHANNELS) {
      if (ch?.id) CHAN_BY_ID.set(String(ch.id), ch);
      if (ch?.slug) CHAN_BY_SLUG.set(String(ch.slug), ch);
    }

    // Server header. The icon lives on archive.org and may 404 -- hide it then.
    const head = document.getElementById('serverHead');
    const name = MANIFEST?.server?.name || 'Discord';
    const iconUrl = safeUrl(MANIFEST?.server?.icon_url);
    head.innerHTML = (iconUrl
        ? `<img class="server-icon" id="serverIcon" src="${escHtml(iconUrl)}" alt="">`
        : '') +
      `<span class="server-name" title="${escHtml(name)}">${escHtml(name)}</span>`;
    const icon = document.getElementById('serverIcon');
    if (icon) icon.addEventListener('error', () => { icon.style.display = 'none'; });

    renderChannelList();
    wire();

    if (!CHANNELS.length) {
      main.innerHTML = `<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span>
        <span>the archive is empty</span></div>`;
      return;
    }

    // Deep link / last visit first (the shell stashes #discord/<slug> here), else
    // the first channel that actually has messages.
    let want = null;
    try { want = sessionStorage.getItem('selected-discord-channel'); } catch (e) {}
    if (!want || !selectChannel(want)) {
      const first = CHANNELS.find(c => Array.isArray(c.months) && c.months.length) || CHANNELS[0];
      selectChannel(first.slug);
    }
  } catch (e) {
    document.getElementById('chanList').innerHTML =
      `<div class="sidebar-empty">couldn't reach the swamp<br><small>${escHtml(e.message)}</small></div>`;
    main.innerHTML = `<div class="error-state"><span class="loading-glyph">✕</span>
      <span>couldn't load the Discord archive<br><small>${escHtml(e.message)}</small></span></div>`;
  }
}

load();
</script>
